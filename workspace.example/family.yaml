# Family Hub Configuration
# Copy this file to workspace/family.yaml and customize for your family.

family:
  name: "The Riveras"
  timezone: "America/Los_Angeles"
  locale: "en-US"

# Family members — one entry per person, in the order the hub displays them.
# Each member must have a corresponding file in workspace/members/<id>.yaml,
# whose calendarIds the hub shows and whose email(s) identify them at sign-in.
#   color      — the member's color on the hub page (required if you run the hub app)
#   shortName  — what the hub calls them, if different from name
members:
  - id: "alex"
    name: "Alex"
    role: "adult"
    color: "#2563eb"
  - id: "jordan"
    name: "Jordan"
    role: "adult"
    color: "#7c3aed"
  - id: "sam"
    name: "Samantha"
    shortName: "Sam"
    role: "child"
    color: "#db2777"
  - id: "riley"
    name: "Riley"
    role: "child"
    color: "#16a34a"

# Inputs: where the hub's data comes from (docs/inputs.md). Trips, escape rooms,
# movies, notes, and the grocery list need no entry: they're on when their file exists.
inputs:
  google-calendar: {}
  apple-reminders: {}          # macOS only
  # icloud-album:              # an iCloud shared album with Public Website on
  #   album: "https://photos.icloud.com/shared/album/…"   # keep your hub repo private: anyone with the link can view the album

# The planner (docs/architecture.md#the-brain).
brain:
  model: "claude-opus-5-5"
  daysAhead: 14

# The stream every screen rotates through (docs/stream.md). Leave this out for
# every component, in the default order.
stream:
  components: [today, photos, trips, plan, grocery, week, past-trips, escape-rooms, movies, workouts]
  dwell: { default: 15, today: 30 }
  max:
    movies: 2
    past-trips: 1

# Outputs (docs/outputs.md). Screens work without an entry; list one to change its stream.
outputs:
  roku:
    stream: { photosBetween: 3, dwell: 10 }
  google-calendar: {}          # writes the planner's notes into events
  # grocery-email:             # app/extras/grocery-email.gs
  #   url: "https://script.google.com/macros/s/…/exec"

# Hub app settings (read by app/build.mjs). See app/README.md.
hub:
  title: "Rivera Family Hub"

  # People who join trips but aren't family members. An email lets their sign-in
  # pick their player in a trip app; their calendars are never fetched.
  guests:
    grandma: { email: "grandma@example.com" }
    cousin-lee: {}

  # Trips with a phone app (a folder in your hub repo; see docs/trip-apps.md).
  tripApps: []
  #  - trip: "beach-jul-2027"      # the trip's id in trips.yaml
  #    path: "/beach/"             # the folder, served at this path
  #    appId: "beach-2027"         # window.TRIP.id in its trip-data.js
  #    guests: [grandma]           # who can score besides the family
