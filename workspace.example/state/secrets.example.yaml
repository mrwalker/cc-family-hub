# A reference for secrets.yaml. Never put the real file in a repo: keep it in
# HUB_SECRETS_DIR (for example ~/.config/family-hub, chmod 700). See docs/workspace.md#secrets.

# The planner's Claude API key, for `family-hub plan` and `run`. Not needed when
# an assistant such as Claude Code plans (/daily-plan). An ANTHROPIC_API_KEY
# environment variable works too.
anthropic:
  apiKey: "sk-ant-YOUR_KEY_HERE"

# Publishing to your hub (integrations/outputs/hub-api/README.md). The pipeline
# publishes whenever this entry exists.
hub-api:
  url: "https://hub.example.com"
  publishToken: "..."          # = the Worker's PUBLISH_TOKEN secret
  accessClientId: "...access"  # the pipeline's Cloudflare Access service token
  accessClientSecret: "..."

# Google Calendar uses its own key file next to this one, google-service-account.json.
# `family-hub setup calendars` checks it.

# Strava (`family-hub setup strava` writes this entry).
# strava:
#   members: {}
