# Secrets template — copy to workspace/state/secrets.yaml and fill in real values.
# workspace/state/secrets.yaml is gitignored and never committed.

# google-calendar tokens are set up via `npm run setup:calendars` (Chrome extension)
# or manually via `npm run auth:google-calendar`
google-calendar:
  clientId: "YOUR_CLIENT_ID.apps.googleusercontent.com"
  clientSecret: "YOUR_CLIENT_SECRET"
  # Per-member tokens — populated automatically by the setup tool
  members:
    alex:
      email: "alex@gmail.com"
      refreshToken: "YOUR_REFRESH_TOKEN"
    jordan:
      email: "jordan@gmail.com"
      refreshToken: "YOUR_REFRESH_TOKEN"

wall-display:
  deviceUrl: "http://192.168.1.100:8080"
  apiKey: "YOUR_API_KEY"

