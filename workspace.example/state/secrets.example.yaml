# Secrets template — copy to workspace/state/secrets.yaml and fill in real values.
# Get your Anthropic API key from https://console.anthropic.com/
anthropic:
  apiKey: "sk-ant-YOUR_KEY_HERE"

# workspace/state/secrets.yaml is gitignored and never committed.

# Google Calendar uses a separate service account key file, not an entry here.
# See tools/calendar-setup/README.md for setup instructions.
# Key file location: workspace/state/google-service-account.json

# github-pages output integration
# Writes plan data directly to a local repo clone and git pushes.
# Requires GitHub Pro for Pages on private repos.
# github-pages:
#   repoPath: "/absolute/path/to/your-family-hub"  # local clone of your portal repo
#   autoPush: true                                  # set false to commit without pushing

wall-display:
  deviceUrl: "http://192.168.1.100:8080"
  apiKey: "YOUR_API_KEY"

