<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Household</title>
  <!--
    Household records: where the family writes (worker/household.js).
    Made for a phone, and safe for the wall tablet's old WebView (Chrome 80):
    no CSS inset, no flexbox gap, no <dialog>, no crypto.randomUUID.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f0f5; --card: #ffffff; --border: #e4e4e7; --text: #18181b; --muted: #71717a;
      --accent: #2563eb; --accent-light: #eff6ff; --urgent: #dc2626; --urgent-light: #fef2f2;
      --warn: #d97706; --warn-light: #fffbeb; --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    }
    [data-theme="dark"] {
      --bg: #0f0f12; --card: #1c1c22; --border: #2e2e38; --text: #f0f0f5; --muted: #8888a0;
      --accent: #3b82f6; --accent-light: #1e2a45; --urgent-light: #2d1515; --warn-light: #2a1f0a;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.45;
      padding: 16px 16px 80px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    a { color: var(--accent); }

    .top { margin-bottom: 14px; }
    .top a { font-size: 14px; text-decoration: none; }
    .top h1 { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .who { font-size: 13px; color: var(--muted); }

    .banner {
      background: var(--warn-light); border: 1px solid var(--warn); border-radius: var(--radius);
      padding: 12px 14px; margin-bottom: 14px; font-size: 14px;
    }
    .status { min-height: 22px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .status.is-error { color: var(--urgent); }

    .tabs { margin-bottom: 14px; }
    .tabs button { margin: 0 8px 8px 0; }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    button, .btn {
      font: inherit; font-size: 15px; cursor: pointer; color: var(--text);
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 14px; min-height: 42px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-left: 6px; padding-right: 6px; }
    button.small { min-height: 34px; padding: 4px 10px; font-size: 14px; }
    button.danger { color: var(--urgent); }
    button:disabled { opacity: .5; cursor: default; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px;
    }
    .card h2 { font-size: 20px; font-weight: 700; }
    .card-head { position: relative; padding-right: 70px; margin-bottom: 6px; }
    .card-head .quiet { position: absolute; right: -6px; top: -8px; }
    .sub { font-size: 13px; color: var(--muted); }
    .section-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
      color: var(--muted); margin: 22px 0 8px;
    }

    .task { border-top: 1px solid var(--border); padding: 12px 0 10px 42px; position: relative; }
    .card > .task:first-child, .card-head + .task { border-top: 0; }
    .card > .task:first-child { padding-top: 0; }
    .card > .task:first-child .task-emoji { top: -1px; }
    .task-emoji { position: absolute; left: 0; top: 11px; font-size: 26px; line-height: 1.2; }
    .task-title { font-size: 17px; font-weight: 600; }
    .task-who { font-size: 14px; }
    .task-when { font-size: 14px; color: var(--muted); }
    .task.is-overdue .task-when { color: var(--urgent); font-weight: 600; }
    .task.is-soon .task-when { color: var(--warn); font-weight: 600; }
    .booking { font-size: 14px; color: var(--muted); }
    .booking.is-booked { color: #15803d; }
    .booking.to-book { color: var(--warn); }
    .task-more { font-size: 13px; color: var(--muted); margin-top: 2px; word-break: break-word; }
    .task-actions { margin-top: 8px; }
    .task-actions button { margin: 0 8px 6px 0; }
    .each { margin-top: 4px; font-size: 14px; }
    .each-row { padding: 4px 0; position: relative; padding-right: 80px; min-height: 34px; }
    .each-row button { position: absolute; right: 0; top: 0; }
    .empty { color: var(--muted); font-size: 14px; padding: 8px 0 4px; }
    .log-row { font-size: 14px; padding: 8px 0; border-top: 1px solid var(--border); position: relative; padding-right: 76px; }
    .log-row button { position: absolute; right: 0; top: 1px; }
    .next-list { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .thumbs { margin-top: 10px; }
    .thumb { display: inline-block; vertical-align: top; text-align: center; margin: 0 8px 8px 0; }
    .thumb img { display: block; width: 96px; height: 96px; object-fit: cover; border-radius: 8px; background: var(--border); }
    .thumb button { margin-top: 2px; }
    label.btn { display: inline-block; line-height: 24px; }
    label.btn.small { min-height: 34px; padding: 4px 10px; font-size: 14px; }

    /* Forms */
    .form { background: var(--accent-light); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 10px 0 4px; }
    .form h3 { font-size: 17px; margin-bottom: 10px; }
    .field { margin-bottom: 12px; }
    .field > label, .field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .field .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
    input, select, textarea {
      font: inherit; font-size: 16px; width: 100%; color: var(--text);
      background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; min-height: 42px;
    }
    textarea { min-height: 70px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; }
    .row3 { display: grid; grid-template-columns: 90px 1fr; grid-gap: 10px; }
    .check { display: inline-block; font-size: 15px; margin: 0 14px 6px 0; font-weight: 400; }
    .check input { width: auto; min-height: 0; margin-right: 6px; }
    .form-actions button { margin: 4px 8px 0 0; }
    .hidden { display: none !important; }

    /* Chores */
    .day-nav { position: relative; text-align: center; margin: 4px 0 12px; min-height: 42px; }
    .day-nav .day-title { font-size: 18px; font-weight: 700; line-height: 42px; }
    .day-nav .prev { position: absolute; left: 0; top: 0; }
    .day-nav .next { position: absolute; right: 0; top: 0; }
    .kid { border-left: 6px solid var(--border); }
    .kid h2 .jobs { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 6px; }
    .chore { border-top: 1px solid var(--border); padding: 12px 0; position: relative; padding-right: 120px; min-height: 66px; }
    .chore:first-of-type { border-top: 0; }
    .chore-title { font-size: 17px; font-weight: 600; }
    .chore-when { font-size: 14px; color: var(--muted); }
    .chore.is-late .chore-when { color: var(--urgent); font-weight: 600; }
    .chore.is-done .chore-title { color: var(--muted); text-decoration: line-through; }
    .chore.is-done .chore-when { color: #15803d; }
    .chore.is-missed .chore-when { color: var(--urgent); }
    .chore .chore-btn { position: absolute; right: 0; top: 12px; min-width: 104px; }
    .chore .chore-btn.big { min-height: 48px; font-size: 17px; }
    .jobs-table { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: fixed; }
    .jobs-table th:first-child { width: 32%; } .jobs-table th:last-child { width: 28%; }
    .jobs-table td { overflow: hidden; text-overflow: ellipsis; }
    .jobs-table th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 4px 6px 6px 0; }
    .jobs-table td { border-top: 1px solid var(--border); padding: 8px 6px 8px 0; vertical-align: middle; }
    .jobs-table select { min-height: 36px; padding: 4px 6px; font-size: 15px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
    .setup-row { border-top: 1px solid var(--border); padding: 10px 0; position: relative; padding-right: 150px; min-height: 52px; }
    .setup-row:first-of-type { border-top: 0; }
    .setup-row .actions { position: absolute; right: 0; top: 8px; }
    .setup-row .actions button { margin-left: 6px; }
    .job-edit { display: grid; grid-template-columns: 1fr 70px 44px; grid-gap: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/">‹ Hub</a>
    <h1>Household</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="banner hidden" id="banner"></div>
  <div class="status" id="status"></div>
  <div class="tabs hidden" id="tabs"></div>
  <div id="main"></div>
</div>

<script>
// The same theme as the hub page.
try { if (localStorage.getItem("hub-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}

const API = "/api/household";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let state = null;        // the last answer from the API
let area = null;         // the tab that's showing
let form = null;         // the open form: { type, key, ... }
let showArchived = false;
let showEach = {};       // bundle key → showing each pet's own buttons
let busy = false;
let uploading = false;   // photos are going up
let picking = 0;         // when a photo picker was opened (0: none open)

// What "+ Add" offers first. Picking one fills in the kind, the name and how it repeats.
const PRESETS = {
  pets: [
    { label: "Heartworm pill", kind: "medication", every: 1, unit: "month", from: "due" },
    { label: "Flea & tick", kind: "medication", every: 1, unit: "month", from: "due" },
    { label: "Rabies vaccine", kind: "vaccination", every: 1, unit: "year" },
    { label: "DHPP vaccine", kind: "vaccination", every: 1, unit: "year" },
    { label: "Bordetella vaccine", kind: "vaccination", every: 1, unit: "year" },
    { label: "Teeth cleaning", kind: "dental", every: 1, unit: "year" },
    { label: "Annual checkup", kind: "vet-visit", every: 1, unit: "year" },
    { label: "Nail trim", kind: "grooming", every: 6, unit: "week" },
    { label: "Grooming", kind: "grooming", every: 8, unit: "week" },
    { label: "Boarding", kind: "boarding" },
    { label: "Vet visit", kind: "vet-visit" },
    { label: "Something else", kind: "other", title: "" },
  ],
  house: [
    { label: "HVAC filter", kind: "maintenance", every: 3, unit: "month" },
    { label: "Smoke detector batteries", kind: "maintenance", every: 1, unit: "year" },
    { label: "Gutters", kind: "maintenance", every: 6, unit: "month" },
    { label: "Water heater flush", kind: "maintenance", every: 1, unit: "year" },
    { label: "Lawn service", kind: "service", every: 1, unit: "week", from: "due" },
    { label: "Cleaning", kind: "service", every: 2, unit: "week", from: "due" },
    { label: "Pest control", kind: "service", every: 3, unit: "month", from: "due" },
    { label: "Septic service", kind: "service", every: 3, unit: "year" },
    { label: "A fix", kind: "fix", title: "" },
    { label: "Something else", kind: "maintenance", title: "" },
  ],
};

// ── Talking to the hub ─────────────────────────────────────────────
function setStatus(text, isError) {
  const el = $("status");
  el.textContent = text || "";
  el.className = "status" + (isError ? " is-error" : "");
}

function request(path, body) {
  const opts = { credentials: "same-origin" };
  if (body !== undefined) { opts.method = "POST"; opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(body); }
  return fetch(API + path, opts).then(r => r.json().catch(() => ({ error: `The hub answered ${r.status}` })).then(data => {
    if (!r.ok || data.error) throw new Error(data.error || `The hub answered ${r.status}`);
    return data;
  }), err => {
    // The request never got an answer: the browser stopped it, or something on the
    // way did. Tell the hub (reads get through), so it's in the logs.
    const q = ["path=" + encodeURIComponent(path), "error=" + encodeURIComponent(err && err.message || ""),
               "name=" + encodeURIComponent(err && err.name || ""), "online=" + (navigator.onLine ? "1" : "0"),
               "page=" + encodeURIComponent(location.pathname + location.hash)].join("&");
    try { fetch(API + "/diag?" + q, { credentials: "same-origin" }); } catch (e) {}
    const said = err && err.message ? ` (your browser said “${err.message}”)` : "";
    throw new Error(`That didn't reach the hub${said}. Reload the page and try again.`);
  });
}

function load() {
  const path = area === "chores" && choreDay ? "/chores?day=" + choreDay : "";
  return request(path).then(data => { state = data; render(); }).catch(e => setStatus(`Couldn't load: ${e.message}`, true));
}

/** Sends a change, then redraws from the hub's answer. */
function send(path, body, doneText) {
  if (busy) return Promise.resolve(false);
  if (choreDay && /^\/(chores|undo)/.test(path)) body = Object.assign({ day: choreDay }, body || {});
  busy = true;
  setStatus("Saving…");
  return request(path, body || {}).then(data => {
    state = data; busy = false; setStatus(doneText || "Saved");
    return true;
  }).catch(e => { busy = false; setStatus(e.message, true); return false; });
}

function newId(prefix) {
  const bytes = new Uint8Array(9);
  crypto.getRandomValues(bytes);
  return prefix + "-" + Array.prototype.map.call(bytes, b => ("0" + b.toString(16)).slice(-2)).join("");
}

// ── Dates ──────────────────────────────────────────────────────────
const noon = day => new Date(day + "T12:00:00Z");
const daysUntil = day => Math.round((noon(day) - noon(state.today)) / 86400000);
const dateText = (day, opts) => noon(day).toLocaleDateString(undefined, Object.assign({ timeZone: "UTC" }, opts));
const shortDate = day => dateText(day, { weekday: "short", month: "short", day: "numeric", year: Math.abs(daysUntil(day)) > 300 ? "numeric" : undefined });
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function timeText(time) {
  const parts = time.split(":");
  return new Date(Date.UTC(2000, 0, 1, +parts[0], +parts[1])).toLocaleTimeString(undefined, { timeZone: "UTC", hour: "numeric", minute: "2-digit" });
}

function relative(day) {
  const n = daysUntil(day);
  if (n < 0) return `${plural(-n, "day")} ago · ${shortDate(day)}`;
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  return `In ${plural(n, "day")} · ${shortDate(day)}`;
}

function repeatText(task) {
  if (!task.repeatEvery) return "";
  const every = task.repeatEvery === 1 ? `Every ${task.repeatUnit}` : `Every ${plural(task.repeatEvery, task.repeatUnit)}`;
  return every + (task.repeatFrom === "due" ? ", on schedule" : ", from when it's done");
}

function ageText(birthday) {
  const months = Math.floor((noon(state.today) - noon(birthday)) / (86400000 * 30.44));
  if (months < 0) return "";
  return months < 24 ? plural(months, "month") + " old" : plural(Math.floor(months / 12), "year") + " old";
}

const memberName = id => { const m = state.members.find(x => x.id === id); return m ? m.name : id; };
const kindOf = t => (state.areas[t.area] && state.areas[t.area].kinds[t.kind]) || { emoji: "•", label: t.kind };
const whenOf = t => (t.booked && t.apptDate ? t.apptDate : t.dueDate);
const livePets = () => state.pets.filter(p => !p.archived);
const livePlaces = () => state.places.filter(p => !p.archived);

/** "Pepper", "Pepper & Mochi", or "All 4 dogs". */
function petsText(tasks) {
  const names = tasks.map(t => t.petName).filter(Boolean);
  const all = livePets();
  if (names.length > 2 && names.length === all.length) {
    const species = all.every(p => (p.species || "").toLowerCase() === "dog") ? "dogs" : "pets";
    return `All ${names.length} ${species}`;
  }
  return names.length < 2 ? names[0] || "" : `${names.slice(0, -1).join(", ")} & ${names[names.length - 1]}`;
}

// ── Bundles: the same task for several pets, on the same day ───────
function bundles(tasks) {
  const out = [], byKey = {};
  tasks.forEach(t => {
    const key = t.groupId ? [t.groupId, whenOf(t) || "", t.booked, t.apptTime || "", t.endDate || ""].join("|") : t.id;
    if (byKey[key]) { byKey[key].tasks.push(t); return; }
    byKey[key] = { key, task: t, tasks: [t] };
    out.push(byKey[key]);
  });
  out.forEach(b => b.tasks.sort((x, y) => String(x.petName).localeCompare(String(y.petName))));
  return out;
}
const sortBundles = list => list.sort((a, b) => {
  const da = whenOf(a.task), db = whenOf(b.task);
  if (!da || !db) return da ? -1 : db ? 1 : a.task.title.localeCompare(b.task.title);
  return da.localeCompare(db) || String(a.task.apptTime || a.task.dueTime || "").localeCompare(String(b.task.apptTime || b.task.dueTime || ""));
});
const findBundle = key => bundles(state.tasks.filter(t => !t.archived)).find(b => b.key === key);

// ── Drawing ────────────────────────────────────────────────────────
function render() {
  const main = $("main");
  if (!state.enabled) {
    $("banner").classList.add("hidden");
    main.innerHTML = `<div class="card"><h2>Not set up yet</h2><p class="sub" style="margin-top:6px">
      Household records need a database on this hub. See “Household records” in the hub's getting-started guide.</p></div>`;
    return;
  }
  const v = state.viewer;
  $("who").textContent = v ? `Signed in as ${v.name}` : "";
  const banner = $("banner");
  const cal = state.calendar || {};
  const choresTab = area === "chores" || (!area && v && v.role === "child");
  if (!state.can.manage && !(choresTab && state.can.tick)) {
    banner.textContent = v ? (state.can.tick ? "You can tick chores done. Only adults can change the rest." : "You can look, but only adults can make changes here.")
      : `You can look, but changes are off: ${state.problem}`;
    banner.classList.remove("hidden");
  } else if (cal.problem) {
    // Saved here, but the calendar didn't get it.
    banner.textContent = `Saved, but the calendar couldn't be updated: ${cal.problem}`;
    banner.classList.remove("hidden");
  } else banner.classList.add("hidden");

  const areas = Object.keys(state.areas).concat("chores");
  const label = a => (state.areas[a] ? state.areas[a].label : "Chores");
  // Kids start on their chores.
  if (!area || areas.indexOf(area) < 0) area = areas.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : v && v.role === "child" ? "chores" : areas[0];
  const tabs = $("tabs");
  tabs.classList.toggle("hidden", areas.length < 2);
  tabs.innerHTML = areas.map(a => `<button data-do="area" data-id="${a}" class="${a === area ? "active" : ""}">${esc(label(a))}</button>`).join("");

  main.innerHTML = area === "pets" ? petsView() : area === "house" ? houseView() : area === "chores" ? choresView() : listView(area);
  wirePhotoInputs();
  const first = main.querySelector(".form input:not([type=checkbox]), .form select");
  if (first && form && form.fresh) { first.focus(); form.fresh = false; }
}

/** One row: a task, or the same task for several pets on one day. */
function bundleRow(b) {
  const task = b.task, kind = kindOf(task);
  if (form && form.type === "task" && form.key === b.key) return taskForm(b);
  if (form && form.type === "book" && form.key === b.key) return bookForm(b);
  const date = whenOf(task);
  const n = date ? daysUntil(date) : null;
  const staying = kind.stay && task.booked && task.endDate && n !== null && n <= 0 && daysUntil(task.endDate) >= 0;
  const cls = task.archived ? "" : staying ? " is-soon" : n !== null && n < 0 ? " is-overdue" : n !== null && n <= 1 ? " is-soon" : "";
  const who = petsText(b.tasks) || (task.assignee ? memberName(task.assignee) : "");

  let when;
  if (task.archived) when = "Archived";
  else if (!date) when = "Whenever";
  else if (kind.stay && task.endDate) when = staying ? `Away until ${shortDate(task.endDate)}` : `${relative(date)} – ${dateText(task.endDate, { month: "short", day: "numeric" })}`;
  else if (n < 0) when = `${task.booked || kind.appointment ? "Was" : "Overdue ·"} ${relative(date)}`;
  else when = relative(date);
  const time = task.booked ? task.apptTime : task.dueTime;
  if (time && date && n >= 0) when += ` · ${timeText(time)}`;

  let booking = "";
  if (!task.archived && kind.bookable) {
    booking = task.booked
      ? `<div class="booking is-booked">Booked${task.dueDate && task.apptDate && task.apptDate !== task.dueDate ? ` · due ${esc(dateText(task.dueDate, { month: "short", day: "numeric" }))}` : ""}</div>`
      : `<div class="booking to-book">Not booked yet</div>`;
  }
  const more = [];
  if (task.repeatEvery) more.push(esc(repeatText(task)));
  if (task.provider) more.push(esc(task.provider));
  if (task.phone) more.push(`<a href="tel:${esc(task.phone.replace(/[^0-9+]/g, ""))}">${esc(task.phone)}</a>`);
  if (task.url) more.push(`<a href="${esc(task.url)}" target="_blank" rel="noopener">Link</a>`);
  if (task.area !== "pets" && task.assignee) more.push(esc(memberName(task.assignee)));

  const manage = state.can.manage, many = b.tasks.length > 1;
  let actions = "", each = "";
  if (manage && task.archived) actions = `<button data-do="restore" data-id="${task.id}">Restore</button>`;
  else if (manage) {
    actions = `<button class="primary" data-do="${many ? "done-all" : "done"}" data-id="${task.id}">${many ? "Done for all" : "Done"}</button>`
      + (kind.bookable ? `<button data-do="book" data-key="${esc(b.key)}">${task.booked ? "Change booking" : "Book"}</button>` : "")
      + `<button data-do="edit" data-key="${esc(b.key)}">Edit</button>`
      + (many ? `<button class="quiet" data-do="each" data-key="${esc(b.key)}">${showEach[b.key] ? "Hide" : "One at a time"}</button>` : "");
    if (many && showEach[b.key]) {
      each = `<div class="each">` + b.tasks.map(t => `<div class="each-row">${esc(t.petName)}
        <button class="small" data-do="done" data-id="${t.id}">Done</button></div>`).join("") + `</div>`;
    }
  }
  return `<div class="task${cls}">
    <div class="task-emoji">${kind.emoji}</div>
    <div class="task-title">${esc(task.title)}</div>
    ${who && task.area === "pets" ? `<div class="task-who">${esc(who)}</div>` : ""}
    <div class="task-when">${esc(when)}</div>
    ${booking}
    ${more.length ? `<div class="task-more">${more.join(" · ")}</div>` : ""}
    ${task.notes ? `<div class="task-more">${esc(task.notes)}</div>` : ""}
    ${actions ? `<div class="task-actions">${actions}</div>` : ""}
    ${each}
  </div>`;
}

function petsView() {
  const manage = state.can.manage;
  const pets = livePets();
  const tasks = state.tasks.filter(t => t.area === "pets");
  const live = sortBundles(bundles(tasks.filter(t => !t.archived)));
  let html = "";

  html += `<div class="section-label">Coming up</div><div class="card">`;
  html += live.length ? live.map(bundleRow).join("") : `<div class="empty">Nothing scheduled.${manage && pets.length ? " Add a shot, a pill, a cleaning or a stay." : ""}</div>`;
  if (form && form.type === "task" && !form.key && form.area === "pets") html += taskForm(null);
  else if (manage && pets.length) html += `<div class="task-actions" style="margin-top:12px"><button data-do="add-task" data-area="pets">+ Add</button></div>`;
  html += `</div>`;

  html += `<div class="section-label">${pets.length ? "The pets" : "Pets"}</div>`;
  pets.forEach(pet => {
    if (form && form.type === "pet" && form.id === pet.id) { html += petForm(pet); return; }
    const facts = [pet.species, pet.birthday ? ageText(pet.birthday) : ""].filter(Boolean).join(" · ");
    const next = sortBundles(bundles(tasks.filter(t => !t.archived && t.petId === pet.id))).slice(0, 4)
      .map(b => `${esc(b.task.title)}${whenOf(b.task) ? ` · ${esc(dateText(whenOf(b.task), { month: "short", day: "numeric" }))}` : ""}`);
    html += `<div class="card">
      <div class="card-head">
        <h2>${esc(pet.name)}</h2>
        ${facts ? `<div class="sub">${esc(facts)}</div>` : ""}
        ${pet.notes ? `<div class="sub">${esc(pet.notes)}</div>` : ""}
        ${manage ? `<button class="quiet" data-do="edit-pet" data-id="${pet.id}">Edit</button>` : ""}
      </div>
      <div class="next-list">${next.length ? "Next: " + next.join("; ") : "Nothing scheduled."}</div>
      ${(pet.photos || []).length ? `<div class="thumbs">${pet.photos.map(ph => `<div class="thumb"><img src="${API}/photo/${ph.id}" alt="" loading="lazy">
        ${manage ? `<button class="small quiet" data-do="remove-photo" data-id="${ph.id}">Remove</button>` : ""}</div>`).join("")}</div>` : ""}
      ${manage ? `<div class="task-actions"><label class="btn small">${(pet.photos || []).length ? "+ Another photo" : "+ Add a photo"}<input type="file" accept="image/*" multiple class="f-photo hidden" data-id="${pet.id}"></label></div>` : ""}
    </div>`;
  });
  if (!pets.length && !(form && form.type === "pet")) {
    html += `<div class="card"><div class="empty">No pets yet.${manage ? " Add one to start keeping track of shots, medications, grooming, cleanings and boarding." : ""}</div></div>`;
  }
  if (form && form.type === "pet" && !form.id) html += petForm(null);
  else if (manage) html += `<button data-do="add-pet">+ Add a pet</button>`;
  return html + recentView("pets") + archivedView(tasks);
}

/** The house: one card per place, each with its tasks. */
function houseView() {
  const manage = state.can.manage;
  const places = livePlaces();
  const tasks = state.tasks.filter(t => t.area === "house");
  const live = tasks.filter(t => !t.archived);
  let html = "";
  const section = (placeId, title, sub) => {
    const list = sortBundles(bundles(live.filter(t => (t.placeId || null) === placeId)));
    const place = places.find(p => p.id === placeId);
    if (place && form && form.type === "place" && form.id === place.id) return placeForm(place);
    const adding = form && form.type === "task" && !form.key && form.area === "house" && (form.placeId || null) === placeId;
    return `<div class="card">
      <div class="card-head">
        <h2>${esc(title)}</h2>
        ${sub ? `<div class="sub">${esc(sub)}</div>` : ""}
        ${manage && place ? `<button class="quiet" data-do="edit-place" data-id="${place.id}">Edit</button>` : ""}
      </div>
      ${list.length ? list.map(bundleRow).join("") : `<div class="empty">Nothing scheduled.</div>`}
      ${adding ? taskForm(null) : manage ? `<div class="task-actions" style="margin-top:12px"><button data-do="add-task" data-area="house" data-place="${placeId || ""}">+ Add${place ? ` at ${esc(place.name)}` : ""}</button></div>` : ""}
    </div>`;
  };
  places.forEach(p => { html += section(p.id, p.name, p.address); });
  const loose = live.filter(t => !t.placeId || !places.some(p => p.id === t.placeId));
  if (!places.length) html += section(null, "The house", "");
  else if (loose.length) html += section(null, "No place yet", "Edit these to say which house they're for.");
  if (form && form.type === "place" && !form.id) html += placeForm(null);
  else if (manage) html += `<button data-do="add-place">+ Add a place</button>`;
  return html + recentView("house") + archivedView(tasks);
}

function listView(areaId) {
  const tasks = state.tasks.filter(t => t.area === areaId);
  const list = sortBundles(bundles(tasks.filter(t => !t.archived)));
  return `<div class="card">${list.length ? list.map(bundleRow).join("") : `<div class="empty">Nothing scheduled.</div>`}</div>` + recentView(areaId) + archivedView(tasks);
}

/** What was done lately. One action (a group's "done for all") is one row and one undo. */
function recentView(areaId) {
  const manage = state.can.manage;
  const rows = [], byAction = {};
  state.log.filter(l => l.area === areaId).forEach(l => {
    if (l.actionId && byAction[l.actionId]) { byAction[l.actionId].pets.push(l.pet); return; }
    const row = Object.assign({}, l, { pets: [l.pet] });
    if (l.actionId) byAction[l.actionId] = row;
    rows.push(row);
  });
  if (!rows.length) return "";
  // Only the latest action on each task can be taken back.
  const latest = {};
  state.log.forEach(l => { if (!latest[l.taskId]) latest[l.taskId] = l.actionId || l.id; });
  return `<div class="section-label">Recently done</div><div class="card">` + rows.slice(0, 15).map((r, i) => {
    const undoable = manage && latest[r.taskId] === (r.actionId || r.id);
    const pets = r.pets.filter(Boolean);
    return `<div class="log-row" ${i === 0 ? 'style="border-top:0"' : ""}>
      <strong>${esc(r.title)}</strong>${pets.length ? ` · ${esc(pets.length > 2 ? plural(pets.length, "pet") : pets.join(" & "))}` : ""} · ${esc(dateText(r.doneOn, { month: "short", day: "numeric" }))}${r.doneBy ? ` · ${esc(memberName(r.doneBy))}` : ""}
      ${r.note ? `<div class="sub">${esc(r.note)}</div>` : ""}
      ${undoable ? (r.actionId ? `<button class="small" data-do="undo-action" data-id="${r.actionId}">Undo</button>` : `<button class="small" data-do="undo" data-id="${r.taskId}">Undo</button>`) : ""}
    </div>`;
  }).join("") + `</div>`;
}

function archivedView(tasks) {
  const archived = tasks.filter(t => t.archived);
  if (!archived.length) return "";
  return `<div class="section-label"><button class="quiet" data-do="toggle-archived">${showArchived ? "Hide" : "Show"} archived (${archived.length})</button></div>` +
    (showArchived ? `<div class="card">${archived.map(t => bundleRow({ key: t.id, task: t, tasks: [t] })).join("")}</div>` : "");
}

// ── Chores ─────────────────────────────────────────────────────────
// Each kid's chores for a day, the week's jobs, and (for adults) the setup.
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const CADENCE_LABELS = { daily: "Every day (or some days)", weekly: "Once a week", "as-needed": "As needed", "when-asked": "When asked" };
let choreDay = null;      // the day the Chores tab is showing (null: today)
let showSetup = false;    // adults: the chores setup is open
let showArchivedChores = false;

const C = () => state.chores || { setUp: false, jobs: [], chores: [], view: { people: [], jobs: [] }, holders: {}, log: [] };
const kids = () => state.members.filter(m => m.role === "child");
const liveJobs = () => C().jobs.filter(j => !j.archived);
const memberColor = id => { const m = state.members.find(x => x.id === id); return m && m.color ? m.color : "#a1a1aa"; };
const dot = id => `<span class="dot" style="background:${esc(memberColor(id))}"></span>`;
const clockText = ms => new Date(ms).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

function scheduleText(c) {
  const days = c.days && c.days.length ? c.days : null;
  let s;
  if (c.cadence === "daily") s = !days ? "Every day" : days.join() === "1,2,3,4,5" ? "Weekdays" : days.join() === "0,6" ? "Weekends" : days.map(d => WEEKDAYS[d]).join(", ");
  else if (c.cadence === "weekly") {
    const every = c.everyWeeks > 1 ? `Every ${c.everyWeeks} weeks` : "Every week";
    s = days ? `${every} on ${days.map(d => WEEKDAYS[d]).join(" & ")}` : c.everyWeeks > 1 ? `${every}, any day` : "Once a week, any day";
  } else s = c.cadence === "as-needed" ? "As needed" : "When asked";
  if (c.time) s += ` · ${c.timeKind === "by" ? "by" : "at"} ${timeText(c.time)}`;
  if (c.seasonFrom) s += ` · ${dateText("2001-" + c.seasonFrom, { month: "short", day: "numeric" })} – ${dateText("2001-" + c.seasonTo, { month: "short", day: "numeric" })}`;
  return s;
}

/** Whose a chore is: its jobs, or its people. */
function ownerText(c) {
  if (c.people && c.people.length) return c.people.map(memberName).join(" & ");
  return (c.jobIds || []).map(id => { const j = C().jobs.find(x => x.id === id); return j ? j.name : "?"; }).join(" & ");
}

/** May this sign-in take back this tick? (The hub checks too.) */
function canUndoTick(doneBy, doneAt) {
  if (state.can.manage) return true;
  return !!state.viewer && doneBy === state.viewer.id && new Date(doneAt).toDateString() === new Date().toDateString();
}

function choreRow(c, day) {
  const tick = state.can.tick;
  const late = c.status === "late", done = c.status === "done";
  let when = c.when ? c.when.charAt(0).toUpperCase() + c.when.slice(1) : "";
  const withText = c.with && c.with.length ? ` · with ${c.with.map(memberName).join(" & ")}` : "";
  let btn = "";
  if (c.cadence === "as-needed") {
    when = c.count ? `Done ${c.count === 1 ? "once" : c.count + " times"} today` : "As needed";
    if (tick) btn = `<button class="chore-btn" data-do="chore-done" data-id="${c.id}">+1 Done</button>`;
  } else if (done) {
    when = `Done ${c.doneAt ? clockText(c.doneAt) : ""}${c.doneBy ? ` · ticked by ${memberName(c.doneBy)}` : ""}`;
    if (c.actionId && canUndoTick(c.doneBy, c.doneAt)) btn = `<button class="chore-btn quiet" data-do="chore-undo" data-id="${c.actionId}">Undo</button>`;
  } else if (c.status === "missed") {
    when = "Missed";
    if (tick && daysUntil(day) >= -7) btn = `<button class="chore-btn" data-do="chore-done" data-id="${c.id}">Done late</button>`;
  } else if (c.status === "tomorrow") {
    when = "Tomorrow" + (c.when ? ` ${c.when}` : "");
  } else {
    if (late) when = (when ? when + " · " : "") + "Late";
    else if (c.cadence === "when-asked" && c.period) when = `By ${shortDate(c.period)}`;
    else if (!when) when = c.period && c.period !== day ? "This week" : "Today";
    if (tick) btn = `<button class="chore-btn big primary" data-do="chore-done" data-id="${c.id}">Done</button>`;
  }
  return `<div class="chore is-${c.status}">
    <div class="chore-title">${esc(c.title)}</div>
    <div class="chore-when">${esc(when + withText)}</div>
    ${c.notes ? `<div class="task-more">${esc(c.notes)}</div>` : ""}
    ${btn}
  </div>`;
}

function choresView() {
  const c = C();
  const manage = state.can.manage;
  if (!c.setUp && !showSetup) {
    return `<div class="card"><h2>No chores yet</h2><p class="sub" style="margin-top:6px">
      Chores are the kids' jobs (trash, dishes, the dogs), which take turns each week, and what each job involves and when.</p>
      ${manage ? `<div class="task-actions" style="margin-top:12px"><button class="primary" data-do="chores-setup">Set up chores</button></div>` : ""}</div>`;
  }
  const v = c.view, day = c.day || state.today;
  let html = "";
  const title = day === state.today ? `Today · ${shortDate(day)}` : daysUntil(day) === -1 ? `Yesterday · ${shortDate(day)}` : shortDate(day);
  html += `<div class="day-nav"><button class="prev small" data-do="chore-day" data-id="-1">‹</button>
    <span class="day-title">${esc(title)}</span>
    ${day < state.today ? `<button class="next small" data-do="chore-day" data-id="1">›</button>` : ""}</div>`;

  // A kid sees their own chores first.
  const people = v.people.slice();
  const me = state.viewer && people.findIndex(p => p.id === state.viewer.id);
  if (me > 0) people.unshift(people.splice(me, 1)[0]);
  people.forEach(p => {
    html += `<div class="card kid" style="border-left-color:${esc(p.color || "#a1a1aa")}">
      <div class="card-head"><h2>${esc(p.name)}${p.jobs.length ? `<span class="jobs">${esc(p.jobs.join(", "))}</span>` : ""}</h2></div>
      ${p.chores.length ? p.chores.map(ch => choreRow(ch, day)).join("") : `<div class="empty">Nothing ${day === state.today ? "today" : "that day"}.</div>`}
    </div>`;
  });

  html += weekJobsView();
  if (manage) {
    html += `<div class="section-label"><button class="quiet" data-do="chores-setup">${showSetup ? "Hide" : "Show"} setup</button></div>`;
    if (showSetup) html += choresSetupView();
  }
  return html + choreLogView();
}

/** Who has which job this week and next. Adults can give one week's job to someone else. */
function weekJobsView() {
  const c = C(), jobs = liveJobs();
  if (!jobs.length) return "";
  const weeks = Object.keys(c.holders || {}).sort();
  const [thisWeek, nextWeek] = weeks;
  const swapped = id => (c.swaps || []).some(s => s.week === thisWeek && s.jobId === id);
  const rows = jobs.map(j => {
    const now = c.holders[thisWeek] ? c.holders[thisWeek][j.id] : null;
    const next = nextWeek && c.holders[nextWeek] ? c.holders[nextWeek][j.id] : null;
    const cell = state.can.manage
      ? `<select class="f-swap" data-id="${j.id}" data-week="${thisWeek}">${kids().concat(state.members.filter(m => m.role !== "child")).map(m => opt(m.id, m.name, now || "")).join("")}</select>${swapped(j.id) ? ` <button class="small quiet" data-do="swap-clear" data-id="${j.id}" data-key="${thisWeek}">Undo swap</button>` : ""}`
      : now ? `${dot(now)}${esc(memberName(now))}` : "–";
    return `<tr><td>${j.emoji ? esc(j.emoji) + " " : ""}${esc(j.name)}</td><td>${cell}</td><td>${next ? dot(next) + esc(memberName(next)) : "–"}</td></tr>`;
  }).join("");
  return `<div class="section-label">This week's jobs</div><div class="card">
    <table class="jobs-table"><tr><th>Job</th><th>This week</th><th>Next week</th></tr>${rows}</table>
    ${state.can.manage ? `<div class="hint sub" style="margin-top:8px">Changing someone here is for this week only.</div>` : ""}
  </div>`;
}

function choresSetupView() {
  const c = C();
  let html = "";
  // Jobs and the rotation.
  if (form && form.type === "jobs") html += jobsForm();
  else {
    const jobs = liveJobs();
    const r = c.rotation;
    html += `<div class="card"><div class="card-head"><h2>Jobs and turns</h2>
      <button class="quiet" data-do="edit-jobs">Edit</button></div>
      ${jobs.length ? `<div class="sub">${jobs.map(j => esc((j.emoji ? j.emoji + " " : "") + j.name)).join(" · ")}</div>` : `<div class="empty">No jobs yet.</div>`}
      <div class="sub" style="margin-top:4px">${r ? `${esc(r.people.map(memberName).join(", "))} take turns. Jobs move ${r.direction === -1 ? "back" : "on"} one every ${WEEKDAYS[r.startsOn == null ? 1 : r.startsOn]}.` : "Nobody's taking turns yet."}</div>
    </div>`;
  }
  // The chores, by job.
  const live = c.chores.filter(ch => !ch.archived);
  html += `<div class="card"><div class="card-head"><h2>Chores</h2></div>`;
  if (!live.length && !(form && form.type === "chore")) html += `<div class="empty">No chores yet.</div>`;
  live.forEach(ch => {
    if (form && form.type === "chore" && form.id === ch.id) { html += choreForm(ch); return; }
    const asked = ch.cadence === "when-asked";
    html += `<div class="setup-row">
      <div class="chore-title">${esc(ch.title)}</div>
      <div class="sub">${esc(ownerText(ch))} · ${esc(scheduleText(ch))}${asked && ch.askedFor ? ` · asked for ${esc(shortDate(ch.askedFor))}` : ""}</div>
      ${form && form.type === "ask" && form.id === ch.id ? `<div class="form"><div class="row">
          <div class="field"><label for="a-by">By</label><input id="a-by" type="date" value="${esc(ch.askedFor || state.today)}"></div><div></div></div>
          <div class="form-actions"><button class="primary" data-do="save-ask" data-id="${ch.id}">Ask</button><button data-do="cancel">Cancel</button>
          ${ch.askedFor ? `<button class="danger" data-do="unask" data-id="${ch.id}">Not needed</button>` : ""}</div></div>` : ""}
      <div class="actions">${asked ? `<button class="small" data-do="ask" data-id="${ch.id}">${ch.askedFor ? "Asked" : "Ask"}</button>` : ""}<button class="small" data-do="edit-chore" data-id="${ch.id}">Edit</button></div>
    </div>`;
  });
  if (form && form.type === "chore" && !form.id) html += choreForm(null);
  else if (liveJobs().length || kids().length) html += `<div class="task-actions" style="margin-top:10px"><button data-do="add-chore">+ Add a chore</button></div>`;
  html += `</div>`;
  const archived = c.chores.filter(ch => ch.archived);
  if (archived.length) {
    html += `<div class="section-label"><button class="quiet" data-do="toggle-archived-chores">${showArchivedChores ? "Hide" : "Show"} archived chores (${archived.length})</button></div>`;
    if (showArchivedChores) html += `<div class="card">${archived.map(ch => `<div class="setup-row"><div class="chore-title">${esc(ch.title)}</div><div class="sub">${esc(scheduleText(ch))}</div>
      <div class="actions"><button class="small" data-do="restore-chore" data-id="${ch.id}">Restore</button></div></div>`).join("")}</div>`;
  }
  return html;
}

function jobsForm() {
  const c = C();
  const rows = form.jobs;
  const r = c.rotation || { people: [], startsOn: 1, direction: 1 };
  const thisWeek = Object.keys(c.holders || {}).sort()[0];
  const now = (c.holders && c.holders[thisWeek]) || {};
  const holderOf = j => form.holders[j.id] !== undefined ? form.holders[j.id] : now[j.id] || "";
  const assigned = rows.filter(j => !j.archived).map(holderOf).filter(Boolean);
  return `<div class="form" data-form="jobs">
    <h3>Jobs and turns</h3>
    <div class="field-label">The jobs, in order</div>
    ${rows.map((j, i) => j.archived ? "" : `<div class="job-edit">
      <input class="f-job-name" data-i="${i}" maxlength="40" placeholder="Trash" value="${esc(j.name)}">
      <input class="f-job-emoji" data-i="${i}" maxlength="8" placeholder="🗑️" value="${esc(j.emoji)}">
      <button class="small" data-do="remove-job" data-id="${i}" title="Remove">✕</button></div>`).join("")}
    <div class="task-actions"><button class="small" data-do="add-job">+ Add a job</button></div>
    <div class="field" style="margin-top:14px"><span class="field-label">Who has each job this week</span>
      ${rows.map((j, i) => j.archived || !j.name ? "" : `<div class="row" style="margin-bottom:6px"><div style="line-height:42px">${esc(j.name)}</div>
        <select class="f-holder" data-i="${i}">${opt("", "Nobody", holderOf(j))}${state.members.map(m => opt(m.id, m.name, holderOf(j))).join("")}</select></div>`).join("")}
    </div>
    <div class="field"><span class="field-label">Also taking turns (no job this week)</span>
      ${kids().filter(k => assigned.indexOf(k.id) < 0).map(k => `<label class="check"><input type="checkbox" class="f-extra" value="${k.id}"${r.people.indexOf(k.id) >= 0 ? " checked" : ""}>${esc(k.name)}</label>`).join("") || `<div class="hint">Everyone has a job.</div>`}
    </div>
    <div class="row">
      <div class="field"><label for="f-starts">New jobs every</label><select id="f-starts">${[1, 0, 6].map(d => opt(String(d), ["Sunday", "Monday", "", "", "", "", "Saturday"][d], String(r.startsOn == null ? 1 : r.startsOn))).join("")}</select></div>
      <div class="field"><label for="f-dir">Each week, everyone moves</label><select id="f-dir">${opt("1", "To the next job down", String(r.direction))}${opt("-1", "To the job above", String(r.direction))}</select></div>
    </div>
    <div class="form-actions"><button class="primary" data-do="save-jobs">Save</button><button data-do="cancel">Cancel</button></div>
  </div>`;
}

/** Reads the jobs form's fields back into form.jobs, so a redraw keeps what's typed. */
function readJobsForm() {
  Array.prototype.forEach.call(document.querySelectorAll(".f-job-name"), el => { form.jobs[+el.getAttribute("data-i")].name = el.value; });
  Array.prototype.forEach.call(document.querySelectorAll(".f-job-emoji"), el => { form.jobs[+el.getAttribute("data-i")].emoji = el.value; });
  Array.prototype.forEach.call(document.querySelectorAll(".f-holder"), el => { form.holders[form.jobs[+el.getAttribute("data-i")].id] = el.value; });
}

function saveJobs() {
  readJobsForm();
  const jobs = form.jobs.filter(j => j.name.trim() || j.archived && j.saved);
  const live = jobs.filter(j => !j.archived);
  if (!live.length) { setStatus("Add at least one job", true); return; }
  const people = [];
  live.forEach(j => { const h = form.holders[j.id]; if (h && people.indexOf(h) < 0) people.push(h); });
  if (people.length !== live.filter(j => form.holders[j.id]).length) { setStatus("Give each person one job this week (or nobody)", true); return; }
  Array.prototype.forEach.call(document.querySelectorAll(".f-extra"), el => { if (el.checked && people.indexOf(el.value) < 0) people.push(el.value); });
  // The rotation is anchored this week: the first person in it holds the first job, and so on.
  // Jobs with nobody go to the end, so the people line up with the jobs they hold.
  const ordered = live.filter(j => form.holders[j.id]).concat(live.filter(j => !form.holders[j.id]));
  const sent = ordered.map((j, i) => ({ id: j.id, name: j.name.trim(), emoji: j.emoji.trim(), position: i }))
    .concat(jobs.filter(j => j.archived).map(j => ({ id: j.id, name: j.name || "Job", emoji: j.emoji || "", position: 99, archived: true })));
  const rotation = { people, anchorWeek: state.today, startsOn: Number(val("f-starts")), direction: Number(val("f-dir")) };
  send("/chores/jobs", { jobs: sent }).then(ok => ok && send("/chores/rotation", rotation, "Saved")).then(ok => { if (ok) form = null; render(); });
}

/** The chore form's fields, as a chore. */
function readChoreForm() {
  const old = form.id ? C().chores.find(x => x.id === form.id) : null;
  const checked = cls => Array.prototype.filter.call(document.querySelectorAll(cls), el => el.checked).map(el => el.value);
  const cadence = val("c-cadence");
  const byPeople = $("c-by-people") && $("c-by-people").checked;
  let days = null;
  if (cadence === "daily") days = checked(".c-day").map(Number);
  if (cadence === "weekly") days = val("c-weekday") === "" ? null : [Number(val("c-weekday"))];
  const seasonal = $("c-seasonal") && $("c-seasonal").checked;
  return {
    id: old ? old.id : form.newId, title: val("c-title"), cadence,
    jobIds: byPeople ? [] : checked(".c-job"), people: byPeople ? checked(".c-person") : [],
    days, everyWeeks: cadence === "weekly" ? Number(val("c-every") || 1) : 1,
    anchorWeek: cadence === "weekly" && Number(val("c-every") || 1) > 1 ? val("c-anchor") || null : null,
    time: val("c-time") || null, timeKind: val("c-timekind") || "at",
    seasonFrom: seasonal && val("c-from") ? val("c-from").slice(5) : null, seasonTo: seasonal && val("c-to") ? val("c-to").slice(5) : null,
    askedFor: old ? old.askedFor : null,
    notes: val("c-notes"), position: old ? old.position : C().chores.length,
  };
}

function saveChore() {
  const ch = readChoreForm();
  if (!ch.title) { setStatus("Say what the chore is", true); return; }
  if (!ch.jobIds.length && !ch.people.length) { setStatus("Pick a job, or the people it's for", true); return; }
  if (ch.cadence === "daily" && !ch.days.length) { setStatus("Pick at least one day", true); return; }
  if ((ch.seasonFrom || ch.seasonTo) && !(ch.seasonFrom && ch.seasonTo)) { setStatus("Pick when the season starts and ends", true); return; }
  send("/chores", ch).then(ok => { if (ok) form = null; render(); });
}

/** A tick's day, or its week for a chore done any day that week. */
function periodText(r) {
  const ch = C().chores.find(x => x.id === r.choreId);
  const weekly = ch && ch.cadence === "weekly" && !(ch.days && ch.days.length);
  return weekly ? `Week of ${dateText(r.period, { month: "short", day: "numeric" })}` : dateText(r.period, { weekday: "short", month: "short", day: "numeric" });
}

/** Ticks and undos for the day showing. */
function choreLogView() {
  const c = C();
  const rows = (c.log || []).slice(0, 15);
  if (!rows.length) return "";
  const title = id => { const ch = c.chores.find(x => x.id === id); return ch ? ch.title : "A chore"; };
  return `<div class="section-label">Lately</div><div class="card">` + rows.map((r, i) => `<div class="log-row" ${i === 0 ? 'style="border-top:0"' : ""}>
      <strong>${esc(title(r.choreId))}</strong>${r.doneFor && r.doneFor.length ? ` · ${esc(r.doneFor.map(memberName).join(" & "))}` : ""}
      · ${esc(periodText(r))}
      <div class="sub">Ticked ${esc(new Date(r.createdAt).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" }))}${r.doneBy ? ` by ${esc(memberName(r.doneBy))}` : ""}</div>
      ${canUndoTick(r.doneBy, r.createdAt) ? `<button class="small" data-do="chore-undo" data-id="${r.actionId}">Undo</button>` : ""}
    </div>`).join("") + `</div>`;
}

/** Shows another day's chores. */
function goChoreDay(step) {
  const from = (state.chores && state.chores.day) || state.today;
  const d = new Date(from + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + step);
  const next = d.toISOString().slice(0, 10);
  choreDay = next >= state.today ? null : next;
  load();
}

/** The task as the hub wants it, from a stored task (so nothing is lost on a partial update). */
const asSent = t => ({
  id: t.id, area: t.area, kind: t.kind, title: t.title, petId: t.petId, placeId: t.placeId, groupId: t.groupId,
  assignee: t.assignee, dueDate: t.dueDate, dueTime: t.dueTime, repeatEvery: t.repeatEvery, repeatUnit: t.repeatUnit,
  repeatFrom: t.repeatFrom, leadDays: t.leadDays, booked: t.booked, apptDate: t.apptDate, apptTime: t.apptTime,
  endDate: t.endDate, provider: t.provider, phone: t.phone, url: t.url, notes: t.notes,
});

function saveTask() {
  const b = form.key ? findBundle(form.key) : null;
  const areaId = b ? b.task.area : form.area;
  const kinds = state.areas[areaId].kinds;
  const kind = val("f-kind"), k = kinds[kind];
  const repeats = $("f-repeats").checked;
  const booked = !!($("f-booked") && $("f-booked").checked);
  const shared = {
    area: areaId, kind, title: val("f-title") || k.label,
    placeId: areaId === "house" ? val("f-place") || (b ? b.task.placeId : form.placeId) || null : null,
    assignee: $("f-assignee") ? val("f-assignee") || null : b ? b.task.assignee : null,
    dueTime: k.appointment ? val("f-time") || null : null,
    repeatEvery: repeats ? Number(val("f-every")) : null, repeatUnit: repeats ? val("f-unit") : null, repeatFrom: val("f-from") || "done",
    leadDays: val("f-lead") === "" ? null : Number(val("f-lead")),
    booked: k.bookable ? booked : false,
    apptDate: booked ? val("f-appt") || null : null, apptTime: booked ? val("f-appt-time") || null : null,
    endDate: k.stay ? val("f-end") || null : null,
    provider: val("f-provider"), phone: val("f-phone"), url: val("f-url"), notes: val("f-notes"),
  };
  const due = val("f-due") || null;
  if (!due && !(b && !b.tasks.every(x => x.dueDate === b.task.dueDate)) && !k.undated) { setStatus(k.stay ? "Pick the first day" : "Pick the date it's due", true); return; }
  if (k.stay && !shared.endDate) { setStatus("Pick the last day", true); return; }
  if (areaId === "house" && livePlaces().length && !shared.placeId) { setStatus("Pick which place it's for", true); return; }

  const tasks = [], archive = [];
  if (areaId === "pets") {
    const petIds = Array.prototype.filter.call(document.querySelectorAll(".f-pet"), c => c.checked).map(c => c.value);
    if (!petIds.length) { setStatus("Pick at least one pet", true); return; }
    const existing = b ? b.tasks : [];
    const groupId = (b && b.task.groupId) || (petIds.length > 1 || existing.length > 1 ? newId("grp") : null);
    petIds.forEach(petId => {
      const old = existing.find(x => x.petId === petId);
      tasks.push(Object.assign({}, old ? asSent(old) : {}, shared, {
        id: old ? old.id : newId("task"), petId, groupId,
        dueDate: due || (old ? old.dueDate : null),
      }));
    });
    existing.forEach(x => { if (petIds.indexOf(x.petId) < 0) archive.push(x.id); });
  } else {
    const old = b ? b.task : null;
    tasks.push(Object.assign({}, old ? asSent(old) : {}, shared, { id: old ? old.id : newId("task"), dueDate: due }));
  }
  send("/tasks", { tasks, archive }).then(ok => { if (ok) form = null; render(); });
}

function saveBooking(key, unbook) {
  const b = findBundle(key);
  if (!b) return;
  const kind = kindOf(b.task);
  const date = val("b-date"), end = val("b-end");
  if (!unbook && !date) { setStatus("Pick the date", true); return; }
  if (!unbook && kind.stay && !end) { setStatus("Pick the pick-up date", true); return; }
  const tasks = b.tasks.map(t => Object.assign(asSent(t), unbook
    ? { booked: false, apptDate: null, apptTime: null }
    : { booked: true, apptDate: date, apptTime: val("b-time") || null, endDate: kind.stay ? end : t.endDate,
        provider: val("b-provider") || t.provider, phone: val("b-phone") || t.phone }));
  send("/tasks", { tasks }, unbook ? "Marked not booked" : "Booked").then(ok => { if (ok) form = null; render(); });
}

function applyPreset(i) {
  const p = (PRESETS[form.area] || [])[i];
  if (!p) return;
  form.preset = String(i);
  form.petIds = Array.prototype.filter.call(document.querySelectorAll(".f-pet"), c => c.checked).map(c => c.value);
  form.draft = { kind: p.kind, title: p.title == null ? p.label : p.title, repeatEvery: p.every || null, repeatUnit: p.unit || null,
    repeatFrom: p.from || "done", dueDate: val("f-due") || null };
  render();
}

// ── Actions ────────────────────────────────────────────────────────
document.addEventListener("click", e => {
  const btn = e.target.closest ? e.target.closest("[data-do]") : null;
  if (!btn || btn.disabled) return;
  const id = btn.getAttribute("data-id"), key = btn.getAttribute("data-key");
  const redraw = () => render();
  const closeThen = ok => { if (ok) form = null; render(); };
  switch (btn.getAttribute("data-do")) {
    case "area": area = id; form = null; choreDay = null; history.replaceState(null, "", "#" + id); if (id === "chores") load(); else render(); break;
    case "chore-day": goChoreDay(Number(id)); break;
    case "chore-done": send(`/chores/${id}/done`, {}, "Done! It's under Lately if you need to undo it.").then(redraw); break;
    case "chore-undo": send("/undo", { actionId: id }, "Put back").then(redraw); break;
    case "chores-setup": showSetup = !showSetup; form = null; render(); break;
    case "edit-jobs": {
      const jobs = C().jobs.filter(j => !j.archived).map(j => ({ id: j.id, name: j.name, emoji: j.emoji || "", saved: true }));
      if (!jobs.length) jobs.push({ id: newId("job"), name: "", emoji: "" });
      form = { type: "jobs", jobs, holders: {}, fresh: true }; render(); break;
    }
    case "add-job": readJobsForm(); form.jobs.push({ id: newId("job"), name: "", emoji: "" }); render(); break;
    case "remove-job": {
      readJobsForm();
      const j = form.jobs[Number(id)];
      if (j.saved) j.archived = true; else form.jobs.splice(Number(id), 1);
      render(); break;
    }
    case "save-jobs": saveJobs(); break;
    case "add-chore": form = { type: "chore", id: null, newId: newId("chore"), fresh: true }; render(); break;
    case "edit-chore": form = { type: "chore", id, fresh: true }; render(); break;
    case "save-chore": saveChore(); break;
    case "archive-chore": if (confirm("Archive this chore? Its history is kept.")) send(`/chores/${id}/archive`, { archived: true }, "Archived").then(closeThen); break;
    case "restore-chore": send(`/chores/${id}/archive`, { archived: false }, "Restored").then(redraw); break;
    case "toggle-archived-chores": showArchivedChores = !showArchivedChores; render(); break;
    case "ask": form = { type: "ask", id }; render(); break;
    case "save-ask": send(`/chores/${id}/ask`, { by: val("a-by") || state.today }, "Asked. It's on the screens until it's done.").then(closeThen); break;
    case "unask": send(`/chores/${id}/ask`, { by: null }, "Not needed after all").then(closeThen); break;
    case "swap-clear": send("/chores/swap", { week: key, jobId: id, member: null }, "Back to the usual turns").then(redraw); break;
    case "add-pet": form = { type: "pet", id: null, fresh: true }; render(); break;
    case "edit-pet": form = { type: "pet", id, fresh: true }; render(); break;
    case "add-place": form = { type: "place", id: null, fresh: true }; render(); break;
    case "edit-place": form = { type: "place", id, fresh: true }; render(); break;
    case "add-task": form = { type: "task", key: null, area: btn.getAttribute("data-area"), placeId: btn.getAttribute("data-place") || null, fresh: true }; render(); break;
    case "edit": form = { type: "task", key, fresh: true }; render(); break;
    case "book": form = { type: "book", key, fresh: true }; render(); break;
    case "each": showEach[key] = !showEach[key]; render(); break;
    case "cancel": form = null; setStatus(""); render(); break;
    case "save-pet": savePet(); break;
    case "save-place": savePlace(); break;
    case "save-task": saveTask(); break;
    case "save-book": saveBooking(key, false); break;
    case "unbook": saveBooking(key, true); break;
    case "archive-pet": {
      const pet = state.pets.find(p => p.id === form.id);
      if (pet && confirm(`Archive ${pet.name}? Their records are kept.`)) send("/pets", Object.assign({}, pet, { archived: true }), `${pet.name} archived`).then(closeThen);
      break;
    }
    case "archive-place": {
      const place = state.places.find(p => p.id === form.id);
      if (place && confirm(`Archive ${place.name}? Its records are kept.`)) send("/places", Object.assign({}, place, { archived: true }), `${place.name} archived`).then(closeThen);
      break;
    }
    case "archive-bundle": {
      const b = findBundle(key);
      if (b) send("/tasks", { archive: b.tasks.map(t => t.id) }, "Archived").then(closeThen);
      break;
    }
    case "done": send(`/tasks/${id}/done`, {}, "Marked done. It's under Recently done if you need to undo it.").then(redraw); break;
    case "done-all": send(`/tasks/${id}/done`, { group: true }, "Marked done for all. It's under Recently done if you need to undo it.").then(redraw); break;
    case "undo": send(`/tasks/${id}/undo`, {}, "Put back").then(redraw); break;
    case "undo-action": send("/undo", { actionId: id }, "Put back").then(redraw); break;
    case "restore": send(`/tasks/${id}/archive`, { archived: false }, "Restored").then(redraw); break;
    case "toggle-archived": showArchived = !showArchived; render(); break;
    case "remove-photo": if (confirm("Remove this photo?")) send(`/photos/${id}/remove`, {}, "Photo removed").then(redraw); break;
  }
});

// ── Photos ─────────────────────────────────────────────────────────
// Shrunk here, so a phone's 12-megapixel photo goes up as a few hundred KB.
const PHOTO_EDGE = 1600, PHOTO_MAX_CHARS = 1300000;

function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let edge = PHOTO_EDGE, quality = 0.85, data, w, h;
      for (let i = 0; i < 5; i++) {
        const scale = Math.min(1, edge / Math.max(img.naturalWidth, img.naturalHeight));
        w = Math.round(img.naturalWidth * scale); h = Math.round(img.naturalHeight * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        data = canvas.toDataURL("image/jpeg", quality);
        if (data.length <= PHOTO_MAX_CHARS) break;
        edge = Math.round(edge * 0.8); quality = Math.max(0.6, quality - 0.08);
      }
      resolve({ data, width: w, height: h });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a photo this browser can open")); };
    img.src = url;
  });
}

/** Uploads the chosen photos one after another. */
function uploadPhotos(petId, files) {
  picking = 0;
  const list = Array.prototype.slice.call(files || []);
  if (!list.length) return;
  uploading = true;
  let added = 0;
  const next = i => {
    if (i >= list.length) return Promise.resolve();
    setStatus(list.length > 1 ? `Adding photo ${i + 1} of ${list.length}…` : "Getting the photo ready…");
    return shrink(list[i])
      .then(photo => { busy = false; return send(`/pets/${petId}/photo`, photo, ""); })
      .then(ok => { if (!ok) throw new Error($("status").textContent || "That photo didn't save"); added++; return next(i + 1); });
  };
  next(0)
    .then(() => setStatus(added === 1 ? "Photo added" : `${added} photos added`))
    .catch(e => setStatus(added ? `${added} added, then: ${e.message}` : e.message, true))
    .then(() => { uploading = false; render(); });
}

/**
 * The photo inputs get their own handler. A refresh that redraws the page while the
 * phone's photo picker is open would otherwise leave the chosen photo on an input
 * that's no longer in the page, where nothing hears it.
 */
function wirePhotoInputs() {
  Array.prototype.forEach.call(document.querySelectorAll(".f-photo"), input => {
    input.onclick = () => { picking = Date.now(); };
    input.onchange = () => uploadPhotos(input.getAttribute("data-id"), input.files);
  });
}

document.addEventListener("change", e => {
  const id = e.target.id;
  if (e.target.classList && e.target.classList.contains("f-photo")) return;   // wirePhotoInputs()
  if (id === "f-repeats") $("f-repeat-box").classList.toggle("hidden", !e.target.checked);
  if (id === "f-booked") $("f-booked-box").classList.toggle("hidden", !e.target.checked);
  if (id === "f-preset" && form && !form.key) applyPreset(Number(e.target.value));
  // Chores: a different "how often" or "whose" means different fields; keep what's typed.
  if ((id === "c-cadence" || id === "c-by-job" || id === "c-by-people") && form && form.type === "chore") {
    const draft = readChoreForm();
    if (id !== "c-cadence") { form.byPeople = id === "c-by-people"; draft.jobIds = draft.jobIds || []; }
    if (id === "c-cadence" && draft.cadence === "daily") draft.days = null;
    form.draft = draft; render();
  }
  if (id === "c-every") $("c-anchor-box").classList.toggle("hidden", Number(e.target.value) < 2);
  if (id === "c-seasonal") $("c-season-box").classList.toggle("hidden", !e.target.checked);
  if (e.target.classList && e.target.classList.contains("f-swap")) {
    send("/chores/swap", { week: e.target.getAttribute("data-week"), jobId: e.target.getAttribute("data-id"), member: e.target.value }, "Swapped for this week").then(() => render());
  }
  // A different kind can mean different fields (a stay's dates, a booking): redraw, keeping what's typed.
  if (id === "f-kind" && form && form.type === "task") {
    const b = form.key ? findBundle(form.key) : null;
    const areaId = b ? b.task.area : form.area;
    const draft = Object.assign({}, b ? b.task : form.draft || {}, {
      kind: e.target.value, title: val("f-title"), dueDate: val("f-due") || null, provider: val("f-provider"), phone: val("f-phone"),
      url: val("f-url"), notes: val("f-notes"), repeatEvery: $("f-repeats").checked ? Number(val("f-every")) : null,
      repeatUnit: val("f-unit"), repeatFrom: val("f-from"),
    });
    if (!b) { form.draft = draft; form.petIds = Array.prototype.filter.call(document.querySelectorAll(".f-pet"), c => c.checked).map(c => c.value); render(); }
    else if (state.areas[areaId].kinds[e.target.value].stay !== kindOf(b.task).stay) setStatus("Save to see the new kind's fields");
  }
});

// Someone else may have changed something: refresh when nobody's typing.
// Not while a form is open, a save or upload is under way, or a photo picker is open
// (choosing a photo can take a while, so a picker counts as open for two minutes).
const quiet = () => !form && !busy && !uploading && !(picking && Date.now() - picking < 120000);
setInterval(() => { if (quiet() && !document.hidden) load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && quiet()) load(); });

load();
</script>
