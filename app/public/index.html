    timeZone: TZ, hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true
  }).formatToParts(now);
  const get = t => parts.find(p => p.type === t)?.value ?? "";
  document.getElementById("clock-time").textContent = `${get("hour")}:${get("minute")}`;
  document.getElementById("clock-secs").textContent = get("second");
  document.getElementById("clock-ampm").textContent = get("dayPeriod");
  document.getElementById("clock-date").textContent = now.toLocaleDateString("en-US", {
    timeZone: TZ, weekday: "long", month: "short", day: "numeric"
  });
  // Cistercian glyphs
  const h12 = parseInt(get("hour"), 10);
  const mins = parseInt(get("minute"), 10);
  document.getElementById("cistr-hour").innerHTML = cistercianInner(h12);
  document.getElementById("cistr-min").innerHTML  = cistercianInner(mins);
}
tickClock();
setInterval(tickClock, 1000);

function toggleSummary() {
  const drawer = document.getElementById("summary-drawer");
  const arrow  = document.getElementById("summary-arrow");
  const open   = drawer.classList.toggle("open");
  arrow.textContent = open ? "▴" : "▾";
}

buildMemberPills();
buildModules();     // render all module DOM up front
initTheme();
initRotation();

// ── Member pills ───────────────────────────────────────────────────
function buildMemberPills() {
  const row = document.getElementById("members-row");
  const clear = document.getElementById("clear-filter");
  MEMBERS.forEach(id => {
    const chip = document.createElement("div");
    chip.className = "member-chip"; chip.id = `chip-${id}`;
    chip.innerHTML = `<span class="av" id="av-${id}" style="background:${MEMBER_COLORS[id]}">${MEMBER_NAMES[id][0]}</span>${MEMBER_NAMES[id]}`;
    chip.addEventListener("click", () => setFilter(activeFilter === id ? null : id));
    row.insertBefore(chip, clear);
  });
  clear.addEventListener("click", () => setFilter(null));
}

function setFilter(id) {
  activeFilter = id;
  document.getElementById("members-row").classList.toggle("has-filter", id !== null);
  MEMBERS.forEach(mid => {
    const chip = document.getElementById(`chip-${mid}`);
    const on = mid === id;
    chip.classList.toggle("active", on);
    chip.style.background   = on ? MEMBER_COLORS[mid] : "";
    chip.style.borderColor  = on ? MEMBER_COLORS[mid] : "";
    chip.style.color        = on ? "white" : "";
  });
  document.querySelectorAll(".flag").forEach(el => {
    if (!id) { el.classList.remove("dimmed"); return; }
    el.classList.toggle("dimmed", !(el.dataset.members||"").split(",").includes(id));
  });
  document.querySelectorAll(".action-item").forEach(el => {
    if (!id) { el.classList.remove("dimmed"); return; }
    el.classList.toggle("dimmed", el.dataset.assignee !== id);
  });
  document.querySelectorAll("[data-date]").forEach(el => applyDateFilter(el, id));
  document.querySelectorAll("[data-member-id]").forEach(el => {
    if (!id) { el.classList.remove("dimmed"); return; }
    const ids = el.dataset.memberIds ? el.dataset.memberIds.split(',') : [el.dataset.memberId];
    el.classList.toggle("dimmed", !ids.includes(id));
  });
}

function applyDateFilter(el, id) {
  el.classList.remove("member-lit","member-dim");
  el.style.removeProperty("--lit-color");
  if (!id) return;
  const date = el.dataset.date;
  const hit  = (flagsByDate[date]||[]).some(f=>(f.relatedMemberIds||[]).includes(id))
             || (actionsByDate[date]||[]).some(a=>a.assignedTo===id);
  if (hit) { el.classList.add("member-lit"); el.style.setProperty("--lit-color", MEMBER_COLORS[id]); }
  else       el.classList.add("member-dim");
}

// ── Tabs ───────────────────────────────────────────────────────────
// One tab per component in the stream, in rotation order, plus ALWAYS_TABS.
function buildTabs(cards) {
  const bar = document.getElementById("tab-bar");
  bar.innerHTML = "";
  const row = document.createElement("div");
  row.className = "tab-row";
  const order = [];
  (cards || []).forEach(c => { if (!order.includes(c.component)) order.push(c.component); });
  if (!cards) MODULES.forEach(m => { if (!order.includes(m.component)) order.push(m.component); });
  ALWAYS_TABS.forEach(c => { if (!order.includes(c)) order.push(c); });
  order.forEach(component => {
    const i = MODULES.findIndex(m => m.component === component && m.tab !== false);
    const btn = document.createElement("button");
    btn.className = "tab";
    if (i < 0) {
      // No view of its own: a tab named by its cards, opening the glance view.
      const first = (cards || []).find(c => c.component === component);
      if (!first) return;
      btn.id = `tab-glance-${component}`;
      btn.innerHTML = `${esc(first.title)}<span class="tab-dot"></span>`;
      btn.addEventListener("click", () => showGlance(component));
      row.appendChild(btn);
      return;
    }
    btn.id = `tab-${i}`;
    const named = MODULES[i].labelFromCard && (cards || []).find(c => c.component === component);
    btn.innerHTML = `${named ? esc(named.title) : MODULES[i].label}<span class="tab-dot"></span>`;
    btn.addEventListener("click", () => showModule(i));
    row.appendChild(btn);
  });
  bar.appendChild(row);
  markTab(currentModule, rot.slots[rot.i] ? rot.slots[rot.i].ms : 0);
}

/** The tab for a module, or for another view of the same component (14 days → Week). */
function tabFor(idx) {
  if (idx === GLANCE) return document.getElementById(`tab-glance-${glanceShown}`);
  const own = document.getElementById(`tab-${idx}`);
  if (own) return own;
  const j = MODULES.findIndex(m => m.component === MODULES[idx].component && document.getElementById(`tab-${MODULES.indexOf(m)}`));
  return j >= 0 ? document.getElementById(`tab-${j}`) : null;
}

function markTab(idx, ms) {
  document.querySelectorAll(".tab.active").forEach(t => t.classList.remove("active", "is-paused"));
  const t = tabFor(idx);
  if (!t) return;
  t.classList.add("active");
  if (rot.paused || !ms) t.classList.add("is-paused");
  t.style.setProperty("--rotate-ms", (ms || 60000) + "ms");
  t.style.animation = "none"; void t.offsetWidth; t.style.animation = "";
}

function buildModules() {
  const wrap = document.getElementById("module-wrap");
  MODULES.forEach((m, i) => {
    const div = document.createElement("div");
    div.className = "module" + (i !== 0 ? " mod-hidden" : "");
    div.id = `module-${i}`;
    m.build(div);
    wrap.appendChild(div);
  });
}

// ── Pet portraits ──────────────────────────────────────────────────
// One card per pet (the pet-portraits component): its photo, blurred to fill the
// screen with the whole photo on top, and its name, age and what's next.
let portraitAt = -1;

function buildPortraits(container) {
  container.innerHTML = `<div class="portrait" id="portrait">
    <img class="portrait-blur" id="portrait-blur" alt="">
    <img class="portrait-photo" id="portrait-photo" alt="">
    <div class="portrait-shade"></div>
    <div class="portrait-text">
      <div class="portrait-name" id="portrait-name"></div>
      <div class="portrait-age" id="portrait-age"></div>
      <div class="portrait-next" id="portrait-next"></div>
    </div>
  </div>`;
}

/** Fills the screen below the tabs, whatever the header's height on this screen. */
function fitPortrait() {
  const frame = document.getElementById("portrait");
  if (!frame || frame.closest(".mod-hidden")) return;
  const top = frame.getBoundingClientRect().top + window.pageYOffset;
  frame.style.height = Math.max(360, window.innerHeight - top - 24) + "px";
}
window.addEventListener("resize", fitPortrait);

/** Shows `card`, or (when someone opens the tab) the next pet in the stream. */
function showPortrait(card) {
  if (!card) {
    const all = streamCards.filter(c => c.component === "pet-portraits");
    if (!all.length) return;
    portraitAt = (portraitAt + 1) % all.length;
    card = all[portraitAt];
  }
  const d = card.data || {};
  const pet = d.pet || {}, photo = d.photo;
  const frame = document.getElementById("portrait");
  setTimeout(fitPortrait, 30);
  frame.classList.toggle("no-photo", !photo);
  if (photo) {
    document.getElementById("portrait-blur").src = photo.url;
    document.getElementById("portrait-photo").src = photo.url;
  }
  document.getElementById("portrait-name").textContent = pet.name || card.glance.headline;
  document.getElementById("portrait-age").textContent = [pet.species, pet.age].filter(Boolean).join(" · ");
  document.getElementById("portrait-next").innerHTML = (d.next || []).map(n =>
    `<div class="portrait-item${n.overdue ? " overdue" : ""}">${esc(n.emoji)} ${esc(n.title)} <span class="when">· ${esc(n.when)}</span></div>`).join("");
}

// ── Chores ─────────────────────────────────────────────────────────
// A column per kid with today's chores as big tiles. Tap one to tick it done; tap a
// done one to take it back. Anyone in the family can tick, as on the fridge
// whiteboard (docs/architecture.md#household-records). Set up at /household/#chores.

function buildChoreBoard(container) {
  container.innerHTML = `<div class="cb-head"><div class="cb-day" id="cb-day">Chores</div>
    <div class="cb-jobs" id="cb-jobs"></div><a class="cb-link" href="/household/#chores">Set up ›</a></div>
    <div class="cb-note" id="cb-note"></div><div id="cb-grid" class="cb-grid"></div>`;
  board.el = container;
}

function choreRequest(path, body) {
  const opts = { credentials: "same-origin" };
  if (body) { opts.method = "POST"; opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(body); }
  return fetch("/api/household" + path, opts).then(r => r.json().catch(() => ({})).then(d => {
    if (!r.ok || d.error) throw new Error(d.error || `The hub answered ${r.status}`);
    return d;
  }));
}

function loadChoreBoard() {
  return choreRequest("/chores").then(d => { board.data = d; renderChoreBoard(""); })
    .catch(e => renderChoreBoard(`Couldn't load the chores: ${e.message}`));
}

function choreTileWhen(c) {
  const when = c.when ? c.when.charAt(0).toUpperCase() + c.when.slice(1) : "";
  if (c.cadence === "as-needed") return c.count ? `Done ${c.count === 1 ? "once" : c.count + " times"} today · tap again` : "When it's needed";
  if (c.status === "done") return `Done ${c.doneAt ? new Date(c.doneAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : ""}`;
  if (c.status === "missed") return "Missed";
  if (c.status === "tomorrow") return "Tomorrow" + (when ? " " + when : "");
  if (c.status === "late") return (when ? when + " · " : "") + "Late";
  const withText = c.with && c.with.length ? ` · with ${c.with.map(id => MEMBER_NAMES[id] || id).join(" & ")}` : "";
  return (when || (c.anyDay ? "This week" : "Today")) + withText;
}

function renderChoreBoard(problem) {
  if (!board.el) return;
  const d = board.data;
  const c = d && d.chores;
  const note = document.getElementById("cb-note");
  const grid = document.getElementById("cb-grid");
  if (!c || !c.setUp) {
    note.textContent = problem || "No chores yet. Set them up at /household/.";
    grid.innerHTML = "";
    return;
  }
  const day = new Date(c.today + "T12:00:00Z").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
  document.getElementById("cb-day").textContent = `Chores · ${day}`;
  document.getElementById("cb-jobs").textContent = c.view.jobs.filter(j => j.member)
    .map(j => `${j.emoji ? j.emoji + " " : ""}${j.name}: ${MEMBER_NAMES[j.member] || j.member}`).join("  ·  ");
  note.textContent = problem || (d.can && d.can.tick ? "" : `Ticking is off on this screen: ${d.problem || "its sign-in isn't a family member"}`);
  const people = c.view.people.filter(p => p.chores.length || p.jobs.length);
  grid.className = "cb-grid" + (people.length < 4 ? " n" + people.length : "");
  grid.innerHTML = people.map(p => {
    const counted = p.chores.filter(x => x.cadence !== "as-needed" && x.status !== "tomorrow");
    const done = counted.filter(x => x.status === "done").length;
    return `<div class="cb-col" style="border-top-color:${esc(p.color || "#a1a1aa")}">
      <div class="cb-name">${esc(p.name)}${p.jobs.length ? `<span class="cb-jobname">${esc(p.jobs.join(", "))}</span>` : ""}</div>
      <div class="cb-count">${counted.length ? (done === counted.length ? "All done today 🎉" : `${done} of ${counted.length} done`) : ""}</div>
      ${p.chores.length ? p.chores.map(x => `<button type="button" class="cb-tile is-${x.status}${x.cadence === "as-needed" ? " as-needed" : ""}"
          data-chore="${esc(x.id)}" data-person="${esc(p.id)}">
          <span class="cb-box">${x.status === "done" ? "✓" : x.cadence === "as-needed" ? "+" : ""}</span>
          <span class="cb-title">${esc(x.title)}</span><span class="cb-when">${esc(choreTileWhen(x))}</span></button>`).join("")
        : `<div class="cb-empty">Nothing today.</div>`}
    </div>`;
  }).join("");
  Array.prototype.forEach.call(grid.querySelectorAll(".cb-tile"), el =>
    el.addEventListener("click", () => tapChore(el.getAttribute("data-person"), el.getAttribute("data-chore"))));
}

function tapChore(personId, choreId) {
  const c = board.data && board.data.chores;
  if (!c || board.busy) return;
  const person = c.view.people.find(p => p.id === personId);
  const chore = person && person.chores.find(x => x.id === choreId);
  if (!chore || chore.status === "missed" || chore.status === "tomorrow") return;
  let req;
  if (chore.status === "done" && chore.cadence !== "as-needed") {
    if (!chore.actionId || !confirm(`Take back "${chore.title}"? It isn't done after all.`)) return;
    req = choreRequest("/undo", { actionId: chore.actionId });
  } else {
    req = choreRequest(`/chores/${encodeURIComponent(choreId)}/done`, {});
  }
  board.busy = true;
  req.then(d => { board.data = d; renderChoreBoard(""); })
    .catch(e => renderChoreBoard(e.message))
    .then(() => { board.busy = false; });
}

// ── Glance view ────────────────────────────────────────────────────
function buildGlance(container) {
  container.innerHTML = `<div class="section-title" id="glance-title"></div><div class="glance-list" id="glance-list"></div>`;
}

/** Draws every card of `component` from its title and glance. */
function renderGlance(component) {
  glanceShown = component;
  const cards = streamCards.filter(c => c.component === component);
  document.getElementById("glance-title").textContent = cards.length ? cards[0].title : "";
  document.getElementById("glance-list").innerHTML = cards.map(c => {
    const g = c.glance || {};
    const overdue = c.data && c.data.task && c.data.task.overdue;
    return `<a class="glance-card${overdue ? " is-overdue" : ""}" href="${esc(c.url || "#")}">
      <div class="glance-emoji">${esc(g.emoji || "•")}</div>
      <div class="glance-headline">${esc(g.headline)}</div>
      <div class="glance-detail">${esc(g.detail)}</div>
    </a>`;
  }).join("");
}

/** Someone chose a component that has no view of its own. */
function showGlance(component) {
  pauseRotation();
  switchTo(GLANCE, () => { renderGlance(component); markTab(GLANCE, 0); });
}

/** Adds a button that switches to another view of the same component. */
function withViewToggle(build, target, label) {
  return container => {
    const b = document.createElement("button");
    b.className = "view-toggle";
    b.textContent = label;
    b.addEventListener("click", () => showModule(MODULES.findIndex(m => m.id === target)));
    container.appendChild(b);
    build(container);
  };
}

/** Fades from the current module to `idx`, then runs `after`. */
function switchTo(idx, after) {
  const done = () => { currentModule = idx; if (after) after(); };
  if (idx === currentModule) { done(); return; }
  const outEl = document.getElementById(`module-${currentModule}`);
  const inEl  = document.getElementById(`module-${idx}`);
  outEl.style.opacity = "0";
  setTimeout(() => {
    outEl.classList.add("mod-hidden"); outEl.style.opacity = "";
    inEl.classList.remove("mod-hidden"); inEl.style.opacity = "0";
    requestAnimationFrame(() => requestAnimationFrame(() => { inEl.style.opacity = "1"; }));
    done();
  }, 320);
}

/** Someone chose a view: show it in full and pause the rotation. */
function showModule(idx) {
  if (idx < 0) return;
  pauseRotation();
  switchTo(idx, () => {
    const m = MODULES[idx];
    if (m.onActivate) m.onActivate();
    markTab(idx, 0);
  });
}

// ── Rotation ───────────────────────────────────────────────────────
// Each card in the stream becomes a slot. Cards of one component in a row
// share a slot unless the module shows them one by one (photos, trips).
function slotsFrom(cards) {
  const slots = [];
  cards.forEach(card => {
    const idx = MODULES.findIndex(m => m.component === card.component && m.tab !== false);
    const ms = (card.dwell || 15) * 1000;
    const prev = slots[slots.length - 1];
    if (idx < 0) {
      // No view of its own: its cards share one slot in the glance view.
      if (prev && prev.glance === card.component) { prev.ms += ms; return; }
      slots.push({ module: GLANCE, card: null, glance: card.component, ms });
      return;
    }
    if (prev && prev.module === idx && !MODULES[idx].onCard) { prev.ms += ms; return; }
    slots.push({ module: idx, card: MODULES[idx].onCard ? card : null, ms });
  });
  return slots;
}

function showSlot(i) {
  // After the last card, reload: fresh data, a fresh stream, and any new deploy.
  if (i >= rot.slots.length) { location.reload(); return; }
  rot.i = i;
  const slot = rot.slots[i], m = MODULES[slot.module];
  switchTo(slot.module, () => {
    if (slot.glance) renderGlance(slot.glance);
    else if (slot.card && m.onCard) m.onCard(slot.card);
    else if (m.onActivate) m.onActivate();
    markTab(slot.module, slot.ms);
    window.scrollTo(0, 0);
  });
  clearTimeout(rot.timer);
  rot.timer = setTimeout(() => { if (!rot.paused) showSlot(rot.i + 1); }, slot.ms);
}

function pauseRotation() {
  rot.paused = true;
  clearTimeout(rot.timer);
  const t = document.querySelector(".tab.active");
  if (t) t.classList.add("is-paused");
  clearTimeout(rot.idle);
  rot.idle = setTimeout(resumeRotation, IDLE_RESUME_MS);
}

function resumeRotation() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  closeModal();
  rot.paused = false;
  showSlot(rot.i + 1);
}

async function initRotation() {
  buildTabs(null);
  markTab(0, 0);
  // Any touch, click, scroll or key pauses the rotation, so whoever is using
  // the hub isn't interrupted.
  ["pointerdown", "touchstart", "keydown", "wheel"].forEach(ev =>
    document.addEventListener(ev, pauseRotation, { passive: true }));
  // Fetch live calendar events on load, then refresh every 5 minutes
  loadCalendarData();
  setInterval(loadCalendarData, 5 * 60 * 1000);
  loadTripCards();

  let stream = null;
  try {
    // /api/page/stream, not /api/stream: the screens' Access application covers
    // /api/stream, and this page's sign-in doesn't (see worker/index.js).
    const r = await fetch("/api/page/stream?output=hub-page", { credentials: "same-origin" });
    if (!r.ok) throw new Error(`/api/stream returned ${r.status}`);
    stream = await r.json();
  } catch (e) {
    console.warn("Stream unavailable, rotating every view:", e.message);
  }
  streamCards = stream ? stream.cards : [];
  rot.slots = stream ? slotsFrom(stream.cards) : MODULES
    .map((m, i) => ({ module: i, card: null, ms: FALLBACK_DWELL_MS }))
    .filter(s => MODULES[s.module].tab !== false);
  buildTabs(stream ? stream.cards : null);

  // A link to #trips (from a widget, say) opens that view, paused.
  const linked = MODULES.findIndex(m => `#${m.id}` === location.hash);
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  if (linked >= 0) { showModule(linked); return; }
  if (!rot.paused) showSlot(0);
}

// ── Calendar module ────────────────────────────────────────────────
function buildCalendar(container) {
  // Grid
  const gridWrap = document.createElement("div");
  gridWrap.innerHTML = `<div class="section-title">📅 14-Day Calendar</div>`;
  const grid = document.createElement("div");
  grid.className = "cal-grid";

  const days = plan.days;
  if (days.length) {
    for (let i = 0; i < Math.min(7, days.length); i++) {
      const h = document.createElement("div");
      h.className = "cal-dow"; h.textContent = fmtDOW(days[i].date);
      grid.appendChild(h);
    }
    days.forEach((day, i) => {
      if (i === 7) {
        const gap = document.createElement("div"); gap.className = "cal-row-gap"; grid.appendChild(gap);
      }
      const isToday = day.date === today, isPast = day.date < today;
      const d = new Date(day.date + "T12:00:00");
      const showMonth = i === 0 || d.getDate() === 1;
      const dayFlags = flagsByDate[day.date] || [];
      const pipHTML  = [...new Set(dayFlags.map(f=>f.severity))].map(s=>`<span class="pip pip-${s}"></span>`).join("");
      const dotsHTML = [...new Set((actionsByDate[day.date]||[]).filter(a=>a.assignedTo).map(a=>a.assignedTo))].map(id=>mdot(id,8)).join("");
      const cell = document.createElement("div");
      cell.className = "cal-cell" + (isToday?" is-today":"") + (isPast?" is-past":"");
      cell.dataset.date = day.date;
      cell.innerHTML = `
        <div class="cal-cell-head">
          <div>${showMonth?`<div class="cal-cell-month">${d.toLocaleDateString("en-US",{month:"short"})}</div>`:""}<div class="cal-cell-num">${d.getDate()}</div></div>
          ${isToday?'<span class="today-badge">TODAY</span>':""}
        </div>
        <div class="cal-cell-notes">${day.notes||'<span style="color:#ccc">—</span>'}</div>
        <div class="cal-cell-footer"><span class="cal-cell-footer-members">${dotsHTML}</span><span class="cal-cell-footer-flags">${pipHTML}</span></div>`;
      cell.addEventListener("click", () => openModal(day));
      grid.appendChild(cell);
    });
  }
  gridWrap.appendChild(grid);
  container.appendChild(gridWrap);

  // Flags
  const flagsHeader = makeCollapsible("flags-h","⚑ Flags &amp; Alerts", plan.flags.length);
  const flagsInner  = flagsHeader.querySelector(".inner");
  const flagsEl = document.createElement("div"); flagsEl.className = "flags";
  plan.flags.forEach(f => {
    const el = document.createElement("div");
    el.className = `flag ${f.severity}`; el.dataset.members = (f.relatedMemberIds||[]).join(",");
    el.innerHTML = `<span class="flag-icon">${FLAG_ICONS[f.severity]}</span><span>${f.message}</span>`;
    flagsEl.appendChild(el);
  });
  if (!plan.flags.length) flagsEl.innerHTML = '<p style="color:var(--muted);font-size:13px">No flags — looking good!</p>';
  flagsInner.appendChild(flagsEl);
  container.appendChild(flagsHeader);

  // Actions
  const actHeader = makeCollapsible("actions-h","✓ Action Items", plan.actionItems.length);
  const actInner  = actHeader.querySelector(".inner");
  const actEl = document.createElement("div"); actEl.className = "actions";
  const doneKey = "hub-actions-done";
  const done = new Set(JSON.parse(localStorage.getItem(doneKey)||"[]"));
  plan.actionItems.forEach(a => {
    const el = document.createElement("div");
    el.className = "action-item" + (done.has(a.id)?" done":"");
    el.dataset.assignee = a.assignedTo||"";
    el.innerHTML = `
      <input type="checkbox" ${done.has(a.id)?"checked":""}>
      ${a.assignedTo ? mdot(a.assignedTo,22) : `<span class="mdot" style="width:22px;height:22px;background:#aaa"></span>`}
      <span class="desc">${a.description}</span>
      <span style="font-size:11px;color:var(--muted)">${a.assignedTo?(MEMBER_NAMES[a.assignedTo]||a.assignedTo):"Family"}</span>
      ${a.dueDate?`<span class="due">by ${fmt(a.dueDate)}`:""}
      <span class="badge ${a.priority}">${a.priority}</span>`;
    el.querySelector("input").addEventListener("change", function() {
      if (this.checked) done.add(a.id); else done.delete(a.id);
      localStorage.setItem(doneKey, JSON.stringify([...done]));
      el.classList.toggle("done", this.checked);
    });
    actEl.appendChild(el);
  });
  actInner.appendChild(actEl);
  container.appendChild(actHeader);
}

function makeCollapsible(id, title, count) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="collapsible-header" id="${id}-hdr">
      <span class="ch-title">${title}</span>
      <span class="ch-count">${count}</span>
      <span class="ch-toggle" id="${id}-toggle">▾</span>
    </div>
    <div class="collapsible-body" id="${id}-body"><div class="inner"></div></div>`;
  wrap.querySelector(`#${id}-hdr`).addEventListener("click", () => {
    const body = wrap.querySelector(`#${id}-body`);
    const tog  = wrap.querySelector(`#${id}-toggle`);
    body.classList.toggle("collapsed");
    tog.textContent = body.classList.contains("collapsed") ? "▸" : "▾";
  });
  return wrap;
}

// ── Plan module ────────────────────────────────────────────────────
function buildPlan(container) {
  // Urgent flags at the top if any
  const urgents = plan.flags.filter(f => f.severity === "urgent");
  if (urgents.length) {
    const uw = document.createElement("div");
    uw.style.cssText = "display:flex;flex-direction:column;gap:6px;margin-bottom:16px";
    urgents.forEach(f => {
      const el = document.createElement("div");
      el.className = "flag urgent"; el.dataset.members = (f.relatedMemberIds||[]).join(",");
      el.innerHTML = `<span class="flag-icon">${FLAG_ICONS.urgent}</span><span>${f.message}</span>`;
      uw.appendChild(el);
    });
    container.appendChild(uw);
  }

  // Two-column week grid
  const weeksEl = document.createElement("div");
  weeksEl.className = "plan-weeks";

  [0, 1].forEach(wk => {
    const col = document.createElement("div");
    const weekDays = plan.days.slice(wk * 7, wk * 7 + 7);
    const start = weekDays[0]?.date, end = weekDays[weekDays.length-1]?.date;
    const label = start && end
      ? `${new Date(start+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${new Date(end+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}`
      : `Week ${wk+1}`;
    col.innerHTML = `<div class="plan-week-label">Week ${wk+1} &nbsp;·&nbsp; ${label}</div>`;
    weekDays.forEach(day => {
      const isToday = day.date === today, isPast = day.date < today;
      const d = new Date(day.date + "T12:00:00");
      const dayFlags = flagsByDate[day.date] || [];
      const pips = [...new Set(dayFlags.map(f=>f.severity))].map(s=>`<span class="pip pip-${s}"></span>`).join("");
      const dots = [...new Set((actionsByDate[day.date]||[]).filter(a=>a.assignedTo).map(a=>a.assignedTo))].map(id=>mdot(id,8)).join("");

      const card = document.createElement("div");
      card.className = "plan-day" + (isToday?" is-today":"") + (isPast?" is-past":"");
      card.dataset.date = day.date;
      card.innerHTML = `
        <div class="plan-day-head">
          <span class="plan-day-date">${d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</span>
          ${isToday?'<span class="today-badge">TODAY</span>':""}
        </div>
        ${day.notes ? `<div class="plan-day-notes">${day.notes}</div>` : ""}
        ${day.logistics ? `<div class="plan-day-logistics">${day.logistics}</div>` : ""}
        ${(pips||dots) ? `<div class="plan-day-pips"><span class="plan-day-pips-members">${dots}</span><span class="plan-day-pips-flags">${pips}</span></div>` : ""}`;
      col.appendChild(card);
    });
    weeksEl.appendChild(col);
  });

  container.appendChild(weeksEl);
}

// ── Strava module ─────────────────────────────────────────────────
function buildStrava(container) {
  const members = stravaData.members || {};
  const memberIds = Object.keys(members);

  container.innerHTML = '';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'strava-header';
  hdr.innerHTML = `<span class="strava-logo">STRAVA</span><span class="strava-tagline">Recent workouts for the family</span>`;
  container.appendChild(hdr);

  // No data state
  if (!memberIds.length) {
    const empty = document.createElement('div');
    empty.className = 'strava-empty';
    empty.innerHTML = `<div>No Strava accounts connected yet.</div>
      <div>Add <code>strava</code> under <code>inputs:</code> in <code>workspace/family.yaml</code>,<br>
      then run <code>npx family-hub setup strava</code> and <code>npx family-hub sync</code>.</div>`;
    container.appendChild(empty);
    return;
  }

  const membersWrap = document.createElement('div');
  membersWrap.className = 'strava-members';

  memberIds.forEach(memberId => {
    const activities = members[memberId] || [];
    const color = MEMBER_COLORS[memberId] || '#fc4c02';
    const name  = MEMBER_NAMES[memberId]  || memberId;

    const block = document.createElement('div');
    block.className = 'strava-member-block';

    // Member heading
    const head = document.createElement('div');
    head.className = 'strava-member-head';

    // All stats scoped to last 6 weeks
    const now = new Date();
    const windowStart = new Date(now); windowStart.setDate(now.getDate() - 42);
    const windowActs = activities.filter(a => new Date(a.startDate) >= windowStart);
    const windowMiles = windowActs.reduce((s, a) => s + (a.distance || 0), 0) / 1609.344;
    head.innerHTML =
      `${mdot(memberId, 22)}` +
      `<span class="strava-member-name">${name}</span>` +
      `<span class="strava-member-stats">` +
      `${windowActs.length} activities &nbsp;·&nbsp; ${windowMiles.toFixed(1)} mi &nbsp;·&nbsp; last 6 wks` +
      `</span>`;
    block.appendChild(head);

    // Weekly activity bar chart (last 6 weeks)
    const weeks = Array.from({ length: 6 }, (_, i) => {
      const wEnd = new Date(now);
      wEnd.setDate(now.getDate() - i * 7);
      const wStart = new Date(wEnd);
      wStart.setDate(wEnd.getDate() - 7);
      const label = i === 0 ? 'This wk' : i === 1 ? 'Last wk' :
        wStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const wActs = activities.filter(a => { const d = new Date(a.startDate); return d >= wStart && d < wEnd; });
      const miles = wActs.reduce((s, a) => s + (a.distance || 0), 0) / 1609.344;
      const count = wActs.length;
      return { label, miles, count };
    }).reverse();

    // Bar height = miles if any distance, else activity count (so weight training still shows)
    const maxVal = Math.max(...weeks.map(w => w.miles > 0 ? w.miles : w.count * 0.5), 1);
    const chart = document.createElement('div');
    chart.className = 'strava-week-chart';
    weeks.forEach((w, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'strava-bar-wrap';
      const val = w.miles > 0 ? w.miles : w.count * 0.5;
      const pct = Math.max(3, (val / maxVal) * 100);
      const isThisWeek = i === weeks.length - 1;
      const barLabel = w.miles > 0 ? w.miles.toFixed(1) : (w.count > 0 ? `${w.count}×` : '');
      const barTitle = w.miles > 0 ? `${w.miles.toFixed(1)} mi` : `${w.count} workout${w.count !== 1 ? 's' : ''}`;
      wrap.innerHTML =
        `<div class="strava-bar" style="height:${pct}%;background:${isThisWeek ? color : color + '66'};" title="${barTitle}"></div>` +
        `<div class="strava-bar-label">${barLabel}</div>`;
      chart.appendChild(wrap);
    });
    block.appendChild(chart);

    // Recent activities list (last 6 weeks, up to 8 shown)
    const actList = document.createElement('div');
    actList.className = 'strava-activities';
    const recent = windowActs.slice(0, 8);
    recent.forEach(a => {
      const isRun = (a.type || '').includes('Run') || (a.sportType || '').includes('Run');
      const icon = SPORT_ICON[a.sportType] || SPORT_ICON[a.type] || '🏅';
      const dimmed = activeFilter && activeFilter !== memberId;

      const row = document.createElement('div');
      row.className = 'strava-activity' + (dimmed ? ' dimmed' : '');
      row.dataset.memberId = memberId;

      const statsHtml = isRun
        ? `<div class="strava-stat"><div class="strava-stat-val">${fmtDist(a.distance)}</div><div class="strava-stat-lbl">miles</div></div>
           <div class="strava-stat"><div class="strava-stat-val">${fmtPace(a.averageSpeed)}</div><div class="strava-stat-lbl">/ mile</div></div>
           <div class="strava-stat"><div class="strava-stat-val">${fmtDuration(a.movingTime)}</div><div class="strava-stat-lbl">time</div></div>`
        : `<div class="strava-stat"><div class="strava-stat-val">${fmtDist(a.distance)}</div><div class="strava-stat-lbl">miles</div></div>
           <div class="strava-stat"><div class="strava-stat-val">${fmtDuration(a.movingTime)}</div><div class="strava-stat-lbl">time</div></div>`;

      const elevHtml = a.totalElevationGain > 10
        ? `<div class="strava-stat"><div class="strava-stat-val">${fmtElevation(a.totalElevationGain)}</div><div class="strava-stat-lbl">gain</div></div>`
        : '';
      const hrHtml = a.averageHeartrate
        ? `<span class="strava-hr-badge">♥ ${Math.round(a.averageHeartrate)}</span>`
        : '';

      row.innerHTML =
        `<span class="strava-act-icon">${icon}</span>` +
        `<div class="strava-act-info">` +
          `<div class="strava-act-name">${a.name}</div>` +
          `<div class="strava-act-date">${activityDate(a.startDate)}</div>` +
        `</div>` +
        `<div class="strava-act-stats">${statsHtml}${elevHtml}${hrHtml}</div>`;

      actList.appendChild(row);
    });

    if (!recent.length) {
      actList.innerHTML = `<p style="color:var(--muted);font-size:13px">No recent activities.</p>`;
    }

    block.appendChild(actList);
    membersWrap.appendChild(block);
  });

  container.appendChild(membersWrap);
}

// ── Trips and past trips ───────────────────────────────────────────
// One card per trip, from the stream's trips and past-trips components
// (trips.yaml joined with each trip app's hero, countdown and leaderboard).
// The spotlight shows the card the rotation is on, or the one you tapped,
// with the trip's details from trips.yaml below it.

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function loadTripCards() {
  return fetch("/api/page/stream?components=trips,past-trips&all=1", { credentials: "same-origin" })
    .then(r => (r.ok ? r.json() : Promise.reject(new Error(`/api/stream returned ${r.status}`))))
    .then(d => { tripsState.cards = d.cards || []; })
    .catch(e => console.warn("Trip cards unavailable:", e.message))
    .then(() => {
      tripsState.loaded = true;
      renderTrips(tripsState.focus.trips);
      renderPastTrips(tripsState.focus["past-trips"]);
    });
}

function buildTrips(container) { tripsState.trips = container; renderTrips(null); }
function buildPastTrips(container) { tripsState.past = container; renderPastTrips(null); }

function renderTrips(focusId, card) { renderTripList("trips", tripsState.trips, focusId, card); }
function renderPastTrips(focusId, card) { renderTripList("past-trips", tripsState.past, focusId, card); }

function renderTripList(component, el, focusId, focusCard) {
  if (!el) return;
  clearInterval(tripsState.slides[component]);
  tripsState.focus[component] = focusId;
  let cards = tripsState.cards.filter(c => c.component === component);
  if (focusCard && !cards.some(c => c.id === focusCard.id)) cards = [focusCard].concat(cards);
  el.innerHTML = "";
  if (!cards.length) {
    el.innerHTML = `<p class="muted-note">${!tripsState.loaded ? "Loading trips…"
      : component === "trips" ? "No trips coming up. Add one to workspace/trips.yaml."
      : "No past trips yet."}</p>`;
    return;
  }
  const focus = cards.find(c => c.id === focusId) || cards[0];
  const spot = tripCardEl(focus, true);
  el.appendChild(spot);
  // A trip with its own shared album shows a new photo from it every few seconds.
  const album = (focus.data.album && focus.data.album.photos) || [];
  if (album.length > 1) {
    let n = 0;
    tripsState.slides[component] = setInterval(() => {
      if (el.parentNode && el.closest(".mod-hidden")) return;
      const next = album[++n % album.length];
      const img = new Image();
      img.onload = () => { spot.style.backgroundImage = `url("${next}")`; };
      img.src = next;
    }, TRIP_SLIDE_MS);
  }
  const t = (family.trips || []).find(x => x.id === focus.data.trip);
  if (t) {
    if (t.description) {
      const p = document.createElement("p");
      p.className = "tc-desc";
      p.textContent = t.description;
      el.appendChild(p);
    }
    if (component === "trips") el.appendChild(tripDetails(t));
  }
  const rest = cards.filter(c => c !== focus);
  if (rest.length) {
    const lbl = document.createElement("div");
    lbl.className = "trip-section-label";
    lbl.textContent = component === "trips" ? "Also coming up" : "More adventures";
    el.appendChild(lbl);
    const grid = document.createElement("div");
    grid.className = "trips-grid";
    rest.forEach(c => grid.appendChild(tripCardEl(c, false)));
    el.appendChild(grid);
  }
}

function tripCardEl(card, spot) {
  const d = card.data, g = card.glance, past = card.component === "past-trips";
  const app = TRIP_APPS[d.trip];
  const el = document.createElement("div");
  el.className = "tc" + (spot ? " tc-spot" : "") + (g.image ? " tc-photo" : "");
  if (g.image) el.style.backgroundImage = `url("${g.image}")`;
  const dot = (name, color, size) =>
    `<span class="mdot" style="width:${size}px;height:${size}px;background:${esc(color)}">${esc((name || "?")[0])}</span>`;
  const who = (d.who || []).filter(id => MEMBER_COLORS[id]).map(id => mdot(id, spot ? 24 : 18)).join("");
  const scored = (d.leaderboard || []).some(r => r.points > 0);
  const rows = (d.leaderboard || []).filter(r => scored || spot).slice(0, spot ? 9 : 3);
  const board = rows.length && (scored || d.questsTotal)
    ? `<div class="tc-label">${past ? "Final standings" : "Quest leaderboard"}${d.questsTotal ? ` · ${d.questsDone} of ${d.questsTotal} quests found` : ""}</div>
       <div class="tc-board">${rows.map(r => `<div class="tc-row">${dot(r.name, r.color, 18)}<span>${esc(r.name)}</span><span class="pts">${r.points}</span></div>`).join("")}</div>`
    : "";
  const today = (d.today || []).map(i => `<div>${i.time ? `<b>${esc(i.time)}</b> ` : ""}${esc(i.emoji || "")} ${esc(i.title)}</div>`).join("");
  const highlights = (d.album ? `<span class="tc-chip">📷 ${d.album.count} photo${d.album.count === 1 ? "" : "s"}</span>` : "") +
    (past ? (d.highlights || []).slice(0, spot ? 8 : 3)
      .map(h => `<span class="tc-chip">${esc(h.emoji || "")} ${esc(h.label)}</span>`).join("") : "");
  el.innerHTML = `<div class="tc-body">
    ${past ? "" : `<span class="tc-badge">${d.status === "active" ? "Happening now" : "Coming up"}</span>`}
    <div class="tc-count">${past ? esc(g.emoji || "✈️") : esc(g.headline)}</div>
    <div class="tc-name">${!past && g.emoji ? esc(g.emoji) + " " : ""}${esc(d.name)}</div>
    <div class="tc-sub">${esc([d.destination, d.dates].filter(Boolean).join(" · "))}</div>
    ${who ? `<div class="tc-who">${who}</div>` : ""}
    ${highlights ? `<div class="tc-chips">${highlights}</div>` : ""}
    ${board}
    ${today ? `<div class="tc-label">Today</div><div class="tc-today">${today}</div>` : ""}
    ${spot && app ? `<a class="tc-app" href="${esc(app)}">Open trip app →</a>` : ""}
  </div>`;
  // Tap a small card to spotlight it; tap the spotlight to open the trip app.
  el.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    if (!spot) { renderTripList(card.component, past ? tripsState.past : tripsState.trips, card.id); window.scrollTo(0, 0); }
    else if (app) location.href = app;
  });
  return el;
}

/** What trips.yaml says about a trip: highlights, a map, things to do, restaurants, tips. */
function tripDetails(trip) {
  const wrap = document.createElement('div');
  wrap.className = 'ft-section';
  // ── Highlights grid
  const highlights = trip.highlights || [];
  if (highlights.length) {
    const grid = document.createElement('div');
    grid.className = 'ft-highlights';
    highlights.forEach(h => {
      const card = document.createElement('div');
      card.className = 'ft-highlight';
      card.style.background = h.bg || '#0891b2';
      card.innerHTML = `<span class="ft-h-emoji">${h.emoji}</span><div class="ft-h-label">${h.label}</div><div class="ft-h-caption">${h.caption}</div>`;
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  }

  // ── Map + Activities
  const activities = trip.activities || [];
  const split = document.createElement('div');
  split.className = 'ft-split';

  // Map — 3×3 OSM tile grid; works in any WebView (plain img tags, no iframe/API key needed)
  if (trip.mapBbox) {
    const [west, south, east, north] = trip.mapBbox.split(',').map(Number);
    const lat = (south + north) / 2;
    const lon = (west + east) / 2;
    const zoom = 7;
    const n = Math.pow(2, zoom);
    const tx = Math.floor((lon + 180) / 360 * n);
    const latRad = lat * Math.PI / 180;
    const ty = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);

    const mapDiv = document.createElement('div');
    mapDiv.className = 'ft-map';

    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:relative;overflow:hidden;width:100%;height:340px;display:flex;align-items:center;justify-content:center;background:#aad3df;';

    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,256px);grid-template-rows:repeat(3,256px);flex-shrink:0;';
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const tile = document.createElement('img');
        tile.src = `https://tile.openstreetmap.org/${zoom}/${tx + dx}/${ty + dy}.png`;
        tile.width = 256; tile.height = 256;
        tile.style.cssText = 'display:block;';
        grid.appendChild(tile);
      }
    }

    // Red dot marker at destination center
    const dot = document.createElement('div');
    dot.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;background:var(--urgent);border:2px solid white;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.5);z-index:1;pointer-events:none;';

    wrapper.appendChild(grid);
    wrapper.appendChild(dot);
    mapDiv.appendChild(wrapper);
    split.appendChild(mapDiv);
  }

  // Activities
  if (activities.length) {
    const actDiv = document.createElement('div');
    actDiv.className = 'ft-activities';
    const actTitle = document.createElement('div');
    actTitle.className = 'ft-sub-title'; actTitle.style.margin = '0 0 8px'; actTitle.textContent = '🌟 Things To Do';
    actDiv.appendChild(actTitle);
    activities.forEach(a => {
      const row = document.createElement('div');
      row.className = 'ft-act-row';
      row.innerHTML = `<span class="ft-act-emoji">${a.emoji}</span><div><div class="ft-act-name">${a.name}</div><div class="ft-act-note">${a.note}</div></div>`;
      actDiv.appendChild(row);
    });
    split.appendChild(actDiv);
  }
  wrap.appendChild(split);

  // ── Restaurants
  const restaurants = trip.restaurants || [];
  if (restaurants.length) {
    const restTitle = document.createElement('div');
    restTitle.className = 'ft-sub-title'; restTitle.textContent = '🍽️ Top Restaurants';
    wrap.appendChild(restTitle);
    const grid = document.createElement('div');
    grid.className = 'ft-restaurants';
    const PRICE_COLORS = {'$':'#16a34a','$$':'#d97706','$$$':'#ea580c','$$$$':'#dc2626'};
    restaurants.forEach(r => {
      const card = document.createElement('div');
      card.className = 'ft-restaurant';
      card.innerHTML = `
        <div class="ft-rest-head">
          <span class="ft-rest-name">${r.name}</span>
          <span class="ft-rest-price" style="color:${PRICE_COLORS[r.price]||'var(--muted)'}">${r.price}</span>
          <span class="ft-rest-type">${r.type}</span>
        </div>
        <div class="ft-rest-note">${r.note}</div>`;
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  }

  // ── Tips
  const ideas = trip.ideas || [];
  if (ideas.length) {
    const tipsTitle = document.createElement('div');
    tipsTitle.className = 'ft-sub-title'; tipsTitle.textContent = '💡 Tips & Reminders';
    wrap.appendChild(tipsTitle);
    const tips = document.createElement('div');
    tips.className = 'ft-tips';
    ideas.forEach(idea => {
      const row = document.createElement('div');
      row.className = 'ft-tip';
      row.innerHTML = `<span class="ft-tip-arrow">→</span><span>${idea}</span>`;
      tips.appendChild(row);
    });
    wrap.appendChild(tips);
  }

  return wrap;
}

// ── Escape Rooms module ────────────────────────────────────────────
function buildEscapeRooms(container) {
  container.innerHTML = '<div id="er-wrap"></div>';
  renderEscapeRooms(family.escapeRooms || [], false, container.querySelector('#er-wrap'));
}

/** The hub's rooms (v2.7), or the published list before they're brought in. */
function loadEscapeRooms() {
  return fetch('/api/household/rooms', { credentials: 'same-origin' })
    .then(r => (r.ok ? r.json() : null))
    .then(d => {
      const kept = d && d.enabled && (d.rooms || []).filter(r => !r.archived);
      renderEscapeRooms(kept && kept.length ? kept : family.escapeRooms || [], !!(kept && kept.length));
    })
    .catch(() => renderEscapeRooms(family.escapeRooms || [], false));
}

function renderEscapeRooms(rooms, kept, el) {
  const wrap = el || document.getElementById('er-wrap');
  if (!wrap) return;
  if (!rooms.length) {
    wrap.innerHTML = '<p style="color:var(--muted);font-size:14px;padding:20px 0">No escape rooms yet. Add one at <a href="/household/#rooms">Household › Escape rooms</a>.</p>';
    return;
  }
  const sorted = [...rooms].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const solvedCount = rooms.filter(r => r.solved).length;
  const pct = Math.round(solvedCount / rooms.length * 100);
  const timed = rooms.filter(r => r.solved && r.escapeTime && r.escapeTime !== '-10 seconds' && !isNaN(parseInt(r.escapeTime)));
  const fastest = timed.reduce((best, r) => (!best || parseInt(r.escapeTime) < parseInt(best.escapeTime) ? r : best), null);

  let html = `<div class="er-stats">
    <div class="er-stat"><div class="er-stat-val">${rooms.length}</div><div class="er-stat-label">Rooms</div></div>
    <div class="er-stat"><div class="er-stat-val">${solvedCount}</div><div class="er-stat-label">Escaped</div></div>
    <div class="er-stat"><div class="er-stat-val">${rooms.length - solvedCount}</div><div class="er-stat-label">Failed</div></div>
    <div class="er-stat"><div class="er-stat-val">${pct}%</div><div class="er-stat-label">Win Rate</div></div></div>
    <div class="er-grid">`;
  sorted.forEach(room => {
    let dateStr = '';
    if (room.date) {
      const d = new Date(room.date + 'T12:00:00');
      dateStr = room.approxDate ? '~' + d.getFullYear() : d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    }
    const isFastest = fastest && room === fastest;
    let badge;
    if (room.solved) {
      badge = room.escapeTime === '-10 seconds' ? '<span class="er-time-badge er-clutch">Buzzer beater</span>'
        : `<span class="er-time-badge solved">${room.escapeTime ? esc(room.escapeTime) : '✓ Escaped'}${isFastest ? ' · Fastest' : ''}</span>`;
    } else {
      badge = `<span class="er-time-badge failed">✗ ${esc(room.failNote || 'Not solved')}</span>`;
    }
    const pic = kept && room.imageUrl ? `<img src="/api/household/image/rooms/${encodeURIComponent(room.id)}?v=${encodeURIComponent(room.imageVersion || '')}" alt="" loading="lazy" onerror="this.remove()">` : '';
    const dots = (room.who || []).filter(Boolean).map(id => mdot(id, 20)).join('');
    html += `<div class="er-tile${isFastest ? ' er-card-fastest' : ''}">
      <div class="er-pic">${pic}<div class="er-pic-shade"></div>
        <div class="er-pic-name">${esc(room.room)}</div>
        <div class="er-pic-badge">${badge}</div></div>
      <div class="er-tile-body">
        <div class="er-venue-line"><span class="er-venue">${esc(room.venue || '')}</span>${room.city ? `<span class="er-city">· ${esc(room.city)}</span>` : ''}${dateStr ? `<span class="er-city">· ${dateStr}</span>` : ''}
          ${room.url ? `<a class="er-url" href="${esc(room.url)}" target="_blank" rel="noopener">↗</a>` : ''}</div>
        ${room.notes ? `<div class="er-notes">${esc(room.notes)}</div>` : ''}
        ${dots ? `<div class="er-dots">${dots}</div>` : ''}
      </div></div>`;
  });
  wrap.innerHTML = html + '</div>';
}
function buildPhotos(container) {
  container.innerHTML = '<div class="photo-frame"><img alt=""><img alt=""></div>' +
    '<p class="photo-empty" style="display:none"></p>';
  photoState.imgs = [...container.querySelectorAll(".photo-frame img")];
  photoState.frame = container.querySelector(".photo-frame");
  photoState.empty = container.querySelector(".photo-empty");
  loadPhotoList();
  photoState.timer = setInterval(() => {
    if (rot.paused && !container.classList.contains("mod-hidden")) nextPhoto();
  }, PHOTO_MS);
}

// The whole album, for the Photos tab when someone opens it: every photo card in the stream.
function loadPhotoList() {
  return fetch("/api/page/stream?components=photos&all=1", { credentials: "same-origin" })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      const photos = ok && Array.isArray(d.cards)
        ? d.cards.filter(c => c.glance && c.glance.image).map(c => ({ id: c.id, image: c.glance.image }))
        : [];
      if (!photos.length) {
        photoState.frame.style.display = "none";
        photoState.empty.style.display = "";
        photoState.empty.textContent = (d && d.error) ||
          "No photos yet. Add some to the family's shared album.";
        return;
      }
      const list = photos;
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = list[i]; list[i] = list[j]; list[j] = t;
      }
      photoState.list = list; photoState.i = 0; photoState.loadedAt = Date.now();
      photoState.frame.style.display = ""; photoState.empty.style.display = "none";
      if (!photoState.imgs.some(img => img.classList.contains("shown"))) nextPhoto();
    })
    .catch(() => {});
}

/** A photo card from the stream. */
function showPhotoCard(card) {
  if (!card.glance || !card.glance.image) return;
  showPhotoUrl(card.glance.image);
}

function showPhotoUrl(src) {
  const st = photoState;
  st.frame.style.display = ""; st.empty.style.display = "none";
  const back = st.imgs[1 - st.front];
  back.onload = () => {
    back.classList.add("shown");
    st.imgs[st.front].classList.remove("shown");
    st.front = 1 - st.front;
  };
  back.src = src;
}

function nextPhoto() {
  const st = photoState;
  if (!st.list.length) return;
  // Pick up newly added photos every 10 minutes.
  if (Date.now() - st.loadedAt > 10 * 60_000) loadPhotoList();
  const photo = st.list[st.i++ % st.list.length];
  showPhotoUrl(photo.image);
}

function buildMovies(container) {
  // Built before it's in the page: find the wrapper in the container, not the document.
  container.innerHTML = '<div id="mv-wrap"></div>';
  buildOldMovies(container.querySelector('#mv-wrap'));
}

// ── Movies (v2.8): the assistant's monthly picks, with everyone's marks ──
const movieState = { list: null, busy: false };

function loadMoviesView() {
  return fetch('/api/household/movies', { credentials: 'same-origin' })
    .then(r => (r.ok ? r.json() : null))
    .then(d => { if (d && d.enabled && (d.movies || []).length) { movieState.list = d.movies; renderMovies(); } })
    .catch(() => {});
}

function markMovie(id, member) {
  const m = (movieState.list || []).find(x => x.id === id);
  if (!m || movieState.busy) return;
  const now = (m.marks || {})[member] || null;
  const next = now === null ? 'want' : now === 'want' ? 'seen' : null;
  m.marks = Object.assign({}, m.marks, { [member]: next });
  if (!next) delete m.marks[member];
  renderMovies();
  movieState.busy = true;
  fetch(`/api/household/movies/${encodeURIComponent(id)}/mark`, {
    method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ member, mark: next }),
  }).then(r => r.json()).then(d => { if (d.movies) movieState.list = d.movies; })
    .catch(() => {}).then(() => { movieState.busy = false; renderMovies(); });
}

function renderMovies() {
  const wrap = document.getElementById('mv-wrap');
  const list = movieState.list;
  if (!wrap || !list) return;
  const today = new Date().toISOString().slice(0, 10);
  const recent = new Date(Date.now() - 45 * 86400000).toISOString().slice(0, 10);
  const live = list.filter(m => !m.releaseDate || m.releaseDate >= recent);
  const theaters = m => !m.where || /theat/i.test(m.where);
  const groups = [
    ['Coming to theaters', live.filter(m => theaters(m) && m.releaseDate && m.releaseDate > today).sort((a, b) => a.releaseDate.localeCompare(b.releaseDate))],
    ['In theaters now', live.filter(m => theaters(m) && (!m.releaseDate || m.releaseDate <= today)).sort((a, b) => (b.releaseDate || '').localeCompare(a.releaseDate || ''))],
    ['Streaming', live.filter(m => !theaters(m)).sort((a, b) => (a.releaseDate || '').localeCompare(b.releaseDate || ''))],
  ];
  const members = HUB_CONFIG.members;
  const seen = members.map(mem => [mem, list.filter(m => (m.marks || {})[mem.id] === 'seen').length]).filter(x => x[1]);
  const day = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  let html = seen.length ? `<div class="mv-seen">Seen: ${seen.sort((a, b) => b[1] - a[1]).map(([mem, n]) => `<span><span class="sw" style="background:${esc(MEMBER_COLORS[mem.id] || '#888')}"></span>${esc(mem.name)} ${n}</span>`).join('')}</div>` : '';
  html += '<div class="mv-hint">Tap a dot: want to see ★, then seen ✓.</div>';
  groups.forEach(([title, items]) => {
    if (!items.length) return;
    html += `<div class="section-title">${title}</div><div class="mv-grid">`;
    items.forEach(m => {
      // No date yet: just where it'll be.
      const when = m.releaseDate ? (m.releaseDate > today ? day(m.releaseDate) : theaters(m) ? 'Now' : 'Now on ' + m.where)
        : theaters(m) ? 'Coming soon' : 'On ' + m.where;
      const where = !theaters(m) && m.releaseDate && m.releaseDate > today ? ' · ' + esc(m.where) : '';
      const dots = members.map(mem => {
        const mark = (m.marks || {})[mem.id] || '';
        return `<button type="button" class="mv-dot ${mark}" style="--c:${esc(MEMBER_COLORS[mem.id] || '#888')}" data-movie="${esc(m.id)}" data-member="${esc(mem.id)}"
          title="${esc(mem.name)}">${mark === 'want' ? '★' : mark === 'seen' ? '✓' : esc(mem.name[0])}</button>`;
      }).join('');
      html += `<div class="mv-card">
        <div class="mv-poster">${m.imageUrl ? `<img src="/api/household/image/movies/${encodeURIComponent(m.id)}?v=${encodeURIComponent(m.imageVersion || '')}" alt="" loading="lazy" onerror="this.remove()">` : ''}
          <span class="mv-kind">${m.kind === 'show' ? '📺' : '🍿'}</span>
          ${m.format ? `<span class="mv-format">${esc(m.format)}</span>` : ''}</div>
        <div class="mv-body">
          <div class="movie-title">${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : esc(m.title)}</div>
          <div class="mv-when">${esc(when)}${where}</div>
          ${m.blurb ? `<div class="mv-blurb">${esc(m.blurb)}</div>` : ''}
          ${m.forWhom ? `<div class="mv-for">For ${esc(m.forWhom)}</div>` : ''}
          <div class="mv-dots">${dots}</div>
        </div></div>`;
    });
    html += '</div>';
  });
  wrap.innerHTML = html;
  Array.prototype.forEach.call(wrap.querySelectorAll('.mv-dot'), b =>
    b.addEventListener('click', () => markMovie(b.getAttribute('data-movie'), b.getAttribute('data-member'))));
}

function buildOldMovies(container) {
  const movies = family.movies || [];
  if (!movies.length) {
    container.innerHTML = '<p style="color:var(--muted);font-size:14px;padding:20px 0">No movies yet — add entries to workspace/movies.yaml</p>';
    return;
  }
  const watchList = movies
    .filter(m => m.status === 'want-to-watch')
    .sort((a, b) => (a.releaseDate||'').localeCompare(b.releaseDate||''));
  const watched = movies
    .filter(m => m.status === 'watched')
    .sort((a, b) => (b.watchedDate||b.releaseDate||'').localeCompare(a.watchedDate||a.releaseDate||''));

  function relDate(d) {
    if (!d) return '';
    return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  }
  function isComingSoon(d) {
    if (!d) return false;
    const days = (new Date(d+'T12:00:00') - new Date()) / 86400000;
    return days >= 0 && days <= 45;
  }
  function movieCard(m) {
    const dotsHtml    = (m.who||[]).map(id => mdot(id, 20)).join('');
    const stars       = m.rating ? '★'.repeat(m.rating)+'☆'.repeat(5-m.rating) : '';
    const formatKey   = (m.format||'').toLowerCase().replace(/\s+/g,'-');
    const formatBadge = m.format ? `<span class="movie-format movie-format-${formatKey}">${m.format}</span>` : '';
    const streamBadge = m.streaming ? `<span class="movie-streaming">▶ ${m.streaming}</span>` : '';
    const card        = document.createElement('div');
    card.className    = 'movie-card';
    card.innerHTML = `
      <span class="movie-poster">${m.status==='watched' ? '🎥' : '🎬'}</span>
      <div style="flex:1;min-width:0">
        <div class="movie-title">${m.title}</div>
        <div class="movie-meta">
          ${m.status!=='watched' && m.releaseDate ? `<span class="movie-date">${relDate(m.releaseDate)}</span>` : ''}
          ${m.watchedDate ? `<span class="movie-date">${relDate(m.watchedDate)}</span>` : ''}
          ${stars ? `<span class="movie-stars">${stars}</span>` : ''}
          ${formatBadge}
          ${streamBadge}
          ${isComingSoon(m.releaseDate) && !m.streaming ? '<span class="movie-soon">Soon!</span>' : ''}
          <span style="display:flex;gap:3px">${dotsHtml}</span>
        </div>
        ${m.notes ? `<div class="movie-notes">${m.notes}</div>` : ''}
      </div>`;
    return card;
  }

  if (watchList.length) {
    const sec = document.createElement('div'); sec.className = 'movies-section';
    const lbl = document.createElement('div'); lbl.className = 'movies-section-label'; lbl.textContent = 'Want to Watch';
    sec.appendChild(lbl);
    watchList.forEach(m => sec.appendChild(movieCard(m)));
    container.appendChild(sec);
  }
  if (watched.length) {
    const sec = document.createElement('div'); sec.className = 'movies-section';
    const lbl = document.createElement('div'); lbl.className = 'movies-section-label'; lbl.textContent = 'Recently Watched';
    sec.appendChild(lbl);
    watched.forEach(m => sec.appendChild(movieCard(m)));
    container.appendChild(sec);
  }
}

// ── Grocery List module ────────────────────────────────────────────
// One list for every screen, kept by the hub (/api/grocery). Each change is
// sent as it happens, and the list refreshes every minute while it's showing.

function groceryId() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function groceryRequest(body) {
  const opts = body
    ? { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    : { credentials: 'same-origin' };
  return fetch('/api/grocery', opts).then(r => {
    if (!r.ok) throw new Error(`/api/grocery returned ${r.status}`);
    return r.json();
  }).then(d => d.items || []);
}

function setGroceryStatus(text) { if (grocery.statusEl) grocery.statusEl.textContent = text; }

/** Moves a list this device kept locally (before v0.8) onto the shared list, once. */
function migrateLocalGrocery() {
  let old = null;
  try { old = JSON.parse(localStorage.getItem(OLD_GROCERY_KEY) || 'null'); } catch (e) { old = null; }
  if (!Array.isArray(old) || !old.length) { localStorage.removeItem(OLD_GROCERY_KEY); return Promise.resolve(); }
  const now = Date.now();
  const upserts = old.filter(i => i && i.text).map((i, n) => ({
    id: groceryId() + n, name: String(i.text), quantity: i.qty || 1, done: false, addedAt: now + n, updatedAt: now,
  }));
  // Only forget the local copy once the hub has it.
  return groceryRequest({ upserts }).then(() => localStorage.removeItem(OLD_GROCERY_KEY));
}

function loadGrocery() {
  return migrateLocalGrocery()
    .then(() => groceryRequest())
    .then(items => { grocery.items = items; setGroceryStatus(''); })
    .catch(e => { console.warn(e.message); setGroceryStatus("Couldn't reach the hub. This is the last list it sent."); })
    .then(renderGrocery);
}

function saveGrocery(body) {
  return groceryRequest(body)
    .then(items => { grocery.items = items; setGroceryStatus(''); renderGrocery(); })
    .catch(e => { console.warn(e.message); setGroceryStatus("Couldn't save that. Check the connection and try again."); });
}

function changeItem(item, fields) {
  const next = Object.assign({}, item, fields, { updatedAt: Date.now() });
  grocery.items = grocery.items.map(i => (i.id === item.id ? next : i));
  renderGrocery();
  saveGrocery({ upserts: [next] });
}

function renderGrocery() {
  const listEl = grocery.listEl;
  if (!listEl) return;
  listEl.innerHTML = '';
  if (!grocery.items.length) {
    listEl.innerHTML = '<p class="muted-note">Nothing on the list.</p>';
  }
  grocery.items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'action-item grocery-item' + (item.done ? ' grocery-done' : '');
    el.innerHTML = `
      <button type="button" class="grocery-check" aria-label="${item.done ? 'Not bought' : 'Bought'}">${item.done ? '✓' : ''}</button>
      <div class="grocery-qty-wrap">
        <button type="button" class="grocery-qty-btn minus-btn">-</button>
        <input type="number" class="grocery-qty-input qty-inp" value="${item.quantity || 1}" min="1">
        <button type="button" class="grocery-qty-btn plus-btn">+</button>
      </div>
      <span class="desc">${esc(item.name)}${item.store ? ` <span class="grocery-meta">${esc(item.store)}</span>` : ''}${item.fromPlan ? ' <span class="grocery-meta">from the plan</span>' : ''}</span>
      ${item.addedBy && MEMBER_COLORS[item.addedBy] ? mdot(item.addedBy, 20) : ''}
      <button type="button" class="grocery-del-btn" aria-label="Remove">🗑️</button>`;
    el.querySelector('.grocery-check').addEventListener('click', () => changeItem(item, { done: !item.done }));
    el.querySelector('.minus-btn').addEventListener('click', () => changeItem(item, { quantity: Math.max(1, (item.quantity || 1) - 1) }));
    el.querySelector('.plus-btn').addEventListener('click', () => changeItem(item, { quantity: Math.min(99, (item.quantity || 1) + 1) }));
    el.querySelector('.qty-inp').addEventListener('change', e => {
      const v = parseInt(e.target.value, 10);
      changeItem(item, { quantity: isNaN(v) || v < 1 ? 1 : Math.min(99, v) });
    });
    el.querySelector('.grocery-del-btn').addEventListener('click', () => {
      grocery.items = grocery.items.filter(i => i.id !== item.id);
      renderGrocery();
      saveGrocery({ deletes: [item.id] });
    });
    listEl.appendChild(el);
  });
  const done = grocery.items.filter(i => i.done);
  if (done.length) {
    const clear = document.createElement('button');
    clear.type = 'button';
    clear.className = 'grocery-clear';
    clear.textContent = `Clear ${done.length} bought`;
    clear.addEventListener('click', () => {
      grocery.items = grocery.items.filter(i => !i.done);
      renderGrocery();
      saveGrocery({ deletes: done.map(i => i.id) });
    });
    listEl.appendChild(clear);
  }
}

function buildGroceryList(container) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="section-title">🛒 Grocery List</div>`;

  const form = document.createElement('form');
  form.className = 'grocery-form';
  form.innerHTML = `
    <input type="text" id="grocery-input" class="grocery-input" placeholder="Add new item..." autocomplete="off">
    <button type="submit" class="grocery-add-btn">Add</button>
  `;
  form.addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('grocery-input');
    const name = input.value.trim();
    if (!name) return;
    const now = Date.now();
    const item = { id: groceryId(), name, quantity: 1, done: false, addedAt: now, updatedAt: now };
    input.value = '';
    grocery.items = grocery.items.filter(i => !i.done).concat([item], grocery.items.filter(i => i.done));
    renderGrocery();
    saveGrocery({ upserts: [item] });
  });

  grocery.statusEl = document.createElement('div');
  grocery.statusEl.className = 'grocery-status';
  grocery.listEl = document.createElement('div');
  grocery.listEl.className = 'grocery-list';

  const emailForm = document.createElement('form');
  emailForm.className = 'grocery-form';
  emailForm.style.marginTop = '42px';
  emailForm.innerHTML = `
    <datalist id="recent-emails"></datalist>
    <input type="email" id="grocery-email" class="grocery-input" placeholder="Email list to..." list="recent-emails" required autocomplete="email">
    <button type="submit" class="grocery-add-btn">Send <span style="margin-left:4px">📧</span></button>
  `;

  function updateRecentEmails() {
    const recent = JSON.parse(localStorage.getItem('hub-grocery-emails') || '[]');
    emailForm.querySelector('#recent-emails').innerHTML = recent.map(e => `<option value="${esc(e)}">`).join('');
  }
  updateRecentEmails();

  emailForm.addEventListener('submit', async e => {
    e.preventDefault();
    const emailInput = document.getElementById('grocery-email');
    const sendBtn = emailForm.querySelector('.grocery-add-btn');
    const email = emailInput.value.trim();
    // The email script takes { text, qty } items (app/extras/grocery-email.gs).
    const items = grocery.items.filter(i => !i.done).map(i => ({ text: i.name, qty: i.quantity || 1 }));
    if (!items.length) { alert("The grocery list is empty!"); return; }
    if (!email) return;
    let recent = JSON.parse(localStorage.getItem('hub-grocery-emails') || '[]');
    recent = [email, ...recent.filter(em => em !== email)].slice(0, 3);
    localStorage.setItem('hub-grocery-emails', JSON.stringify(recent));
    updateRecentEmails();

    const originalText = sendBtn.innerHTML;
    sendBtn.innerHTML = 'Sending... <span style="margin-left:4px">⏳</span>';
    sendBtn.disabled = true;
    try {
      const scriptUrl = HUB_CONFIG.groceryEmailUrl;
      if (!scriptUrl) throw new Error(GROCERY_NOT_SET_UP);
      await fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ email, items, subject: `${HUB_CONFIG.title} - Grocery List` })
      });
      sendBtn.innerHTML = 'Sent! <span style="margin-left:4px">✓</span>';
      setTimeout(() => { sendBtn.innerHTML = originalText; sendBtn.disabled = false; emailInput.value = ''; }, 2000);
    } catch (err) {
      console.error("Email send error:", err);
      alert(err.message === GROCERY_NOT_SET_UP ? err.message : "Could not send email via Google Apps Script.");
      sendBtn.innerHTML = originalText;
      sendBtn.disabled = false;
    }
  });

  wrap.appendChild(form);
  wrap.appendChild(grocery.statusEl);
  wrap.appendChild(grocery.listEl);
  wrap.appendChild(emailForm);
  container.appendChild(wrap);

  loadGrocery();
  setInterval(() => { if (!container.classList.contains('mod-hidden')) loadGrocery(); }, 60_000);
}

// ── Week Calendar module ───────────────────────────────────────────
function minuteToY(totalMinutes) {
  return (totalMinutes - HOURS_START * 60) * PX_PER_MIN;
}

function timeToMinutes(isoStr) {
  const d = new Date(isoStr);
  if (isNaN(d)) return HOURS_START * 60;
  const { hour, minute } = centralParts(d);
  return hour * 60 + minute;
}

function fmtTime(isoStr) {
  const d = new Date(isoStr);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function getThreeDays(offset) {
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() + offset);
  return Array.from({ length: 3 }, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return d;
  });
}

// Greedy column-assignment for overlapping events within a day column
function assignColumns(events) {
  if (!events.length) return [];
  const items = events
    .map((e, i) => ({
      i,
      startM: timeToMinutes(e.startAt),
      endM: Math.max(timeToMinutes(e.endAt), timeToMinutes(e.startAt) + 30),
    }))
    .sort((a, b) => a.startM - b.startM);

  const colTails = []; // end-minute of the last event in each column
  const colOf = new Array(events.length);

  items.forEach(({ i, startM, endM }) => {
    let c = colTails.findIndex(tail => tail <= startM);
    if (c === -1) c = colTails.length;
    colTails[c] = endM;
    colOf[i] = c;
  });

  const nCols = Math.max(1, colTails.length);
  return colOf.map(c => ({ colIdx: c, totalCols: nCols }));
}

function buildThreeDayCalendar(container) {
  dayContainer = container;

  const nav = document.createElement('div');
  nav.className = 'wk-nav';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'wk-nav-btn'; prevBtn.id = 'wk-prev'; prevBtn.textContent = '‹ Prev';
  prevBtn.addEventListener('click', () => setDayOffset(dayOffset - 1));
  const titleEl = document.createElement('span');
  titleEl.className = 'wk-nav-title'; titleEl.id = 'wk-nav-title';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'wk-nav-btn'; nextBtn.id = 'wk-next'; nextBtn.textContent = 'Next ›';
  nextBtn.addEventListener('click', () => setDayOffset(dayOffset + 1));
  nav.appendChild(prevBtn); nav.appendChild(titleEl); nav.appendChild(nextBtn);
  container.appendChild(nav);

  dayGridArea = document.createElement('div');
  dayGridArea.id = 'wk-grid-area';
  container.appendChild(dayGridArea);

  renderThreeDayCalendar();
}

function resetDayView() {
  dayOffset = 0;
  renderThreeDayCalendar();
}

function setDayOffset(n) {
  dayOffset = Math.max(0, Math.min(87, n));
  renderThreeDayCalendar();
}

function buildTodayView(container) {
  todayContainer = container;
  renderTodayView();
}

function renderTodayView() {
  if (!todayContainer) return;
  todayContainer.innerHTML = '';

  for (let d = 0; d < 3; d++) {
    const dStr = addDaysStr(today, d);
    const date = new Date(dStr + "T12:00:00");
    const isToday    = d === 0;
    const isTomorrow = d === 1;

    const section = document.createElement('div');
    section.className = 'ag-day-section';

    const header = document.createElement('div');
    header.className = 'ag-day-header' + (isToday ? ' is-today' : '');
    header.innerHTML =
      `<span class="ag-day-dow">${date.toLocaleDateString('en-US', { weekday: 'long' })}</span>` +
      `<span class="ag-day-date">${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}</span>` +
      (isToday    ? '<span class="ag-day-label">Today</span>'    :
       isTomorrow ? '<span class="ag-day-label">Tomorrow</span>' : '');
    section.appendChild(header);

    const allDayEvents = (calData.events || []).filter(e =>
      e.allDay && e.startAt.slice(0, 10) === dStr
    );
    if (allDayEvents.length) {
      const row = document.createElement('div');
      row.className = 'ag-allday-row';
      allDayEvents.forEach(e => {
        const memberIds = e.memberIds || [e.memberId];
        const dimmed = activeFilter && !memberIds.includes(activeFilter);
        const chip = document.createElement('div');
        chip.className = 'ag-allday-chip' + (dimmed ? ' dimmed' : '') + (e.declined ? ' is-declined' : '');
        chip.dataset.memberId = e.memberId;
        chip.dataset.memberIds = memberIds.join(',');
        chip.style.background = memberIds.length > 1
          ? `linear-gradient(to right, ${memberIds.map((id, i) => {
              const p  = (i / memberIds.length * 100).toFixed(1);
              const p2 = ((i + 1) / memberIds.length * 100).toFixed(1);
              return `${MEMBER_COLORS[id] || '#888'} ${p}% ${p2}%`;
            }).join(', ')})`
          : (MEMBER_COLORS[e.memberId] || '#888');
        chip.textContent = e.title;
        chip.addEventListener('click', () => openEventModal(e));
        row.appendChild(chip);
      });
      section.appendChild(row);
    }

    const timedEvents = (calData.events || [])
      .filter(e => {
        if (e.allDay) return false;
        const s = new Date(e.startAt);
        return !isNaN(s) && centralDateStr(s) === dStr;
      })
      .sort((a, b) => new Date(a.startAt) - new Date(b.startAt));

    if (timedEvents.length === 0 && allDayEvents.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'ag-empty';
      empty.textContent = 'Nothing scheduled';
      section.appendChild(empty);
    }

    const nowMs = Date.now();
    timedEvents.forEach(e => {
      const memberIds = e.memberIds || [e.memberId];
      const dimmed = activeFilter && !memberIds.includes(activeFilter);
      const isPast = isToday && new Date(e.endAt).getTime() < nowMs;
      const ev = document.createElement('div');
      ev.className = 'ag-event' + (isPast ? ' is-past' : '') + (dimmed ? ' dimmed' : '') + (e.declined ? ' is-declined' : '');
      ev.dataset.memberId = e.memberId;
      ev.dataset.memberIds = memberIds.join(',');

      // Build multi-color bar
      const bar = document.createElement('div');
      bar.className = 'ag-color-bar';
      memberIds.forEach(id => {
        const slice = document.createElement('div');
        slice.style.background = MEMBER_COLORS[id] || '#888';
        bar.appendChild(slice);
      });
      ev.appendChild(bar);

      const memberNames = memberIds.map(id => MEMBER_NAMES[id] || id).join(', ');
      const meta = [memberNames, e.location].filter(Boolean).join(' · ');
      const body = document.createElement('div');
      body.className = 'ag-event-body';
      body.innerHTML =
        `<div class="ag-event-title">${e.title}</div>` +
        (meta ? `<div class="ag-event-meta">${meta}</div>` : '');

      const time = document.createElement('div');
      time.className = 'ag-time';
      time.textContent = fmtTime(e.startAt);

      ev.appendChild(time);
      ev.appendChild(body);
      ev.addEventListener('click', () => openEventModal(e));
      section.appendChild(ev);
    });

    todayContainer.appendChild(section);
  }
}

function renderThreeDayCalendar() {
  const gridArea = dayGridArea;
  if (!gridArea) return;
  gridArea.innerHTML = '';

  const days = getThreeDays(dayOffset);
  const weekStartMs = days[0].getTime();
  const weekEndDate = new Date(days[2]); weekEndDate.setHours(23, 59, 59, 999);
  const weekEndMs   = weekEndDate.getTime();

  // Update nav
  const navTitle = document.getElementById('wk-nav-title');
  if (navTitle) navTitle.textContent =
    `${days[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ` +
    `${days[2].toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
  const prevBtn = document.getElementById('wk-prev');
  const nextBtn = document.getElementById('wk-next');
  if (prevBtn) prevBtn.disabled = dayOffset <= 0;
  if (nextBtn) nextBtn.disabled = dayOffset >= 87;

  // Filter events to this week
  const weekEvents = (calData.events || []).filter(e => {
    const s = new Date(e.startAt).getTime();
    const en = new Date(e.endAt).getTime();
    return s < weekEndMs && en > weekStartMs;
  });

  // Build grid
  const outer = document.createElement('div');
  outer.className = 'wk-outer';
  const inner = document.createElement('div');
  inner.className = 'wk-inner';

  // ── Header row ──
  const corner = document.createElement('div');
  corner.className = 'wk-corner';
  inner.appendChild(corner);
  days.forEach(d => {
    const dStr = centralDateStr(d);
    const el = document.createElement('div');
    el.className = 'wk-day-head' + (dStr === today ? ' is-today' : '');
    el.innerHTML =
      `<div class="wk-day-dow">${d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase()}</div>` +
      `<div class="wk-day-num">${d.getDate()}</div>`;
    inner.appendChild(el);
  });

  // ── All-day row ──
  const allDayGutter = document.createElement('div');
  allDayGutter.className = 'wk-allday-gutter';
  allDayGutter.textContent = 'ALL DAY';
  inner.appendChild(allDayGutter);
  days.forEach(d => {
    const dStr = centralDateStr(d);
    const col = document.createElement('div');
    col.className = 'wk-allday-col';
    weekEvents
      .filter(e => e.allDay && e.startAt.slice(0, 10) === dStr)
      .forEach(e => {
        const memberIds = e.memberIds || [e.memberId];
        const dimmed = activeFilter && !memberIds.includes(activeFilter);
        const ev = document.createElement('div');
        ev.className = 'wk-allday-event' + (dimmed ? ' dimmed' : '') + (e.declined ? ' is-declined' : '');
        ev.dataset.memberId = e.memberId;
        ev.dataset.memberIds = memberIds.join(',');
        ev.style.background = memberIds.length > 1
          ? `linear-gradient(to right, ${memberIds.map((id, i) => {
              const p = (i / memberIds.length * 100).toFixed(1);
              const p2 = ((i + 1) / memberIds.length * 100).toFixed(1);
              return `${MEMBER_COLORS[id] || '#888'} ${p}% ${p2}%`;
            }).join(', ')})`
          : (MEMBER_COLORS[e.memberId] || '#888');
        ev.textContent = e.title;
        ev.title = e.title + (e.location ? '\n' + e.location : '');
        ev.addEventListener('click', () => openEventModal(e));
        col.appendChild(ev);
      });
    inner.appendChild(col);
  });

  // ── Time gutter ──
  const timeGutter = document.createElement('div');
  timeGutter.className = 'wk-time-gutter';
  for (let h = HOURS_START; h < HOURS_END; h++) {
    const lbl = document.createElement('div');
    lbl.className = 'wk-hour-label';
    lbl.textContent = h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`;
    timeGutter.appendChild(lbl);
  }
  inner.appendChild(timeGutter);

  // ── Day columns ──
  days.forEach(d => {
    const dStr = centralDateStr(d);
    const isToday = dStr === today;
    const col = document.createElement('div');
    col.className = 'wk-day-col' + (isToday ? ' is-today' : '');

    // Hour grid lines
    for (let h = HOURS_START; h < HOURS_END; h++) {
      const line = document.createElement('div');
      line.className = 'wk-hour-line';
      line.style.top = `${(h - HOURS_START) * 60}px`;
      col.appendChild(line);
    }

    // Timed events for this day
    const dayEvents = weekEvents.filter(e => {
      if (e.allDay) return false;
      const s = new Date(e.startAt);
      return !isNaN(s) && centralDateStr(s) === dStr;
    });

    const cols = assignColumns(dayEvents);

    dayEvents.forEach((e, i) => {
      const startM = timeToMinutes(e.startAt);
      const endM   = Math.max(timeToMinutes(e.endAt), startM + 30);
      const top    = Math.max(0, minuteToY(startM));
      const bottom = Math.min(minuteToY(HOURS_END * 60), minuteToY(endM));
      const height = Math.max(18, bottom - top);

      const { colIdx, totalCols } = cols[i];
      const leftPct  = (colIdx / totalCols) * 100;
      const widthPct = (1 / totalCols) * 100;

      const memberIds = e.memberIds || [e.memberId];
      const dimmed = activeFilter && !memberIds.includes(activeFilter);
      const ev = document.createElement('div');
