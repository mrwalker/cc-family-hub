      ev.className = 'wk-event' + (dimmed ? ' dimmed' : '') + (e.declined ? ' is-declined' : '');
      ev.dataset.memberId = e.memberId;
      ev.dataset.memberIds = memberIds.join(',');
      ev.style.cssText =
        `top:${top}px;height:${height}px;` +
        `left:calc(${leftPct}% + 2px);width:calc(${widthPct}% - 4px);` +
        `background:${MEMBER_COLORS[e.memberId] || '#888'};`;
      let inner = `<div class="wk-event-title">${e.title}</div>`;
      if (height > 32) inner += `<div class="wk-event-time">${fmtTime(e.startAt)}</div>`;
      if (memberIds.length > 1) {
        inner += `<div class="wk-event-dots">${
          memberIds.map(id => `<div class="wk-event-dot" style="background:${MEMBER_COLORS[id]||'#888'}"></div>`).join('')
        }</div>`;
      }
      ev.innerHTML = inner;
      ev.title = `${e.title}\n${fmtTime(e.startAt)}` + (e.location ? '\n' + e.location : '');
      ev.addEventListener('click', evt => { evt.stopPropagation(); openEventModal(e); });
      col.appendChild(ev);
    });

    // Current-time indicator for today
    if (isToday) {
      const { hour: nowH, minute: nowMin } = centralParts(new Date());
      const nowM = nowH * 60 + nowMin;
      if (nowM >= HOURS_START * 60 && nowM < HOURS_END * 60) {
        const nowLine = document.createElement('div');
        nowLine.className = 'wk-now-line';
        nowLine.style.top = `${minuteToY(nowM)}px`;
        nowLine.innerHTML = '<div class="wk-now-dot"></div>';
        col.appendChild(nowLine);
      }
    }

    inner.appendChild(col);
  });

  outer.appendChild(inner);
  gridArea.appendChild(outer);

  // Auto-scroll to ~1 hour before current time (or 8am)
  requestAnimationFrame(() => {
    const { hour: nowH } = centralParts(new Date());
    const scrollToM = Math.max(HOURS_START * 60, nowH * 60 - 60);
    outer.scrollTop = minuteToY(scrollToM);
  });
}

function openEventModal(e) {
  document.getElementById('modal-date').textContent = e.title;
  const memberIds = e.memberIds || [e.memberId];
  let html = '';
  if (!e.allDay) {
    html += `<div><div class="modal-section-label">Time</div>` +
      `<div class="modal-notes">${fmtTime(e.startAt)} – ${fmtTime(e.endAt)}</div></div>`;
  }
  if (e.location) {
    html += `<div><div class="modal-section-label">Location</div>` +
      `<div class="modal-notes" style="font-size:13px">${e.location}</div></div>`;
  }
  const whoRows = memberIds.map(id =>
    `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">${mdot(id, 20)}` +
    `<span style="font-size:13px">${MEMBER_NAMES[id] || id}</span></div>`
  ).join('');
  html += `<div><div class="modal-section-label">Who</div>${whoRows}</div>`;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('day-modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

// ── Day detail modal ───────────────────────────────────────────────
function openModal(day) {
  document.getElementById("modal-date").textContent = fmtFull(day.date);
  const dayFlags = flagsByDate[day.date] || [], dayActions = actionsByDate[day.date] || [];
  let html = "";
  if (day.notes)     html += `<div><div class="modal-section-label">Notes</div><div class="modal-notes">${day.notes}</div></div>`;
  if (day.logistics) html += `<div><div class="modal-section-label">🚗 Logistics</div><div class="modal-logistics">${day.logistics}</div></div>`;
  if (dayFlags.length) html += `<div><div class="modal-section-label">Flags</div><div style="display:flex;flex-direction:column;gap:6px">
    ${dayFlags.map(f=>`<div class="modal-flag ${f.severity}"><span>${FLAG_ICONS[f.severity]}</span><span>${f.message}</span></div>`).join("")}</div></div>`;
  if (dayActions.length) html += `<div><div class="modal-section-label">Action Items Due</div><div>
    ${dayActions.map(a=>`<div class="modal-action">${a.assignedTo?mdot(a.assignedTo,20):`<span class="mdot" style="width:20px;height:20px;background:#aaa"></span>`}<span style="flex:1">${a.description}</span><span class="badge ${a.priority}">${a.priority}</span></div>`).join("")}</div></div>`;
  if (!html) html = `<p style="color:var(--muted);font-size:13px">No details for this day.</p>`;
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("day-modal").classList.remove("hidden");
  document.body.style.overflow = "hidden"; // lock background scroll
}
function closeModal() {
  document.getElementById("day-modal").classList.add("hidden");
  document.body.style.overflow = ""; // restore scroll
}
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("day-modal").addEventListener("click", e => { if (e.target===document.getElementById("day-modal")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key==="Escape") closeModal(); });

// ── Theme ──────────────────────────────────────────────────────────
function initTheme() {
  const btn = document.getElementById("theme-toggle");
  function apply(dark) {
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    btn.textContent = dark ? "Light" : "Dark";
  }
  const saved = localStorage.getItem("hub-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  apply(saved ? saved === "dark" : prefersDark);
  btn.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme !== "dark";
    apply(dark); localStorage.setItem("hub-theme", dark ? "dark" : "light");
  });
}
</script>
