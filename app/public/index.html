<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Hub</title>
  <!-- Sets window.HUB_CONFIG (members, colors, trip apps) from workspace/family.yaml (worker.js) -->
  <script src="/api/config.js"></script>
  <!-- Sets window.PLAN_DATA / FAMILY_DATA / STRAVA_DATA from published data (worker data-api.js) -->
  <script src="/api/data.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f0f5;
      --card: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --urgent: #dc2626;
      --urgent-light: #fef2f2;
      --warn: #d97706;
      --warn-light: #fffbeb;
      --info: #0891b2;
      --info-light: #ecfeff;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    }

    [data-theme="dark"] {
      --bg: #0f0f12;
      --card: #1c1c22;
      --border: #2e2e38;
      --text: #f0f0f5;
      --muted: #8888a0;
      --accent: #3b82f6;
      --accent-light: #1e2a45;
      --urgent-light: #2d1515;
      --warn-light: #2a1f0a;
      --info-light: #0a2030;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    }
    [data-theme="dark"] .summary-card       { background: #1d3461; }
    [data-theme="dark"] .cal-cell.is-today  { background: #1e2a45; }
    [data-theme="dark"] .cal-cell-notes     { color: #bbb; }
    [data-theme="dark"] .plan-day-notes     { color: #ccc; }
    [data-theme="dark"] .modal-notes        { color: #ccc; }
    [data-theme="dark"] .modal-logistics    { color: #aaa; background: #16161e; }
    [data-theme="dark"] .plan-day-logistics { background: #16161e; color: #999; }

    /* ── Base ─────────────────────────────────────────────────────── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.5;
      padding: 20px 40px 64px;
    }
    .container { max-width: 1440px; margin: 0 auto; }

    /* ── Header ──────────────────────────────────────────────────── */
    .hub-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
    }
    .hub-header h1 { font-size: 24px; font-weight: 700; }
    .hub-header-right { display: flex; align-items: center; gap: 12px; }
    .hub-meta { font-size: 12px; color: var(--muted); }
    .theme-toggle {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 5px 12px;
      font-size: 12px; font-weight: 500; color: var(--muted);
      cursor: pointer; transition: border-color .15s, color .15s;
    }
    .theme-toggle:hover { border-color: #aaa; color: var(--text); }

    /* ── Summary card ────────────────────────────────────────────── */
    .clock-card {
      background: var(--accent); color: white;
      border-radius: var(--radius); padding: 12px 20px 10px;
      margin-bottom: 16px; display: flex; align-items: center;
      justify-content: space-between; gap: 16px;
    }
    .clock-left { display: flex; align-items: baseline; gap: 6px; }
    .clock-time {
      font-size: 72px; font-weight: 800; line-height: 1;
      letter-spacing: -2px; font-variant-numeric: tabular-nums;
    }
    .clock-secs {
      font-size: 28px; font-weight: 600; opacity: .55;
      font-variant-numeric: tabular-nums; align-self: flex-end;
      padding-bottom: 8px;
    }
    /* ── Cistercian glyphs ──────────────────────────────────────── */
    .cistercian-wrap {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .cistercian-glyph-block {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .cistercian-glyph-block svg {
      display: block; filter: drop-shadow(0 0 4px rgba(255,255,255,.35));
    }
    .cistercian-lbl {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; opacity: .55;
    }
    .cistercian-colon {
      font-size: 36px; font-weight: 800; opacity: .5;
      padding-bottom: 18px; line-height: 1;
    }
    /* ── Meta + summary toggle ──────────────────────────────────── */
    .clock-right { text-align: right; flex-shrink: 0; }
    .clock-ampm {
      font-size: 18px; font-weight: 700; letter-spacing: .04em;
      opacity: .85; line-height: 1;
    }
    .clock-date {
      font-size: 13px; font-weight: 500; opacity: .75;
      margin-top: 4px; white-space: nowrap;
    }
    .summary-toggle {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; opacity: .6; cursor: pointer;
      margin-top: 6px; display: flex; align-items: center; gap: 4px;
      background: none; border: none; color: white; padding: 0;
    }
    .summary-toggle:hover { opacity: .9; }
    .summary-drawer {
      overflow: hidden; max-height: 0;
      transition: max-height .35s ease, padding .35s ease;
      font-size: 13px; line-height: 1.6; opacity: .9;
    }
    .summary-drawer.open { max-height: 300px; padding-top: 10px; }

    /* ── Tab bar ─────────────────────────────────────────────────── */
    .tab-bar {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 16px;
    }
    .tab-row {
      display: flex; align-items: center; gap: 6px;
      overflow-x: auto; flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .tab-row::-webkit-scrollbar { display: none; }
    .tab {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: 13px; font-weight: 500; color: var(--muted);
      cursor: pointer; user-select: none; flex-shrink: 0;
      transition: background .2s, border-color .2s, color .2s;
    }
    .tab:hover { border-color: #aaa; color: var(--text); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: white; }
    /* Progress line fills across the bottom of the active tab */
    .tab::after {
      content: ""; position: absolute; bottom: 0; left: 0;
      height: 2px; background: rgba(255,255,255,.55);
      width: 0%;
    }
    .tab.active::after { animation: tab-progress var(--rotate-ms, 60000ms) linear forwards; }
    .tab.active.is-paused::after { animation-play-state: paused; }
    @keyframes tab-progress { to { width: 100%; } }
    /* Dot on the active tab label */
    .tab-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,.6); flex-shrink: 0;
      display: none;
    }
    .tab.active .tab-dot { display: block; }

    .tab-spacer { flex: 1; }

    .tab-row .tab { margin-right: 6px; }
    .view-toggle {
      float: right; margin: 0 0 8px 12px;
      background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 5px 14px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer;
    }
    .view-toggle:hover { color: var(--text); border-color: #aaa; }
    .muted-note { color: var(--muted); font-size: 14px; padding: 20px 0; }

    /* ── Trip cards ──────────────────────────────────────────────── */
    .tc {
      border-radius: var(--radius); overflow: hidden; cursor: pointer;
      background-color: var(--accent); background-image: linear-gradient(135deg, var(--accent), #7c3aed);
      background-size: cover; background-position: center;
      color: #fff; box-shadow: var(--shadow);
    }
    .tc-body {
      min-height: 220px; padding: 18px 20px;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .tc-photo .tc-body { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.2) 40%, rgba(0,0,0,.78) 100%); }
    .tc-spot .tc-body { min-height: 440px; padding: 28px 32px; }
    .tc-badge {
      align-self: flex-start; margin-bottom: auto;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      background: rgba(0,0,0,.3); border-radius: 12px; padding: 4px 10px;
    }
    .tc-count { font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -1px; margin-top: 12px; }
    .tc-spot .tc-count { font-size: 88px; letter-spacing: -2px; }
    .tc-name { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .tc-spot .tc-name { font-size: 32px; }
    .tc-sub { font-size: 13px; opacity: .88; margin-top: 2px; }
    .tc-spot .tc-sub { font-size: 16px; }
    .tc-who { margin-top: 10px; display: flex; flex-wrap: wrap; }
    .tc-who .mdot, .tc-row .mdot { margin-right: 6px; vertical-align: middle; }
    .tc-label {
      margin-top: 16px; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; opacity: .75;
    }
    .tc-board { margin-top: 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); grid-gap: 4px 18px; }
    .tc-row { display: flex; align-items: center; font-size: 15px; }
    .tc-row .pts { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tc-today { margin-top: 4px; font-size: 15px; line-height: 1.55; }
    .tc-chips { margin-top: 10px; }
    .tc-chip {
      display: inline-block; margin: 0 6px 6px 0; padding: 3px 10px; border-radius: 12px;
      background: rgba(0,0,0,.28); font-size: 13px;
    }
    .tc-app {
      align-self: flex-start; margin-top: 16px; padding: 7px 16px; border-radius: 18px;
      background: rgba(255,255,255,.2); color: #fff; font-weight: 600; text-decoration: none;
    }
    .tc-desc { margin: 16px 0 4px; font-size: 15px; line-height: 1.6; color: var(--text); }
    .trips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); grid-gap: 14px; margin-top: 10px; }

    /* ── Grocery (shared list) ───────────────────────────────────── */
    .grocery-check {
      width: 30px; height: 30px; border-radius: 50%; margin-right: 10px; flex-shrink: 0;
      border: 2px solid var(--border); background: var(--card); color: #fff;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .grocery-done .grocery-check { background: #16a34a; border-color: #16a34a; }
    .grocery-done .desc { text-decoration: line-through; opacity: .5; }
    .grocery-item .desc { font-size: 16px; flex: 1; }
    .grocery-item .mdot { margin: 0 8px; }
    .grocery-meta { font-size: 12px; color: var(--muted); margin-left: 6px; }
    .grocery-status { color: var(--warn); font-size: 13px; min-height: 18px; margin: 4px 0; }
    .grocery-clear {
      margin-top: 10px; background: none; border: 1.5px solid var(--border); border-radius: 16px;
      padding: 6px 14px; color: var(--muted); font-size: 13px; cursor: pointer;
    }

    /* ── Member filter pills ─────────────────────────────────────── */
    .members-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      align-items: center; margin-bottom: 20px;
    }
    .member-chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--card); border: 2px solid var(--border);
      border-radius: 20px; padding: 5px 14px 5px 8px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; user-select: none;
      transition: background .15s, border-color .15s, color .15s;
    }
    .member-chip:hover { border-color: #aaa; }
    .member-chip.active { color: white; border-color: transparent; }
    .member-chip .av {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .member-chip.active .av { background: rgba(255,255,255,.25) !important; }
    .clear-filter {
      font-size: 12px; color: var(--muted); cursor: pointer;
      padding: 5px 12px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      display: none;
    }
    .clear-filter:hover { background: var(--bg); }
    .members-row.has-filter .clear-filter { display: inline-block; }

    /* ── Module system ───────────────────────────────────────────── */
    .module-wrap { position: relative; }
    .module {
      transition: opacity .35s ease;
    }
    .module.mod-hidden {
      display: none;
      opacity: 0;
    }

    /* ── Glance view: any card the page has no view of its own for ─── */
    /* No CSS inset or flex gap: the wall tablet's WebView is old. */
    .glance-list { max-width: 760px; }
    .glance-card {
      display: block; position: relative; margin-bottom: 12px; padding: 18px 20px 18px 78px; min-height: 76px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); color: var(--text); text-decoration: none;
    }
    .glance-emoji { position: absolute; left: 20px; top: 16px; font-size: 34px; line-height: 1.2; }
    .glance-headline { font-size: 22px; font-weight: 700; line-height: 1.25; }
    .glance-detail { font-size: 15px; color: var(--muted); margin-top: 3px; }
    .glance-card.is-overdue { border-color: var(--urgent); background: var(--urgent-light); }
    .hub-link {
      display: none; margin-right: 12px; font-size: 13px; color: var(--muted);
      text-decoration: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px;
    }
    .hub-link.shown { display: inline-block; }

    /* ── Chores: a column per kid, each chore a big tile to tap ──────── */
    /* For the wall tablet's old WebView: grid with grid-gap, no flex gap, no inset. */
    .cb-head { position: relative; margin: 6px 0 12px; min-height: 30px; }
    .cb-head .cb-day { font-size: 22px; font-weight: 800; }
    .cb-head .cb-link { position: absolute; right: 0; top: 4px; font-size: 14px; color: var(--accent); text-decoration: none; }
    .cb-jobs { font-size: 15px; color: var(--muted); margin-top: 2px; }
    .cb-note { font-size: 14px; color: var(--warn); margin: 0 0 10px; }
    .cb-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-gap: 12px; align-items: start; }
    .cb-grid.n1 { grid-template-columns: minmax(0, 1fr); }
    .cb-grid.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cb-grid.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cb-col { background: var(--card); border-radius: var(--radius); border-top: 6px solid var(--border); padding: 10px 10px 4px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .cb-name { font-size: 22px; font-weight: 800; }
    .cb-name .cb-jobname { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }
    .cb-count { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .cb-tile { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); cursor: pointer;
      background: var(--accent-light); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 12px 10px 48px;
      margin-bottom: 8px; min-height: 64px; position: relative; }
    .cb-tile .cb-box { position: absolute; left: 12px; top: 14px; width: 26px; height: 26px; border-radius: 7px;
      border: 2px solid var(--accent); background: var(--card); text-align: center; line-height: 22px; font-weight: 800; color: #fff; }
    .cb-tile .cb-title { font-size: 17px; font-weight: 700; line-height: 1.25; display: block; }
    .cb-tile .cb-when { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
    .cb-tile.is-late { border-color: var(--urgent); background: var(--urgent-light); }
    .cb-tile.is-late .cb-box { border-color: var(--urgent); }
    .cb-tile.is-late .cb-when { color: var(--urgent); font-weight: 700; }
    .cb-tile.is-done { border-color: var(--border); background: var(--card); }
    .cb-tile.is-done .cb-box { background: #16a34a; border-color: #16a34a; }
    .cb-tile.is-done .cb-title { color: var(--muted); text-decoration: line-through; }
    .cb-tile.is-done .cb-when { color: #15803d; }
    .cb-tile.is-missed, .cb-tile.is-tomorrow { border-color: var(--border); background: transparent; cursor: default; }
    .cb-tile.is-missed .cb-when { color: var(--urgent); }
    .cb-tile.as-needed { border-style: dashed; background: var(--card); }
    .cb-tile.as-needed .cb-box { border-style: dashed; color: var(--accent); }
    .cb-empty { font-size: 14px; color: var(--muted); padding: 8px 0 12px; }
    @media (orientation: portrait), (max-width: 700px) {
      .cb-grid, .cb-grid.n3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cb-grid.n1 { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 480px) { .cb-grid, .cb-grid.n2, .cb-grid.n3 { grid-template-columns: minmax(0, 1fr); } }

    /* ── Pet portraits: each pet full screen over its photo ─────────── */
    /* No CSS inset or flex gap: the wall tablet's WebView is old. */
    .portrait {
      position: relative; height: calc(100vh - 230px); min-height: 360px;
      background: #1c1917; border-radius: 14px; overflow: hidden; margin-top: 8px;
    }
    .portrait-blur, .portrait-photo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    /* The photo blurred to fill the screen, and the whole photo sharp on top of it. */
    .portrait-blur { object-fit: cover; filter: blur(28px) brightness(.55); transform: scale(1.15); }
    .portrait-photo { object-fit: contain; }
    .portrait.no-photo { background: linear-gradient(135deg, #44403c, #1c1917); }
    .portrait.no-photo img { display: none; }
    .portrait-shade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 60%;
      background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
    }
    .portrait-text { position: absolute; left: 36px; right: 36px; bottom: 30px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
    .portrait-name { font-size: 72px; font-weight: 800; line-height: 1.02; letter-spacing: -.01em; }
    .portrait-age { font-size: 22px; opacity: .85; margin-top: 4px; }
    .portrait-next { margin-top: 14px; }
    .portrait-item { font-size: 24px; line-height: 1.35; margin-top: 4px; }
    .portrait-item .when { opacity: .8; }
    .portrait-item.overdue .when { color: #fca5a5; opacity: 1; font-weight: 700; }
    @media (max-width: 700px) {
      .portrait-name { font-size: 44px; }
      .portrait-item { font-size: 18px; }
      .portrait-text { left: 20px; right: 20px; bottom: 20px; }
    }

    /* ── Photos module (the family album's photo cards from the stream) ─ */
    /* No CSS inset or flex gap: the wall tablet's WebView is old. */
    .photo-frame {
      position: relative; height: calc(100vh - 230px); min-height: 360px;
      background: #000; border-radius: 14px; overflow: hidden; margin-top: 8px;
    }
    .photo-frame img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; opacity: 0; transition: opacity 1.2s ease;
    }
    .photo-frame img.shown { opacity: 1; }
    .photo-empty { color: var(--muted); font-size: 14px; padding: 20px 0; }

    /* ── Shared: member highlight/dim ────────────────────────────── */
    .member-lit {
      border-color: var(--lit-color) !important;
      box-shadow: 0 0 0 2px var(--lit-color), var(--shadow) !important;
    }
    .member-dim { opacity: 0.2; }

    /* ── Shared: section titles + collapsibles ───────────────────── */
    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); margin: 24px 0 10px;
    }
    .collapsible-header {
      display: flex; align-items: center; gap: 8px;
      margin-top: 20px; padding: 10px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); cursor: pointer; user-select: none;
      box-shadow: var(--shadow);
    }
    .collapsible-header:hover { background: var(--bg); }
    .ch-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); flex: 1;
    }
    .ch-count {
      font-size: 11px; font-weight: 600;
      background: var(--bg); color: var(--muted);
      border-radius: 10px; padding: 1px 8px;
    }
    .ch-toggle { font-size: 11px; color: var(--muted); }
    .collapsible-body.collapsed { display: none; }
    .collapsible-body .inner { padding-top: 10px; }

    /* ── Calendar grid ───────────────────────────────────────────── */
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    }
    .cal-dow {
      text-align: center;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); padding-bottom: 4px;
    }
    .cal-row-gap { grid-column: 1 / -1; height: 6px; }
    .cal-cell {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px;
      min-height: 140px; cursor: pointer;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s;
    }
    .cal-cell:hover { border-color: #a0a0a8; box-shadow: 0 3px 10px rgba(0,0,0,.12); }
    .cal-cell.is-today {
      border-color: var(--accent); background: var(--accent-light);
      box-shadow: 0 0 0 1px var(--accent), var(--shadow);
    }
    .cal-cell.is-past { opacity: 0.5; }
    .cal-cell-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 6px;
    }
    .cal-cell-month { font-size: 10px; font-weight: 600; color: var(--muted); line-height: 1; }
    .cal-cell-num   { font-size: 22px; font-weight: 700; line-height: 1.1; }
    .cal-cell.is-today .cal-cell-num { color: var(--accent); }
    .today-badge {
      font-size: 9px; font-weight: 700; letter-spacing: .04em;
      color: var(--accent); background: #dbeafe;
      border-radius: 8px; padding: 2px 7px; white-space: nowrap;
    }
    [data-theme="dark"] .today-badge { background: #1e3a6e; }
    .cal-cell-notes {
      font-size: 11px; color: #555; line-height: 1.45; flex: 1;
      overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    }
    .cal-cell-footer {
      display: flex; align-items: center; gap: 4px; margin-top: 8px; flex-wrap: wrap; justify-content: space-between;
    }
    .cal-cell-footer-members { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
    .cal-cell-footer-flags   { display: flex; gap: 3px; align-items: center; }
    .pip { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .pip-urgent  { background: var(--urgent); }
    .pip-warning { background: var(--warn); }
    .pip-info    { background: var(--info); }
    .mdot {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; color: white; flex-shrink: 0;
    }

    /* ── Flags ───────────────────────────────────────────────────── */
    .flags { display: flex; flex-direction: column; gap: 8px; }
    .flag {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px; border-radius: var(--radius);
      font-size: 13px; line-height: 1.5; border: 1px solid transparent;
      transition: opacity .2s;
    }
    .flag.urgent  { background: var(--urgent-light); border-color: #fecaca; }
    .flag.warning { background: var(--warn-light);   border-color: #fde68a; }
    .flag.info    { background: var(--info-light);   border-color: #a5f3fc; }
    .flag-icon { flex-shrink: 0; font-size: 15px; margin-top: 1px; }
    .flag.dimmed, .action-item.dimmed { opacity: 0.15; }

    /* ── Action items ────────────────────────────────────────────── */
    .actions { display: flex; flex-direction: column; gap: 6px; }
    .action-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
      font-size: 13px; transition: opacity .2s;
    }
    .action-item input[type=checkbox] {
      flex-shrink: 0; width: 16px; height: 16px;
      cursor: pointer; accent-color: var(--accent);
    }
    .action-item .desc { flex: 1; }
    .action-item.done .desc { text-decoration: line-through; color: var(--muted); }
    .action-item .due { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 20px;
      font-weight: 600; white-space: nowrap; flex-shrink: 0;
    }
    .badge.high   { background: #fecaca; color: #991b1b; }
    .badge.medium { background: #fde68a; color: #92400e; }
    .badge.low    { background: #d1fae5; color: #065f46; }

    /* ── Plan module ─────────────────────────────────────────────── */
    .plan-weeks {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    }
    .plan-week-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); margin-bottom: 10px;
    }
    .plan-day {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 8px; box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s, opacity .2s;
    }
    .plan-day:last-child { margin-bottom: 0; }
    .plan-day-head {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;
    }
    .plan-day-date {
      font-size: 13px; font-weight: 700; color: var(--accent);
    }
    .plan-day-dow {
      font-size: 11px; color: var(--muted);
    }
    .plan-day.is-today .plan-day-date { color: var(--accent); }
    .plan-day.is-today { border-color: var(--accent); background: var(--accent-light); }
    .plan-day.is-past  { opacity: 0.45; }
    .plan-day-notes {
      font-size: 13px; line-height: 1.65; color: var(--text); margin-bottom: 8px;
    }
    .plan-day-logistics {
      font-size: 12px; color: var(--muted); line-height: 1.5;
      background: var(--bg); border-radius: 8px; padding: 8px 12px;
    }
    .plan-day-logistics::before { content: "🚗  "; }
    .plan-day-pips {
      display: flex; gap: 4px; align-items: center; margin-top: 8px; flex-wrap: wrap; justify-content: space-between;
    }
    .plan-day-pips-members { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
    .plan-day-pips-flags   { display: flex; gap: 3px; align-items: center; }

    /* ── Day detail modal ────────────────────────────────────────── */
    .modal-overlay {
      /* Explicit top/left/right/bottom for Android WebView compat (inset unreliable) */
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 24px; box-sizing: border-box;
      /* Prevent the overlay itself from scrolling the background */
      overflow: hidden;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--card); border-radius: 14px;
      max-width: 580px; width: 100%;
      /* Use dvh if available, fall back to vh — keeps modal within visible area */
      max-height: min(82vh, 82dvh);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      box-shadow: 0 24px 64px rgba(0,0,0,.4);
      /* Ensure the modal itself doesn't get clipped by any ancestor */
      position: relative; z-index: 1;
    }
    .modal-head {
      padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--card);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-date { font-size: 20px; font-weight: 700; }
    .modal-close {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--bg); border: none; cursor: pointer;
      font-size: 14px; color: var(--muted);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--border); }
    .modal-body { padding: 18px 24px 26px; display: flex; flex-direction: column; gap: 16px; }
    .modal-section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); margin-bottom: 6px;
    }
    .modal-notes { font-size: 14px; line-height: 1.65; color: var(--text); }
    .modal-logistics {
      font-size: 13px; line-height: 1.5; color: var(--muted);
      background: var(--bg); border-radius: 8px; padding: 10px 14px;
    }
    .modal-flag {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 13px; line-height: 1.5;
      padding: 8px 12px; border-radius: 8px; border: 1px solid transparent;
    }
    .modal-flag.urgent  { background: var(--urgent-light); border-color: #fecaca; }
    .modal-flag.warning { background: var(--warn-light);   border-color: #fde68a; }
    .modal-flag.info    { background: var(--info-light);   border-color: #a5f3fc; }
    .modal-action {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; padding: 6px 0;
      border-bottom: 1px solid var(--bg);
    }
    .modal-action:last-child { border-bottom: none; }

    /* ── Featured Trip ──────────────────────────────────────────────── */
    .ft-section { margin-bottom: 20px; }
    .ft-banner {
      position: relative; min-height: 210px;
      border-radius: var(--radius) var(--radius) 0 0; overflow: hidden;
      background: linear-gradient(135deg,#0c4a6e 0%,#0e7490 45%,#0f766e 100%);
      padding: 24px 24px 22px; display: flex; flex-direction: column; justify-content: flex-end;
    }
    .ft-banner::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top,rgba(0,0,0,.62) 0%,rgba(0,0,0,.08) 65%);
    }
    .ft-banner > * { position: relative; z-index: 1; }
    .ft-badge {
      position: absolute; top: 16px; right: 16px; z-index: 2;
      font-size: 10px; font-weight: 800; padding: 4px 11px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .6px;
      background: rgba(255,255,255,.18); backdrop-filter: blur(6px); color: #fff;
    }
    .ft-emoji { font-size: 44px; display: block; margin-bottom: 6px; line-height: 1; }
    .ft-name  { font-size: 32px; font-weight: 900; color: #fff; line-height: 1.1; margin-bottom: 2px; }
    .ft-dest  { font-size: 15px; color: rgba(255,255,255,.78); margin-bottom: 8px; }
    .ft-meta  { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ft-dates { font-size: 13px; color: rgba(255,255,255,.72); }
    .ft-desc  { font-size: 13px; color: rgba(255,255,255,.78); line-height: 1.55; margin-top: 10px; max-width: 640px; }
    .has-trip-app { cursor: pointer; transition: transform .12s, box-shadow .12s; }
    .has-trip-app:active { transform: scale(.99); }
    .trip-row.has-trip-app:hover { box-shadow: var(--shadow); border-color: var(--accent); }
    .trip-row-app {
      flex: none; margin-right: 6px; padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700; text-decoration: none;
      background: var(--accent-light); color: var(--accent);
    }
    .ft-app   {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
      padding: 9px 16px; border-radius: 999px; text-decoration: none;
      background: #fff; color: #0b2533; font-size: 14px; font-weight: 800;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }

    .ft-highlights {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 2px;
    }
    .ft-highlight {
      position: relative; padding: 16px 14px 14px; min-height: 115px;
      display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
      cursor: default;
    }
    .ft-highlight::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top,rgba(0,0,0,.58) 0%,rgba(0,0,0,.04) 65%);
    }
    .ft-highlight > * { position: relative; z-index: 1; }
    .ft-h-emoji   { font-size: 26px; display: block; margin-bottom: 5px; line-height: 1; }
    .ft-h-label   { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.2; }
    .ft-h-caption { font-size: 11px; color: rgba(255,255,255,.72); margin-top: 3px; line-height: 1.35; }

    .ft-split {
      display: grid; grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border); border-top: none; min-height: 340px;
    }
    .ft-map { border-right: 1px solid var(--border); }
    .ft-map { min-height: 340px; overflow: hidden; }
    .ft-activities { padding: 14px 16px; overflow-y: auto; max-height: 380px; }
    .ft-act-row {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 7px 0; border-bottom: 1px solid var(--border);
    }
    .ft-act-row:last-child { border-bottom: none; }
    .ft-act-emoji { font-size: 17px; flex-shrink: 0; line-height: 1.3; }
    .ft-act-name  { font-size: 13px; font-weight: 600; color: var(--text); }
    .ft-act-note  { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

    .ft-sub-title {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px; margin: 18px 0 10px;
    }
    .ft-restaurants {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px;
    }
    .ft-restaurant {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 11px 13px;
    }
    .ft-rest-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
    .ft-rest-name  { font-size: 14px; font-weight: 700; color: var(--text); }
    .ft-rest-price { font-size: 12px; font-weight: 800; }
    .ft-rest-type  { font-size: 11px; color: var(--muted); }
    .ft-rest-note  { font-size: 12px; color: var(--muted); line-height: 1.45; }

    .ft-tips { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
    .ft-tip {
      display: flex; gap: 9px; align-items: flex-start;
      font-size: 13px; color: var(--text); line-height: 1.5;
      padding: 8px 13px; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .ft-tip-arrow { color: var(--accent); flex-shrink: 0; font-size: 13px; margin-top: 2px; }

    /* ── Trips ──────────────────────────────────────────────────────── */
    .trip-hero { border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
    .trip-hero-bg {
      min-height: 190px; display: flex; align-items: flex-end; padding: 20px;
      position: relative;
    }
    .trip-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.12) 65%);
    }
    .trip-hero-status {
      position: absolute; top: 14px; right: 14px; z-index: 1;
      background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
      color: #fff; font-size: 11px; font-weight: 700;
      padding: 4px 11px; border-radius: 20px; text-transform: uppercase; letter-spacing: .6px;
    }
    .trip-hero-content { position: relative; z-index: 1; color: #fff; width: 100%; }
    .trip-hero-emoji { font-size: 38px; display: block; margin-bottom: 8px; }
    .trip-hero-name { font-size: 24px; font-weight: 800; line-height: 1.15; margin-bottom: 3px; }
    .trip-hero-dest { font-size: 14px; opacity: .8; margin-bottom: 10px; }
    .trip-ideas {
      background: var(--card); border: 1px solid var(--border);
      border-top: none; border-radius: 0 0 var(--radius) var(--radius);
      padding: 13px 16px;
    }
    .trip-ideas-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .trip-idea { display: flex; gap: 7px; font-size: 13px; color: var(--text); padding: 3px 0; line-height: 1.4; }
    .trip-idea::before { content: "→"; color: var(--accent); flex-shrink: 0; margin-top: 1px; }
    .trip-section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 20px 0 8px 2px; }
    .trip-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 8px;
    }
    .trip-row-emoji { font-size: 22px; flex-shrink: 0; }
    .trip-row-info { flex: 1; min-width: 0; }
    .trip-row-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .trip-row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .status-badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
    .status-badge.planning { background: #fef3c7; color: #92400e; }
    .status-badge.upcoming { background: #dbeafe; color: #1e40af; }
    .status-badge.active   { background: #d1fae5; color: #065f46; }
    .status-badge.past     { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
    [data-theme="dark"] .status-badge.planning { background: #2d1f0a; color: #fbbf24; }
    [data-theme="dark"] .status-badge.upcoming { background: #1e2a45; color: #93c5fd; }
    [data-theme="dark"] .status-badge.active   { background: #0d2a1e; color: #6ee7b7; }

    /* ── Escape Rooms ────────────────────────────────────────────────── */
    .er-stats { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
    .er-stat { flex: 1; padding: 14px 8px; text-align: center; border-right: 1px solid var(--border); }
    .er-stat:last-child { border-right: none; }
    .er-stat-val { font-size: 28px; font-weight: 800; color: var(--text); line-height: 1; }
    .er-stat-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; }
    .er-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 15px; margin-bottom: 8px;
    }
    .er-card-fastest { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b22; }
    [data-theme="dark"] .er-card-fastest { border-color: #b45309; }
    .er-card-head { display: flex; gap: 10px; align-items: flex-start; }
    .er-outcome { font-size: 20px; flex-shrink: 0; line-height: 1.3; }
    .er-room-name { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .er-venue-line { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
    .er-venue { font-size: 12px; color: var(--muted); }
    .er-city  { font-size: 12px; color: var(--muted); }
    .er-url   { font-size: 11px; color: var(--accent); text-decoration: none; font-weight: 600; }
    .er-url:hover { text-decoration: underline; }
    .er-date  { font-size: 11px; color: var(--muted); }
    .er-time-badge {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px;
      white-space: nowrap;
    }
    .er-time-badge.solved  { background: #dcfce7; color: #166534; }
    .er-time-badge.failed  { background: #fee2e2; color: #991b1b; }
    .er-time-badge.er-clutch { background: #fef3c7; color: #92400e; }
    [data-theme="dark"] .er-time-badge.solved   { background: #0d2a1e; color: #6ee7b7; }
    [data-theme="dark"] .er-time-badge.failed   { background: #2d1515; color: #fca5a5; }
    [data-theme="dark"] .er-time-badge.er-clutch { background: #2d1f0a; color: #fbbf24; }
    .er-notes { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 7px; line-height: 1.45; }
    .mv-seen { font-size: 14px; color: var(--muted); margin: 4px 0 2px; }
    .mv-seen span { display: inline-block; margin: 0 14px 4px 0; color: var(--text); font-weight: 600; }
    .mv-hint { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .mv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); grid-gap: 14px; }
    .mv-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .mv-poster { position: relative; height: 240px; background: linear-gradient(160deg, #be185d, #1e1b4b); overflow: hidden; }
    .mv-poster img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .mv-poster .mv-kind { position: absolute; left: 10px; bottom: 8px; font-size: 26px; }
    .mv-poster img + .mv-kind { display: none; }
    .mv-format { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.7); color: #fde68a; font-size: 11px; font-weight: 800;
      letter-spacing: .06em; padding: 3px 7px; border-radius: 6px; text-transform: uppercase; }
    .mv-body { padding: 10px 12px 12px; }
    .mv-body .movie-title a { color: inherit; text-decoration: none; }
    .mv-when { font-size: 13px; color: var(--accent); font-weight: 700; margin-top: 2px; }
    .mv-blurb { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.4; }
    .mv-for { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .mv-dots { margin-top: 8px; }
    .mv-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--c); background: transparent; color: var(--c);
      font-size: 12px; font-weight: 800; margin: 0 3px 4px 0; padding: 0; cursor: pointer; opacity: .5; vertical-align: top; }
    .mv-dot.want { background: var(--c); color: #fff; opacity: 1; }
    .mv-dot.seen { background: var(--c); color: #fff; opacity: 1; border-color: #fff; }
    .mv-seen .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    .er-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-gap: 14px; }
    .er-tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .er-pic { position: relative; height: 150px; background: linear-gradient(135deg, #4f46e5, #0f172a); overflow: hidden; }
    .er-pic img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .er-pic-shade { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%); }
    .er-pic-name { position: absolute; left: 12px; right: 12px; bottom: 10px; color: #fff; font-size: 18px; font-weight: 800; line-height: 1.2; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
    .er-pic-badge { position: absolute; top: 10px; right: 10px; }
    .er-tile-body { padding: 10px 12px 12px; }
    .er-dots  { display: flex; gap: 3px; margin-top: 8px; flex-wrap: wrap; }

    /* ── Movies ─────────────────────────────────────────────────────── */
    .movies-section { margin-bottom: 26px; }
    .movies-section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
    .movie-card { display: flex; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; align-items: flex-start; }
    .movie-poster { font-size: 26px; flex-shrink: 0; line-height: 1.1; }
    .movie-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .movie-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .movie-date { font-size: 12px; color: var(--muted); }
    .movie-stars { color: #f59e0b; font-size: 13px; letter-spacing: -1px; }
    .movie-soon { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #dbeafe; color: #1e40af; text-transform: uppercase; letter-spacing: .4px; }
    [data-theme="dark"] .movie-soon { background: #1e2a45; color: #93c5fd; }
    .movie-notes { font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; line-height: 1.4; }
    .movie-format { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
    .movie-format-4dx  { background: linear-gradient(135deg,#7c3aed,#db2777); color: #fff; }
    .movie-format-imax { background: #0f172a; color: #60a5fa; }
    [data-theme="dark"] .movie-format-imax { background: #1e2a45; color: #93c5fd; }
    .movie-streaming { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #e0f2fe; color: #0369a1; white-space: nowrap; }
    [data-theme="dark"] .movie-streaming { background: #0c2233; color: #38bdf8; }

    /* ── Strava module ───────────────────────────────────────────── */
    .strava-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
    }
    .strava-logo {
      font-size: 22px; font-weight: 900; color: #fc4c02;
      letter-spacing: -1px; flex-shrink: 0;
    }
    .strava-tagline { font-size: 13px; color: var(--muted); }
    .strava-members { display: flex; flex-direction: column; gap: 28px; }
    .strava-member-block { }
    .strava-member-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .strava-member-name { font-size: 14px; font-weight: 700; }
    .strava-member-stats {
      display: flex; gap: 6px; font-size: 11px; color: var(--muted);
    }
    .strava-week-chart {
      display: flex; align-items: flex-end; gap: 4px;
      height: 52px; margin-bottom: 14px; padding: 0 2px;
    }
    .strava-bar-wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 3px; height: 100%;
    }
    .strava-bar {
      width: 100%; border-radius: 3px 3px 0 0;
      min-height: 3px; transition: height .3s ease;
    }
    .strava-bar-label {
      font-size: 8px; color: var(--muted); white-space: nowrap;
    }
    .strava-activities { display: flex; flex-direction: column; gap: 8px; }
    .strava-activity {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
      transition: opacity .2s;
    }
    .strava-activity.dimmed { opacity: 0.15; }
    .strava-act-icon { font-size: 20px; flex-shrink: 0; }
    .strava-act-info { flex: 1; min-width: 0; }
    .strava-act-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .strava-act-date { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .strava-act-stats {
      display: flex; gap: 14px; flex-shrink: 0; align-items: center;
    }
    .strava-stat { text-align: right; padding-left: 10px; border-left: 1px solid var(--border); }
    .strava-stat-val { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .strava-stat-lbl { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .strava-hr-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
      background: #fee2e2; color: #991b1b; flex-shrink: 0;
    }
    [data-theme="dark"] .strava-hr-badge { background: #2d1515; color: #fca5a5; }
    .strava-empty {
      color: var(--muted); font-size: 14px; padding: 20px 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .strava-empty code {
      font-size: 12px; background: var(--bg); padding: 3px 8px;
      border-radius: 6px; border: 1px solid var(--border);
    }

    /* ── Week Calendar module ────────────────────────────────────── */
    .wk-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; gap: 12px;
    }
    .wk-nav-btn {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 5px 16px;
      font-size: 13px; font-weight: 500; color: var(--muted);
      cursor: pointer; transition: border-color .15s, color .15s;
    }
    .wk-nav-btn:hover { border-color: #aaa; color: var(--text); }
    .wk-nav-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
    .wk-nav-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .wk-outer {
      overflow: auto; -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border); border-radius: var(--radius);
      max-height: 70vh;
    }
    .wk-inner {
      display: grid;
      grid-template-columns: 48px repeat(3, 1fr);
      min-width: 280px;
    }
    /* Sticky header row */
    .wk-corner, .wk-day-head {
      position: sticky; top: 0; z-index: 3;
      background: var(--card);
    }
    .wk-corner {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .wk-day-head {
      padding: 6px 4px 5px; text-align: center;
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .wk-day-head.is-today { background: var(--accent-light); }
    .wk-day-dow {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted);
    }
    .wk-day-num { font-size: 18px; font-weight: 700; line-height: 1.2; }
    .wk-day-head.is-today .wk-day-num { color: var(--accent); }
    /* All-day row — sticky below the day-name header (header ≈ 47px tall) */
    .wk-allday-gutter {
      font-size: 8px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .03em; color: var(--muted);
      padding: 4px 3px; text-align: right;
      border-right: 1px solid var(--border);
      border-bottom: 2px solid var(--border);
      display: flex; align-items: center; justify-content: flex-end;
      position: sticky; top: 47px; z-index: 2; background: var(--card);
    }
    .wk-allday-col {
      border-left: 1px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 3px; min-height: 24px;
      display: flex; flex-direction: column; gap: 2px;
      position: sticky; top: 47px; z-index: 2; background: var(--card);
    }
    .wk-day-head.is-today ~ .wk-allday-col { background: var(--accent-light); }
    .wk-allday-event {
      font-size: 10px; font-weight: 600; color: white;
      padding: 1px 5px; border-radius: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: opacity .15s;
    }
    /* Time gutter */
    .wk-time-gutter {
      border-right: 1px solid var(--border);
      position: relative;
    }
    .wk-hour-label {
      height: 60px; display: flex; align-items: flex-start; padding-top: 3px;
      justify-content: flex-end; padding-right: 5px;
      font-size: 9px; font-weight: 600; color: var(--muted);
      white-space: nowrap;
    }
    /* Day columns */
    .wk-day-col {
      border-left: 1px solid var(--border);
      position: relative;
      height: 1440px; /* 24 hours × 60px */
    }
    .wk-day-col.is-today { background: var(--accent-light); }
    .wk-hour-line {
      position: absolute; left: 0; right: 0;
      border-top: 1px solid var(--border); pointer-events: none;
    }
    .wk-event {
      position: absolute; border-radius: 4px;
      padding: 2px 4px; font-size: 10px; font-weight: 600; color: white;
      overflow: hidden; cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: opacity .15s; line-height: 1.3;
    }
    .wk-event:hover { filter: brightness(1.1); }
    .wk-event.dimmed { opacity: 0.12 !important; }
    .wk-allday-event.dimmed { opacity: 0.12 !important; }
    .wk-event.is-declined { opacity: 0.35 !important; filter: grayscale(.6); }
    .wk-event.is-declined .wk-event-title { text-decoration: line-through; }
    .wk-allday-event.is-declined { opacity: 0.35 !important; filter: grayscale(.6); }
    .wk-allday-event.is-declined { text-decoration: line-through; }
    .wk-event-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wk-event-time  { font-size: 9px; opacity: .8; white-space: nowrap; }
    /* Current-time indicator */
    .wk-now-line {
      position: absolute; left: 0; right: 0;
      border-top: 2px solid var(--urgent); z-index: 3; pointer-events: none;
    }
    .wk-now-dot {
      position: absolute; left: -4px; top: -4px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--urgent);
    }

    /* ── Today / Agenda view ──────────────────────────────────────── */
    .ag-day-section { margin-bottom: 28px; }
    .ag-day-header {
      display: flex; align-items: baseline; gap: 14px;
      padding: 10px 0 8px; border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }
    .ag-day-header.is-today { border-bottom-color: var(--accent); }
    .ag-day-dow { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
    .ag-day-header.is-today .ag-day-dow { color: var(--accent); }
    .ag-day-date { font-size: 14px; font-weight: 600; color: var(--muted); }
    .ag-day-label {
      margin-left: auto; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      background: var(--accent); color: white;
      padding: 2px 9px; border-radius: 10px;
    }
    .ag-allday-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .ag-allday-chip {
      font-size: 12px; font-weight: 600; color: white;
      padding: 4px 12px; border-radius: 12px; cursor: pointer;
      transition: opacity .15s;
    }
    .ag-allday-chip.dimmed { opacity: 0.15; }
    .ag-event {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 11px 14px 11px 10px; margin-bottom: 7px;
      background: var(--card); border-radius: var(--radius);
      cursor: pointer; transition: filter .15s;
    }
    .ag-event:hover { filter: brightness(1.08); }
    .ag-event.dimmed { opacity: 0.15; }
    .ag-event.is-past { opacity: 0.42; }
    .ag-color-bar {
      width: 4px; border-radius: 2px; align-self: stretch;
      display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
      min-height: 20px;
    }
    .ag-color-bar > div { flex: 1; }
    .wk-event-dots { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
    .wk-event-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,.25);
    }
    .ag-time {
      font-size: 13px; font-weight: 700; color: var(--muted);
      min-width: 72px; padding-top: 1px; white-space: nowrap;
    }
    .ag-event.is-declined { opacity: 0.4 !important; filter: grayscale(.6); }
    .ag-event.is-declined .ag-event-title { text-decoration: line-through; }
    .ag-allday-chip.is-declined { opacity: 0.4 !important; filter: grayscale(.6); }
    .ag-allday-chip.is-declined { text-decoration: line-through; }
    .ag-event-body { flex: 1; min-width: 0; }
    .ag-event-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .ag-event-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .ag-empty { font-size: 14px; color: var(--muted); padding: 12px 0 4px; font-style: italic; }

    /* ── Portrait / tablet kiosk layout ─────────────────────────── */
    @media (orientation: portrait), (max-width: 700px) {
      body { padding: 12px; }

      /* Tighter header */
      .hub-header h1 { font-size: 18px; }
      .hub-meta { display: none; } /* hide "Updated X min ago" to save space */

      /* Tabs: two-row, each row scrollable */
      .tab-row { padding-bottom: 2px; }
      .tab { padding: 7px 14px; font-size: 12px; }

      /* Member pills: smaller */
      .member-chip { padding: 4px 10px 4px 6px; font-size: 12px; }
      .member-chip .av { width: 20px; height: 20px; font-size: 9px; }

      /* Calendar: 7 cols is fine on a wide portrait tablet, but reduce cell height */
      .cal-cell { min-height: 90px; padding: 8px 8px; }
      .cal-cell-num { font-size: 17px; }
      .cal-cell-notes { font-size: 10px; -webkit-line-clamp: 3; }

      /* Plan days: single column instead of two */
      .plan-weeks { grid-template-columns: 1fr !important; }

      /* Featured trip: stack map below content on narrow screens */
      .ft-split { grid-template-columns: 1fr !important; }
      .ft-restaurants { grid-template-columns: 1fr !important; }
      .ft-highlights { grid-template-columns: repeat(2, 1fr) !important; }

      /* Modal: take up more of the screen */
      .modal-overlay { padding: 16px; }
      .modal { max-height: min(90vh, 90dvh); }
    }

    /* Extra-narrow phones */
    @media (max-width: 420px) {
      .cal-grid { grid-template-columns: repeat(4, 1fr); }
      .cal-dow:nth-child(n+5):not(.cal-row-gap) { display: none; }
    }
    /* ── Grocery List ──────────────────────────────────────────────── */
    .grocery-form { display: flex; gap: 8px; margin-bottom: 16px; }
    .grocery-input {
      flex: 1; padding: 12px 16px; font-size: 16px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      background: var(--card); color: var(--text);
    }
    .grocery-input:focus { outline: none; border-color: var(--accent); }
    .grocery-add-btn {
      padding: 0 20px; font-size: 15px; font-weight: 600;
      background: var(--accent); color: white; border: none;
      border-radius: var(--radius); cursor: pointer;
    }
    .grocery-add-btn:active { opacity: 0.8; }
    .grocery-list { display: flex; flex-direction: column; gap: 8px; }
    .grocery-qty-wrap { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-right: 8px; flex-shrink: 0; }
    .grocery-qty-btn { background: var(--bg); border: none; font-size: 16px; font-weight: bold; cursor: pointer; padding: 4px 10px; color: var(--text); }
    .grocery-qty-btn:active { background: var(--border); }
    .grocery-qty-input { width: 36px; text-align: center; border: none; border-left: 1.5px solid var(--border); border-right: 1.5px solid var(--border); font-size: 14px; color: var(--text); background: var(--card); padding: 4px 0; -moz-appearance: textfield; }
    .grocery-qty-input::-webkit-outer-spin-button, .grocery-qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .grocery-qty-input:focus { outline: none; }
    .grocery-del-btn {
      background: transparent; border: none; font-size: 18px;
      cursor: pointer; padding: 4px; border-radius: 4px;
    }
    .grocery-del-btn:hover { background: var(--bg); }

    /* ═══════════════════════════════════════════════════════════════
       Redesign (2026-11): minimal ink + hairlines + monospace labels.
       Shares its design language with the trip apps (/trip-app/app.css).
       Kept as one override block so it's easy to review or roll back.
       Old-WebView safe (wall tablet): no `inset`, no flex `gap` reliance.
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Roboto Mono", monospace;
      --bg: #f2f2ef;
      --card: #ffffff;
      --border: rgba(11, 13, 16, .10);
      --text: #0b0d10;
      --muted: rgba(11, 13, 16, .56);
      --accent: #0369a1;
      --accent-light: rgba(3, 105, 161, .07);
      --radius: 14px;
      --shadow: none;
    }
    [data-theme="dark"] {
      --bg: #08090c;
      --card: rgba(255, 255, 255, .035);
      --border: rgba(255, 255, 255, .09);
      --text: #f3f5f7;
      --muted: rgba(243, 245, 247, .55);
      --accent: #7dd3fc;
      --accent-light: rgba(125, 211, 252, .07);
      --shadow: none;
    }
    body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    [data-theme="dark"] body {
      background: radial-gradient(1000px 520px at 12% -12%, rgba(125, 211, 252, .08), rgba(125, 211, 252, 0) 62%), var(--bg);
      background-attachment: fixed;
    }

    /* Header */
    .hub-header h1 { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; }
    .hub-header h1::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 10px; vertical-align: 1px; }
    .hub-meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
    .theme-toggle { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px 13px; }

    /* Clock: big and thin, no colored slab */
    .clock-card { background: transparent; color: var(--text); border-radius: 0; padding: 4px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .clock-time { font-size: 88px; font-weight: 200; letter-spacing: -.06em; }
    .clock-secs { font-family: var(--mono); font-size: 18px; font-weight: 400; opacity: .38; padding-bottom: 14px; }
    .cistercian-glyph-block svg { stroke: var(--text); filter: none; opacity: .85; }
    .cistercian-lbl, .clock-ampm, .clock-date, .summary-toggle { font-family: var(--mono); letter-spacing: .16em; text-transform: uppercase; }
    .cistercian-colon { font-weight: 200; }
    .clock-ampm { font-size: 12px; font-weight: 500; opacity: .6; }
    .clock-date { font-size: 11px; font-weight: 400; opacity: .6; margin-top: 6px; }
    .summary-toggle { color: var(--accent); opacity: 1; font-size: 10px; margin-top: 8px; }
    .summary-drawer { color: var(--muted); }

    /* Tabs + member filters */
    .tab { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .13em; text-transform: uppercase; background: transparent; border: 1px solid var(--border); padding: 9px 16px; border-radius: 999px; }
    .tab:hover { border-color: var(--muted); }
    .tab.active { background: var(--text); border-color: var(--text); color: var(--bg); }
    .tab::after { background: var(--accent); height: 2px; }
    .tab-dot, .tab.active .tab-dot { display: none; }
    .member-chip { background: transparent; border: 1px solid var(--border); font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; padding: 4px 13px 4px 4px; }
    .member-chip .av { width: 22px; height: 22px; font-size: 10px; font-family: var(--sans); letter-spacing: 0; }

    /* Section labels → monospace micro-labels */
    .section-title, .trip-section-label, .movies-section-label, .ft-sub-title, .plan-week-label,
    .modal-section-label, .er-stat-label, .strava-stat-lbl, .cal-dow, .wk-day-dow, .ag-day-label, .wk-hour-label {
      font-family: var(--mono); letter-spacing: .14em; font-weight: 500;
    }
    .ag-day-dow { font-weight: 700; letter-spacing: -.035em; }
    .ag-day-date { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
    .today-badge, [data-theme="dark"] .today-badge { font-family: var(--mono); font-weight: 500; letter-spacing: .14em; background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .wk-day-num { font-weight: 300; letter-spacing: -.03em; }

    /* Badges */
    .status-badge, [data-theme="dark"] .status-badge,
    .status-badge.planning, .status-badge.upcoming, .status-badge.active {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: var(--mono); font-weight: 500; letter-spacing: .12em;
    }
    .status-badge.upcoming, .status-badge.active { color: var(--accent); border-color: var(--accent); }

    /* Trips: hairline cards instead of saturated gradients, no emoji */
    .ft-section { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .ft-banner { background: var(--card); min-height: 0; padding: 26px 24px 24px; border-radius: 0; border-bottom: 1px solid var(--border); }
    .ft-banner::after, .ft-highlight::after { display: none; }
    .ft-emoji, .ft-h-emoji, .ft-act-emoji, .trip-row-emoji { display: none; }
    .ft-name { color: var(--text); font-size: 44px; font-weight: 800; letter-spacing: -.045em; }
    .ft-dest, .ft-desc { color: var(--muted); }
    .ft-dates { color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .ft-badge { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: var(--mono); font-weight: 500; letter-spacing: .14em; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .ft-app { background: var(--text); color: var(--bg); box-shadow: none; border-radius: 10px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; padding: 11px 16px; }
    .ft-highlights { background: var(--border); }
    .ft-highlight { background: var(--card) !important; min-height: 92px; }
    [data-theme="dark"] .ft-highlight { background: #0d0f13 !important; }
    .ft-h-label { color: var(--text); }
    .ft-h-caption { color: var(--muted); }
    .trip-row-name { font-weight: 600; }
    .trip-row-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
    .ag-day-label { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: var(--mono); font-weight: 500; letter-spacing: .14em; }

    /* Escape rooms / movies / workouts: decorative emoji off, mono badges */
    .er-outcome, .movie-poster, .strava-act-icon { display: none; }
    .er-time-badge, [data-theme="dark"] .er-time-badge { font-family: var(--mono); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
    .er-room-name, .movie-title { letter-spacing: -.01em; }

    .trip-row-app { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
  </style>
</head>

  <div class="hub-header">

<script>
const plan        = window.PLAN_DATA || { summary: "", days: [], flags: [], actionItems: [], shoppingList: [] };
const family      = window.FAMILY_DATA || { trips: [], escapeRooms: [], movies: [] };
let   calData     = { events: [] };   // populated async from the Worker
const stravaData  = window.STRAVA_DATA || { members: {} };

// ── Shared-event deduplication ────────────────────────────────────
// When the same Google Calendar invite appears on multiple family
// members' calendars it has the same event ID. Group those into one
// merged event with a `memberIds` array so views can render a single
// row/block with multi-color indicators instead of N duplicates.
function mergeSharedEvents(events) {
  const groups = new Map();
  for (const e of events) {
    // Use the raw Google event ID as the primary key; fall back to
    // title+startAt for the rare case where IDs differ across copies.
    const key = e.id ?? `${e.title}|${e.startAt}`;
    if (!groups.has(key)) {
      groups.set(key, { ...e, memberIds: [e.memberId] });
    } else {
      const g = groups.get(key);
      if (!g.memberIds.includes(e.memberId)) g.memberIds.push(e.memberId);
    }
  }
  return Array.from(groups.values());
}

// ── Live calendar fetch ────────────────────────────────────────────
// The API_TOKEN Worker secret, handed to the page by /api/config.js (which sits
// behind your auth) — lets the page read live events without Google credentials.
const WORKER_TOKEN = (window.HUB_CONFIG || {}).eventsToken || "";

async function loadCalendarData() {
  try {
    const resp = await fetch("/api/events?days=90", {
      headers: { "X-Api-Token": WORKER_TOKEN },
    });
    if (!resp.ok) throw new Error(`/api/events returned ${resp.status}`);
    const raw = await resp.json();
    calData = { ...raw, events: mergeSharedEvents(raw.events || []) };
    renderTodayView();
    renderThreeDayCalendar();
  } catch (e) {
    console.warn("Calendar fetch failed:", e.message);
  }
}
// All calendars/dates in this app are in the family's timezone (family.timezone
// in family.yaml), regardless of the UTC offsets embedded in event data or the
// device's own OS timezone.
const HUB_CONFIG = window.HUB_CONFIG || { title: "Family Hub", timezone: "America/Chicago", members: [], tripApps: {} };
const TZ = HUB_CONFIG.timezone;
function centralParts(date) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: TZ, hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit"
  }).formatToParts(date);
  const get = t => parts.find(p => p.type === t)?.value;
  return {
    dateStr: `${get("year")}-${get("month")}-${get("day")}`,
    hour: parseInt(get("hour"), 10),
    minute: parseInt(get("minute"), 10)
  };
}
function centralDateStr(date) { return centralParts(date).dateStr; }
function addDaysStr(dateStr, n) {
  const d = new Date(dateStr + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

const today   = centralDateStr(new Date());
let activeFilter = null;

// Members (in display order), their colors and names, and which trips have a
// phone app: all from workspace/family.yaml via /api/config.js.
const MEMBERS       = HUB_CONFIG.members.map(m => m.id);
const MEMBER_COLORS = Object.fromEntries(HUB_CONFIG.members.map(m => [m.id, m.color]));
const MEMBER_NAMES  = Object.fromEntries(HUB_CONFIG.members.map(m => [m.id, m.name]));
// trips.yaml trip id → app path. Declared up here because buildModules() runs
// before the trip helpers below.
const TRIP_APPS = HUB_CONFIG.tripApps;
const GROCERY_NOT_SET_UP = "Grocery email isn't set up: add hub.groceryEmailUrl to family.yaml (see app/extras/grocery-email.gs).";
document.title = HUB_CONFIG.title;
document.getElementById("hub-title").textContent = HUB_CONFIG.title;
// Household records (pets, and more to come) are edited on their own page.
if (HUB_CONFIG.household) document.getElementById("household-link").classList.add("shown");

// Make a whole trip card/row open its trip app (big tap target for the wall tablet).
function linkTripApp(el, tripId) {
  const href = TRIP_APPS[tripId];
  if (!href) return;
  el.classList.add('has-trip-app');
  el.setAttribute('role', 'link');
  el.tabIndex = 0;
  el.addEventListener('click', e => { if (!e.target.closest('a')) location.href = href; });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') location.href = href; });
}

const FLAG_ICONS = { urgent: "🚨", warning: "⚠️", info: "ℹ️" };

// ── Helpers ────────────────────────────────────────────────────────
function fmt(d)     { return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function fmtFull(d) { return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}); }
function fmtDOW(d)  { return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"}).toUpperCase(); }
function fmtShort(d){ return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }

function mdot(id, size=18) {
  const bg = MEMBER_COLORS[id]||"#888";
  const letter = size >= 14 ? (MEMBER_NAMES[id]||'?')[0] : '';
  return `<span class="mdot" style="width:${size}px;height:${size}px;background:${bg}">${letter}</span>`;
}

// ── Pre-index flags / actions by date ──────────────────────────────
const flagsByDate = {}, actionsByDate = {};
plan.flags.forEach(f => {
  const ms = f.message.match(/(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}/g);
  (ms||[]).forEach(m => {
    const d = new Date(m+", 2026");
    if (!isNaN(d)) { const k=d.toISOString().slice(0,10); (flagsByDate[k]=flagsByDate[k]||[]).push(f); }
  });
});
plan.actionItems.forEach(a => {
  if (a.dueDate) (actionsByDate[a.dueDate]=actionsByDate[a.dueDate]||[]).push(a);
});

// ── Modules: how the page draws each stream component ─────────────
// The stream (/api/stream?output=hub-page, docs/stream.md) decides what
// rotates, in what order, and for how long. onCard shows one card (a photo,
// a trip); a module without it shows its component as a whole.
const MODULES = [
  { id: "today",        component: "today",        label: "Today",        build: buildTodayView,        onActivate: renderTodayView },
  { id: "week",         component: "week",         label: "Week",         build: withViewToggle(buildThreeDayCalendar, "calendar", "14 days ›"), onActivate: resetDayView },
  { id: "calendar",     component: "week",         label: "14 days",      build: withViewToggle(buildCalendar, "week", "‹ 3 days"), tab: false },
  { id: "plan",         component: "plan",         label: "Weekly Plan",  build: buildPlan },
  // Each kid's chores, ticked off right here (the wall tablet).
  { id: "chores",       component: "chores",       label: "Chores",       build: buildChoreBoard,  onActivate: loadChoreBoard },
  { id: "photos",       component: "photos",       label: "Photos",       build: buildPhotos,      onCard: showPhotoCard, onActivate: nextPhoto },
  // Named by its cards ("The dogs"), since that depends on the family's pets.
  { id: "pet-portraits", component: "pet-portraits", label: "Pets", labelFromCard: true, build: buildPortraits, onCard: showPortrait, onActivate: () => showPortrait(null) },
  { id: "trips",        component: "trips",        label: "Trips",        build: buildTrips,       onCard: c => renderTrips(c.id, c), onActivate: () => renderTrips(null) },
  { id: "past-trips",   component: "past-trips",   label: "Past Trips",   build: buildPastTrips,   onCard: c => renderPastTrips(c.id, c), onActivate: () => renderPastTrips(null) },
  { id: "grocery",      component: "grocery",      label: "Grocery",      build: buildGroceryList, onActivate: loadGrocery },
  { id: "escape-rooms", component: "escape-rooms", label: "Escape Rooms", build: buildEscapeRooms, onActivate: loadEscapeRooms },
  { id: "movies",       component: "movies",       label: "Movies",       build: buildMovies, onActivate: loadMoviesView },
  { id: "workouts",     component: "workouts",     label: "Workouts",     build: buildStrava },
  // Any component without a view above is drawn from its cards' glance, so a
  // new component shows here the day it's added (docs/stream.md).
  { id: "glance",       component: null,           label: "",             build: buildGlance, tab: false },
];
const GLANCE = MODULES.length - 1;
let streamCards = [];                  // the stream's cards, for the glance view
let glanceShown = null;                // the component the glance view is showing
// Tabs that stay even when their component has nothing to show: you add to them here.
const ALWAYS_TABS = ["today", "week", "grocery"];
const IDLE_RESUME_MS = 2 * 60_000;     // rotation resumes after two idle minutes
const FALLBACK_DWELL_MS = 15_000;      // if the stream can't be reached

// ── Rotation state (must be declared before bootstrap calls initRotation) ──
let currentModule = 0;
const rot = { slots: [], i: -1, timer: null, idle: null, paused: false };
// Trip cards for the Trips and Past Trips views, and the shared grocery list.
const tripsState = { cards: [], loaded: false, trips: null, past: null, focus: { trips: null, "past-trips": null }, slides: {} };
const TRIP_SLIDE_MS = 5000;
const OLD_GROCERY_KEY = 'hub-grocery-list';   // v0.7 and earlier kept a list on each device
const grocery = { items: [], listEl: null, statusEl: null };
// The chore board (declared here: the views are built before the code below runs).
const board = { el: null, data: null, busy: false };

// ── Module-level constants (must precede bootstrap's buildModules() call) ──
// Photos module: a new photo every PHOTO_MS while its tab is showing.
const PHOTO_MS = 10_000;
const photoState = { list: [], i: 0, imgs: [], front: 0, loadedAt: 0, timer: null };

// ── Calendar state (must precede buildModules()) ─────────────────
const HOURS_START  = 0;   // 12am
const HOURS_END    = 24;  // 12am next day  (24 hours × 60px = 1440px total)
const PX_PER_MIN   = 1;
let dayOffset      = 0;   // 3-day view: how many days from today the window starts
let dayContainer   = null;
let dayGridArea    = null;
let todayContainer = null;

// ── Strava helpers (must precede buildModules() → buildStrava()) ──────────
const SPORT_ICON = {
  Run: '🏃', VirtualRun: '🏃', TrailRun: '🏃',
  Ride: '🚴', VirtualRide: '🚴', MountainBikeRide: '🚴',
  Swim: '🏊', Walk: '🚶', Hike: '🥾',
  Workout: '💪', WeightTraining: '🏋️', Yoga: '🧘',
  Soccer: '⚽', Tennis: '🎾', Golf: '⛳',
};
function fmtDist(meters) {
  const miles = meters / 1609.344;
  return miles >= 10 ? miles.toFixed(1) : miles.toFixed(2);
}
function fmtPace(metersPerSec) {
  if (!metersPerSec) return '--';
  const minsPerMile = 26.8224 / metersPerSec;
  const m = Math.floor(minsPerMile);
  const s = Math.round((minsPerMile - m) * 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function fmtDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function fmtElevation(meters) {
  return Math.round(meters * 3.28084) + ' ft';
}
function activityDate(isoUtc) {
  return new Date(isoUtc).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

// ── Bootstrap ─────────────────────────────────────────────────────
document.getElementById("generated-at").textContent =
  plan.generatedAt ? "Updated " + new Date(plan.generatedAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
document.getElementById("summary-text").textContent = plan.summary;

// ── Clock ────────────────────────────────────────────────────────

// ── Cistercian numeral renderer ──────────────────────────────────
// Staff: vertical line cx=22 from ty=6 to by=78, midpoint my=42.
// Top-right  = units,    top-left  = tens  (mirror left)
// Bottom-right = hundreds (flip down), bottom-left = thousands (flip+mirror)
function cistercianInner(n) {
  const cx=22, ty=6, my=42, by=78, rx=42, lx=2;
  const L = (x1,y1,x2,y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  const s = [];
  s.push(L(cx,ty,cx,by));              // staff (always)

  const u = n % 10,            t = Math.floor(n/10)  % 10,
        h = Math.floor(n/100) % 10,    k = Math.floor(n/1000) % 10;

  // Top-right (units 1–9)
  if (u===1||u===5||u===7||u===9) s.push(L(cx,ty,rx,ty));   // top horiz
  if (u===2||u===8||u===9)        s.push(L(cx,my,rx,my));   // mid horiz
  if (u===3)                       s.push(L(cx,ty,rx,my));   // diag ↘
  if (u===4||u===5)               s.push(L(cx,my,rx,ty));   // diag ↗
  if (u>=6)                        s.push(L(rx,ty,rx,my));   // right vert

  // Top-left (tens) — mirror of top-right
  if (t===1||t===5||t===7||t===9) s.push(L(cx,ty,lx,ty));
  if (t===2||t===8||t===9)        s.push(L(cx,my,lx,my));
  if (t===3)                       s.push(L(cx,ty,lx,my));
  if (t===4||t===5)               s.push(L(cx,my,lx,ty));
  if (t>=6)                        s.push(L(lx,ty,lx,my));

  // Bottom-right (hundreds) — top-right flipped vertically
  if (h===1||h===5||h===7||h===9) s.push(L(cx,by,rx,by));  // bot horiz
  if (h===2||h===8||h===9)        s.push(L(cx,my,rx,my));  // mid horiz
  if (h===3)                       s.push(L(cx,by,rx,my));  // diag ↗
  if (h===4||h===5)               s.push(L(cx,my,rx,by));  // diag ↘
  if (h>=6)                        s.push(L(rx,my,rx,by));  // right vert

  // Bottom-left (thousands) — mirror of bottom-right
  if (k===1||k===5||k===7||k===9) s.push(L(cx,by,lx,by));
  if (k===2||k===8||k===9)        s.push(L(cx,my,lx,my));
  if (k===3)                       s.push(L(cx,by,lx,my));
  if (k===4||k===5)               s.push(L(cx,my,lx,by));
  if (k>=6)                        s.push(L(lx,my,lx,by));

  return s.join('');
}

function tickClock() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat("en-US", {
